<title>יומן Upper Lower</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* Layout: a one-column training notebook. Four tabs pick the workout; every exercise row opens into a
   blueprint stage (animated figure, working muscles in anatomical red) above its set log. The coach chat
   docks beside the list on wide screens and becomes a full sheet on phones. */
:root{
  --paper:#EDF1F7; --surface:#FFFFFF; --surface-2:#F4F6FB; --ink:#13203A; --ink-2:#53627E; --ink-3:#8290AA; --line:#D5DDEA;
  --accent:#1C4FD6; --on-accent:#FFFFFF; --accent-soft:#E2EAFF;
  --muscle:#D92B45; --muscle-soft:#FCE4E8; --warn:#B5541A; --warn-soft:#FBE9DC;
  --ok:#0F7F57; --ok-soft:#DAF2E8; --on-ok:#FFFFFF; --rest:#9A5B00; --rest-soft:#FFEFCF;
  --rest-inv:#FFB648; --ok-inv:#4FD8A6;
  --stage:#F8FAFE; --grid:#E3E9F4; --floor:#EAEFF7; --ground:#9AA8C0;
  --fig:#2F3F5E; --fig-far:#A6B2C9; --equip:#C6CEDD; --equip-2:#8794AD; --pad:#56657F; --cable:#6F7D97;
  --f-display:"Karantina","Arial Narrow","Arial Hebrew",sans-serif;
  --f-body:"IBM Plex Sans Hebrew","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1220; --surface:#131C2F; --surface-2:#18233A; --ink:#E8EEF9; --ink-2:#A6B4CE; --ink-3:#7686A3; --line:#26334E;
    --accent:#8DAEFF; --on-accent:#0A1430; --accent-soft:#1B2A50;
    --muscle:#FF5C70; --muscle-soft:#3A1620; --warn:#FF9A5C; --warn-soft:#38200F;
    --ok:#46D19E; --ok-soft:#12362A; --on-ok:#06231A; --rest:#FFB648; --rest-soft:#38290B;
    --rest-inv:#9A5B00; --ok-inv:#0F7F57;
    --stage:#0F192C; --grid:#18243C; --floor:#131F36; --ground:#4A5B7C;
    --fig:#CBD6EC; --fig-far:#56668A; --equip:#33425F; --equip-2:#5A6A8C; --pad:#8494B4; --cable:#8090AE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1220; --surface:#131C2F; --surface-2:#18233A; --ink:#E8EEF9; --ink-2:#A6B4CE; --ink-3:#7686A3; --line:#26334E;
  --accent:#8DAEFF; --on-accent:#0A1430; --accent-soft:#1B2A50;
  --muscle:#FF5C70; --muscle-soft:#3A1620; --warn:#FF9A5C; --warn-soft:#38200F;
  --ok:#46D19E; --ok-soft:#12362A; --on-ok:#06231A; --rest:#FFB648; --rest-soft:#38290B;
  --rest-inv:#9A5B00; --ok-inv:#0F7F57;
  --stage:#0F192C; --grid:#18243C; --floor:#131F36; --ground:#4A5B7C;
  --fig:#CBD6EC; --fig-far:#56668A; --equip:#33425F; --equip-2:#5A6A8C; --pad:#8494B4; --cable:#8090AE;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
bdi{unicode-bidi:isolate;white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{direction:rtl}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* brand row */
.brand-row{display:flex;align-items:center;gap:12px;padding-block:14px 6px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.02em;flex:none}
.brand-t{flex:1;min-width:0;display:grid}
.brand-t strong{font-size:16px;font-weight:700;line-height:1.2}
.brand-t span{font-size:12px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.big{min-height:54px;font-size:17px;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:6px 2px;color:var(--ink-2);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.chat-open{flex:none;color:var(--accent)}

/* tabs */
.tabs-band{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-block:10px 8px}
.tab{position:relative;display:flex;flex-direction:column;align-items:flex-start;padding:7px 9px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:start;min-width:0}
.tab small{font-size:11px;color:var(--ink-3);font-weight:600;line-height:1.3}
.tab b{font-family:var(--f-display);font-weight:700;font-size:25px;line-height:.95;direction:ltr;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] small{color:color-mix(in srgb,var(--paper) 68%,transparent)}
.flag{position:absolute;top:-8px;inset-inline-end:6px;font-size:10px;font-weight:700;line-height:1.5;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.flag.live{background:var(--ok);color:var(--on-ok)}

/* columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start;padding-bottom:132px}
.main{min-width:0;display:grid;gap:14px}

.banner{background:var(--ok-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.banner b{color:var(--ok)}
.banner p{flex:1;min-width:0}
.banner button{background:none;border:0;color:var(--ink-2);padding:2px}

.wk-head{padding-top:18px;display:grid;gap:8px}
.wk-kicker{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.wk-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,15vw,84px);line-height:.8;direction:ltr;text-align:right;text-wrap:balance;padding-top:4px}
.wk-meta{color:var(--ink-2);font-size:14px}
.wk-prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wk-prog .bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.wk-prog .bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .3s}

/* exercise list */
.ex-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px)}
.ex.open{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.ex-head{display:grid;grid-template-columns:20px 64px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;border:0;text-align:start}
.ex-n{font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--ink-3);line-height:1;text-align:center}
.ex.done .ex-n{color:var(--ok)}
.ex-thumb{width:64px;height:46px;border-radius:8px;background:var(--stage);border:1px solid var(--line);display:block}
.ex-title{min-width:0;display:grid}
.ex-name{font-weight:600;font-size:15.5px;line-height:1.25;direction:ltr;text-align:right;unicode-bidi:isolate}
.ex-sub{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.ex-side{display:grid;justify-items:end;gap:6px}
.ex-rx{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:.9;white-space:nowrap}
.dots{display:flex;gap:4px;direction:ltr}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-3)}
.dots i.on{background:var(--ok);border-color:var(--ok)}

.ex-body{border-top:1px solid var(--line);padding:12px;display:grid;gap:14px}
.ex-a,.ex-b{display:contents}
.stage-wrap{order:1;position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--stage)}
.stage{display:block;width:100%;max-width:100%;aspect-ratio:360/260}
.stage-tag,.stage-phase{position:absolute;inset-inline-start:8px;font-size:11.5px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 86%,transparent);color:var(--ink-2)}
.stage-tag{top:8px}
.stage-phase{bottom:8px}
.stage-phase.hot{color:var(--muscle);border-color:color-mix(in srgb,var(--muscle) 40%,transparent)}
.stage-play{position:absolute;top:6px;inset-inline-end:6px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);display:grid;place-items:center;color:var(--ink-2)}
.rx-row{order:2;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end}
.rx-k{display:block;font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.03em}
.rx-v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:.9;display:block;padding-top:3px}
.rx-v small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;line-height:1.3;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);margin-top:4px}
.chip.l1{color:var(--rest);background:var(--rest-soft);border-color:transparent}
.chip.l2{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.l3{color:var(--muscle);background:var(--muscle-soft);border-color:transparent}
.how{order:3;display:grid;gap:8px}
.muscles{font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.muscles i{width:10px;height:10px;border-radius:50%;background:var(--muscle);flex:none;transform:translateY(1px)}
.cues{list-style:none;margin:0;padding:0;display:grid;gap:5px;color:var(--ink-2);font-size:14px}
.cues li{padding-inline-start:16px;position:relative}
.cues li::before{content:"";position:absolute;inset-inline-start:2px;top:.62em;width:7px;height:2px;background:var(--ink-3);border-radius:2px}
.sets{order:4;display:grid;gap:6px}
.set{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;align-items:center}
.set-n{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.2}
.set-n em{display:block;font-style:normal;font-size:10.5px;color:var(--muscle)}
.field{position:relative;min-width:0}
.field input{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 30px 0 6px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:center}
.field input::placeholder{color:var(--ink-3);font-weight:500;font-size:16px}
.field span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-3);pointer-events:none}
.set-done{width:50px;height:46px;border-radius:10px;border:1.5px solid var(--ink-3);background:var(--surface);display:grid;place-items:center;color:var(--ink-3)}
.set.done .set-done{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.set.done .field input{background:var(--ok-soft);border-color:transparent}
.last{order:5;font-size:13px;color:var(--ink-2);display:grid;gap:4px}
.last .up{color:var(--ok);font-weight:600}
.ask{order:6;width:100%;border-style:dashed;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:transparent}

.wk-foot{display:grid;gap:8px;justify-items:center;padding-top:6px}
.foot-note{font-size:13px;color:var(--ink-2);text-align:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13px}
.history{display:grid;gap:8px;padding-top:10px}
.history h2{font-family:var(--f-display);font-size:30px;line-height:1}
.history ul{list-style:none;margin:0;padding:0;display:grid}
.history li{display:flex;gap:10px;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;font-variant-numeric:tabular-nums}
.history li span:last-child{color:var(--ink-2);text-align:end}
.history p{font-size:13.5px;color:var(--ink-2)}

/* chat */
.chat{flex-direction:column;background:var(--surface);min-height:0}
.chat-h{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.chat-h div{flex:1;min-width:0}
.chat-h h2{font-family:var(--f-display);font-size:30px;line-height:.95}
.chat-h p{font-size:12.5px;color:var(--ink-2)}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn.send{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chat-ctx{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.chat-ctx select{flex:1;min-width:0;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);padding:0 8px;font-size:14px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.empty{margin:auto 0;display:grid;gap:12px;color:var(--ink-2);font-size:14px}
.empty strong{color:var(--ink);font-size:15px}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sug{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:7px 12px;font-size:13.5px;text-align:start;line-height:1.3}
.msg{max-width:90%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-end-end-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-end-start-radius:4px}
.msg.sys{align-self:center;max-width:100%;font-size:13px;color:var(--ink-2);background:none;text-align:center;padding:2px 8px}
.msg img{display:block;max-width:170px;max-height:170px;border-radius:8px;margin-bottom:6px}
.msg p{margin:0 0 6px}.msg p:last-child{margin-bottom:0}
.msg ul{margin:0 0 6px;padding-inline-start:18px}
.msg .note{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}
.msg .think{color:var(--ink-3)}
.verdict{display:inline-block;font-weight:700;font-size:13px;padding:1px 10px;border-radius:99px;margin-bottom:6px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.mid{background:var(--rest-soft);color:var(--rest)}
.verdict.no{background:var(--muscle-soft);color:var(--muscle)}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.attach{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.attach img{width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.attach span{flex:1}
.attach button{background:none;border:0;color:var(--ink-2);padding:6px}
.comp-note{font-size:12.5px;color:var(--warn)}
.comp-row{display:flex;gap:6px;align-items:flex-end;min-width:0}
.comp-row textarea{flex:1;min-width:0;width:0;height:44px;max-height:120px;resize:none;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:10px 12px;font-size:16px;line-height:1.4}
.fab{position:fixed;z-index:35;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 20px rgb(0 0 0 / .24)}
.fab svg.i{width:24px;height:24px}
.has-rest .fab{bottom:calc(96px + env(safe-area-inset-bottom,0px))}

@media (max-width:999.98px){
  .chat{position:fixed;inset:0;z-index:60;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .chat.open{display:flex}
}
@media (min-width:1000px){
  .cols{grid-template-columns:minmax(0,1fr) 384px;padding-bottom:110px}
  .chat{display:flex;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);height:calc(100vh - 172px);min-height:420px;margin-top:18px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .fab,.chat-close,.chat-open{display:none}
}
@media (min-width:700px){
  .ex-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
  .ex-a,.ex-b{display:grid;gap:14px;min-width:0}
}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:var(--paper);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rest-in{max-width:720px;margin-inline:auto;display:flex;align-items:center;gap:12px}
.rest-time{font-family:var(--f-display);font-size:52px;font-weight:700;line-height:.85;font-variant-numeric:tabular-nums;direction:ltr;min-width:84px;text-align:center}
.rest-mid{flex:1;min-width:0;display:grid;gap:6px}
.rest-label{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-label b{color:var(--rest-inv)}
.rest.ready .rest-label b,.rest.go .rest-label b{color:var(--ok-inv)}
.rest-track{height:5px;border-radius:99px;background:color-mix(in srgb,var(--paper) 22%,transparent);position:relative;overflow:hidden;direction:ltr}
.rest-track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--rest-inv);border-radius:99px}
.rest.ready .rest-track i,.rest.go .rest-track i{background:var(--ok-inv)}
.rest-btns{display:flex;gap:6px}
.rest-btns button{min-width:44px;height:44px;border-radius:11px;border:1px solid color-mix(in srgb,var(--paper) 30%,transparent);background:transparent;color:var(--paper);font-weight:700;font-size:13.5px;padding:0 9px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
@media (max-width:420px){.rest-btns .opt{display:none}.rest-time{font-size:46px;min-width:74px}}
@media (min-width:1000px){.rest{left:auto;right:max(16px,calc((100vw - 1180px)/2 + 16px));bottom:16px;width:min(560px,calc(100vw - 448px));border-radius:16px;padding:12px 16px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="app" id="app" dir="rtl" lang="he">
  <div class="wrap brand-row">
    <span class="mark" aria-hidden="true">UL</span>
    <div class="brand-t"><strong>יומן Upper / Lower</strong><span id="syncNote">4 אימונים במחזור, לפי הסדר</span></div>
    <button class="btn chat-open" id="chatOpen" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M5 6h14v10h-8l-4 3v-3H5z"/></svg>שאל את Claude</button>
  </div>
  <div class="tabs-band"><nav class="wrap tabs" id="tabs" role="tablist" aria-label="בחירת אימון"></nav></div>

  <div class="wrap cols">
    <main class="main">
      <div class="banner" id="banner" hidden></div>
      <section class="wk-head" id="wkHead"></section>
      <ol class="ex-list" id="exList"></ol>
      <section class="wk-foot" id="wkFoot"></section>
      <section class="history" id="history"></section>
    </main>

function splitVerdict(text, final) {

async function sendChat(preset) {

function showImgBtns() { $('#camBtn').hidden = $('#galBtn').hidden = !chat.canImg; }
