<title>gymi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: four places and one sheet. "Today" shows the player, the next workout and the week as a path of four stops;
   a workout shows one exercise at a time: its name and what is asked, the demo, a slim row of sets and three quiet
   actions, with a dock at the bottom that logs a set in one tap and times the rest; the profile holds the player's
   character, level and achievements, with the settings behind one row; "Progress" keeps the strength and the history.
   The look is quiet: a grey ground, white cards, large type and one accent colour. Things are told apart by the space
   around them and by hairlines before boxes, and each screen has one main thing to do. Gold belongs to the game alone:
   points, levels and rewards. The coach chat is a full sheet on phones and sits beside the page on wide screens. */
:root{
  --paper:#F5F5F8; --surface:#FFFFFF; --surface-2:#F2F2F6; --surface-3:#E7E6EE; --ink:#0F0E14; --ink-2:#4D4B58; --ink-3:#686675; --ink-4:#9C9AA8; --line:#E7E6EE; --lip:#D8D6E0;
  /* one colour style. gymi is purple on black, white and grays: the four workouts are four violets (royal, indigo, orchid,
     night), each with its fill, its darker edge, a soft tint and the ink that reads on white. The game is gold (points,
     levels, medals). Warmth is the one thing that stands against the purple: the streak's flame and the muscle that is working */
  --w0:#6D3FE0; --w0-lip:#5229C4; --w0-soft:#EEE8FF; --w0-ink:#5A2FCC;
  --w1:#4B45D6; --w1-lip:#3631AE; --w1-soft:#E7E6FF; --w1-ink:#3E38C2;
  --w2:#9446D6; --w2-lip:#7530B3; --w2-soft:#F4E9FF; --w2-ink:#8137C2;
  --w3:#2F2366; --w3-lip:#1E1645; --w3-soft:#ECE9F6; --w3-ink:#3B2D80;
  --gold:#F2B02E; --gold-lip:#C98A12; --gold-ink:#5C3A00; --flame:#FF8A00; --flame-2:#FFD23F; --flame-ink:#B85600; --accent-lip:#5229C4;
  --accent:#6D3FE0; --on-accent:#FFFFFF; --accent-soft:#EEE8FF; --accent-ink:#5A2FCC;
  --muscle:#E0452B; --muscle-ink:#C93A1F; --muscle-soft:#FDE8E2; --warn:#A44A10; --warn-soft:#FBEBDD;
  --ok:#5A2FCC; --ok-soft:#EEE8FF; --on-ok:#FFFFFF; --rest:#8A5A00; --rest-soft:#FFF1D1;
  --xp:#8F5B00; --xp-soft:#FFF0CC; --xp-fill:#F2B02E;
  --stage:#F5F6F8; --grid:#ECEEF2; --grid-2:#E1E4EA; --floor:#ECEEF2; --ground:#A3A9B5; --shadow:#DDE0E6;
  --fig:#6B7280; --fig-hi:#9097A3; --fig-lo:#4B5260; --fig-far:#B9BEC8; --cloth:#6D3FE0; --cloth-far:#C3B1F5;
  --shoe:#1B1F27; --shoe-far:#8A909C; --sole:#F4F5F7; --hair:#1B1F27;
  --equip:#CDD1D9; --equip-hi:#EEF0F3; --equip-2:#858C99; --pad:#2D323C; --pad-hi:#5E6573; --plate:#2D323C; --plate-hi:#858C99; --cable:#646B78;
  --f-display:"Rubik",-apple-system,"Segoe UI","Arial Hebrew",Arial,sans-serif;
  --f-body:"Rubik",-apple-system,"Segoe UI","Arial Hebrew",Arial,sans-serif;
  --r:24px; --tabbar:66px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B0A0F; --surface:#17161D; --surface-2:#22212A; --surface-3:#2E2C37; --ink:#F5F4F8; --ink-2:#B8B5C4; --ink-3:#9693A3; --ink-4:#6E6B7C; --line:#2B2933;
    --accent:#A98BFF; --on-accent:#1A0B3D; --accent-soft:#251B3F; --accent-ink:#C4B0FF;
    --muscle:#FF7A52; --muscle-ink:#FF8E6B; --muscle-soft:#3A1A10; --warn:#FFA468; --warn-soft:#38200F;
    --ok:#C4B0FF; --ok-soft:#251B3F; --on-ok:#1A0B3D; --rest:#FFC15E; --rest-soft:#38290B;
    --xp:#FFCB6B; --xp-soft:#3A2A08; --xp-fill:#F2B02E;
    --lip:#060509; --accent-lip:#7A5AE0; --flame-ink:#FFB24D; --w3:#4A3A96; --w3-lip:#33276E;
    --w0-soft:#251B3F; --w0-ink:#C4B0FF; --w1-soft:#1D1C45; --w1-ink:#A9A5FF; --w2-soft:#2D1A42; --w2-ink:#D8ABFF; --w3-soft:#1D1832; --w3-ink:#BBAEF2;
    --stage:#111318; --grid:#1A1D23; --grid-2:#23272F; --floor:#16181D; --ground:#4B5160; --shadow:#0A0B0E;
    --fig:#B9BEC8; --fig-hi:#DEE1E7; --fig-lo:#8F96A3; --fig-far:#4F5563; --cloth:#A98BFF; --cloth-far:#45367C;
    --shoe:#6A7180; --shoe-far:#3D424D; --sole:#D9DCE2; --hair:#6A7180;
    --equip:#3B404B; --equip-hi:#5E6573; --equip-2:#6F7684; --pad:#565D6B; --pad-hi:#8A91A0; --plate:#565D6B; --plate-hi:#979EAC; --cable:#858C99;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B0A0F; --surface:#17161D; --surface-2:#22212A; --surface-3:#2E2C37; --ink:#F5F4F8; --ink-2:#B8B5C4; --ink-3:#9693A3; --ink-4:#6E6B7C; --line:#2B2933;
  --accent:#A98BFF; --on-accent:#1A0B3D; --accent-soft:#251B3F; --accent-ink:#C4B0FF;
  --muscle:#FF7A52; --muscle-ink:#FF8E6B; --muscle-soft:#3A1A10; --warn:#FFA468; --warn-soft:#38200F;
  --ok:#C4B0FF; --ok-soft:#251B3F; --on-ok:#1A0B3D; --rest:#FFC15E; --rest-soft:#38290B;
  --xp:#FFCB6B; --xp-soft:#3A2A08; --xp-fill:#F2B02E;
  --lip:#060509; --accent-lip:#7A5AE0; --flame-ink:#FFB24D; --w3:#4A3A96; --w3-lip:#33276E;
  --w0-soft:#251B3F; --w0-ink:#C4B0FF; --w1-soft:#1D1C45; --w1-ink:#A9A5FF; --w2-soft:#2D1A42; --w2-ink:#D8ABFF; --w3-soft:#1D1832; --w3-ink:#BBAEF2;
  --stage:#111318; --grid:#1A1D23; --grid-2:#23272F; --floor:#16181D; --ground:#4B5160; --shadow:#0A0B0E;
  --fig:#B9BEC8; --fig-hi:#DEE1E7; --fig-lo:#8F96A3; --fig-far:#4F5563; --cloth:#A98BFF; --cloth-far:#45367C;
  --shoe:#6A7180; --shoe-far:#3D424D; --sole:#D9DCE2; --hair:#6A7180;
  --equip:#3B404B; --equip-hi:#5E6573; --equip-2:#6F7684; --pad:#565D6B; --pad-hi:#8A91A0; --plate:#565D6B; --plate-hi:#979EAC; --cable:#858C99;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet-in:focus,.ob:focus{outline:none}
h1,h2,h3,h4,p{margin:0}
bdi{unicode-bidi:isolate;white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* top row and navigation */
.brand{display:flex;align-items:center;gap:10px;min-height:64px;padding-block:14px 6px}
.logo{display:grid;direction:ltr;justify-items:start;line-height:1}
.logo-w{font-weight:800;font-size:26px;line-height:1;letter-spacing:-.03em;color:var(--ink)}
.logo-i{color:var(--accent)}
.logo small{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding-top:4px}
.sync{flex:1;min-width:0;font-size:12px;color:var(--ink-3);text-align:end;line-height:1.3}
.back,.top-list{display:none;width:44px;height:44px;flex:none;border:0;border-radius:50%;background:none;place-items:center;color:var(--ink);padding:0}
.top-list{margin-inline-end:-10px}
.top-list svg{width:24px;height:24px}
.wk-title{display:none;min-width:0;justify-items:center;text-align:center;line-height:1.25}
.wk-title b{max-width:100%;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:340px){.wk-title b{font-size:14.5px}}
.wk-title .sub{font-size:13px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.app[data-view="workout"] .wk-title{display:grid;flex:1}
.app[data-view="workout"] .top-list{display:grid}
.back{margin-inline-start:-10px}
.back svg{width:26px;height:26px;stroke-width:2.2}
.app[data-view="workout"] .back{display:grid}
.ava{display:block;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);overflow:hidden;flex:none}
.ava .av{width:100%;height:100%}
.tabbar{position:fixed;z-index:65;left:0;right:0;bottom:0;display:flex;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:grid;justify-items:center;gap:2px;min-height:46px;padding:3px 0 1px;border:0;border-radius:14px;background:none;color:var(--ink-3);font-size:11.5px;font-weight:500;line-height:1.25}
.tabbar svg{width:25px;height:25px;stroke-width:1.9}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar button.live svg{overflow:visible}
.tabbar button.live{position:relative}
.tabbar button.live::after{content:"";position:absolute;top:5px;inset-inline-start:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:16px;border:0;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.big{min-height:58px;font-size:18px;width:100%;border-radius:20px}
.btn.danger{color:var(--muscle-ink)}
.btn:disabled{opacity:.4;cursor:default}
 /* every press gives under the finger, and springs back when it is let go */
button,[role="button"]{transition:transform .3s cubic-bezier(.34,1.45,.64,1),background-color .15s,color .15s,box-shadow .15s}
button:active:not(:disabled),[role="button"]:active{transform:scale(.95);transition:transform .1s ease-out,background-color .15s,color .15s,box-shadow .15s}
.btn.big:active:not(:disabled),.hit:active,.sug:active,.m-row:active,.sw-row:active,.ex-head:active,.row-b:active,.ob-opt:active,.setp:active{transform:scale(.97)}
.stage-wrap:active,.player:active{transform:scale(.985)}
.tab:active .dot,.player:active .p-ava{transform:scale(.92)}
.tab:active,.goal:active{transform:none}
/* the set that was just logged fills in with a little bounce; a personal best glows gold */
.setp.pop{animation:set-pop .5s cubic-bezier(.3,1.7,.5,1)}
.setp.pr-pop{animation:set-pop .5s cubic-bezier(.3,1.7,.5,1),pr-glow 1.2s ease-out}
@keyframes set-pop{0%{transform:scale(.8);background:var(--accent-soft)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes pr-glow{0%,40%{box-shadow:0 0 0 3px var(--xp-fill)}100%{box-shadow:0 0 0 0 transparent}}
/* points that fly up from where they were earned */
.fly{position:fixed;z-index:85;transform:translate(-50%,0);font-size:20px;font-weight:800;color:var(--xp);text-shadow:0 1px 0 var(--surface);pointer-events:none;animation:fly .9s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.link{position:relative;background:none;border:0;padding:8px 4px;color:var(--accent);font-size:14px;font-weight:600}
.link::after,.lk-sw::after{content:"";position:absolute;inset:-8px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn.send{background:var(--accent);color:var(--on-accent)}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start;padding-bottom:calc(var(--tabbar) + 44px + env(safe-area-inset-bottom,0px))}
.app[data-view="workout"] .cols{padding-bottom:calc(var(--dock-h,300px) + 36px)}
.main{min-width:0;display:grid;gap:14px}
.view{display:none;gap:14px;min-width:0}
.pf-main{display:grid;gap:14px;min-width:0}
.app[data-view="home"] .v-home,.app[data-view="workout"] .v-workout,.app[data-view="profile"] .v-profile{display:grid}
.app:not([data-view="workout"]) .dock{display:none}

/* shared pieces */
.page-h{display:grid;gap:2px;padding:14px 4px 4px}
.cap{font-size:15px;font-weight:500;color:var(--ink-2)}
.big{font-size:40px;font-weight:800;line-height:1.12;letter-spacing:-.02em}
.card{background:var(--surface);border-radius:var(--r);padding:20px}
.sec{font-size:14px;font-weight:700;color:var(--ink-2);padding:10px 4px 0}
.sec small{font-size:13px;font-weight:600;color:var(--ink-3);margin-inline-start:4px}
.kicker{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.banner{background:var(--accent-soft);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:14px}
.banner b{color:var(--accent-ink)}
.banner p{flex:1;min-width:0}
.banner button{background:none;border:0;color:var(--ink-2);padding:2px}
.banner .link{padding:0 2px;color:var(--ink);font-weight:600;font-size:inherit}
.banner.warn{background:var(--warn-soft)}
.banner.warn b{color:var(--warn)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;border-radius:14px;background:var(--surface-2)}
.seg button{min-height:40px;padding:4px 6px;border-radius:11px;border:0;background:none;font-size:13px;font-weight:600;line-height:1.2;color:var(--ink-2)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* the game layer: level, points */
.lv-badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 9px;border-radius:99px;background:var(--xp-soft);color:var(--xp);font-size:13px;font-weight:800;line-height:1;white-space:nowrap;font-style:normal}
.xpbar{display:block;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.xpbar i{display:block;height:100%;min-width:8px;border-radius:99px;background:var(--xp-fill);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.xp-tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:99px;background:var(--xp-soft);color:var(--xp);font-size:13px;font-weight:800;line-height:1;white-space:nowrap}
.hit .xp-tag,.btn.primary .xp-tag{background:color-mix(in srgb,var(--on-accent) 20%,transparent);color:var(--on-accent)}
.app[data-view="workout"] .sync{display:none}
.toast{position:fixed;z-index:80;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:99px;background:var(--ink);color:var(--paper);font-size:17px;font-weight:700;white-space:nowrap;box-shadow:0 12px 30px -14px rgb(0 0 0 / .55)}
.toast svg{color:var(--xp-fill);fill:var(--xp-fill)}
.toast.in{animation:toast-in .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes toast-in{from{transform:translate(-50%,-18px);opacity:0}}

/* today */
.player{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;padding:10px 4px 4px;border:0;background:none;text-align:start}
.p-ava{width:72px;height:72px;border-radius:50%;overflow:hidden;background:var(--accent-soft);transition:transform .08s}
.p-ava.r0{background:var(--surface-3)}.p-ava.r4,.p-ava.r5,.p-ava.r6{background:var(--xp-soft)}
.p-txt{display:grid;gap:6px;min-width:0}
.p-txt>b{font-size:27px;font-weight:800;line-height:1.15;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-rank{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.p-streak{display:grid;justify-items:center;color:var(--xp);padding-inline:4px}
.p-streak svg{width:26px;height:26px;fill:var(--xp-soft)}
.p-streak b{font-size:15px;font-weight:800;line-height:1.1}
.card.next{display:grid;gap:2px;padding:20px 22px 22px}
.next-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.next .k{font-size:15px;font-weight:600;color:var(--ink-2)}
.next h2{font-size:38px;font-weight:800;line-height:1.12;letter-spacing:-.02em}
.next .meta{font-size:15px;color:var(--ink-2);padding:2px 0 16px}
.week{display:grid;gap:4px;padding:8px 12px 14px}
.card-h{display:flex;align-items:center;gap:8px;min-height:44px;padding-inline:8px}
.card-h h2{flex:1;font-size:17px;font-weight:700}
.card-h h2 small{font-size:14px;font-weight:500;color:var(--ink-2)}
.go-link{display:inline-flex;align-items:center;gap:2px;min-height:44px;border:0;background:none;color:var(--accent);font-size:15px;font-weight:600;padding:0}
.go-link svg{width:18px;height:18px;stroke-width:2.2}
/* the week as a path: four stops joined by a line that fills as workouts are finished */
.week-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{position:relative;display:grid;justify-items:center;gap:6px;padding:6px 2px 4px;border:0;background:none;min-width:0}
.tab+.tab::before{content:"";position:absolute;top:31px;inset-inline-start:-50%;width:100%;height:3px;background:var(--surface-3)}
.tab.done+.tab::before{background:var(--accent)}
.tab .dot{position:relative;z-index:1;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);font-size:19px;font-weight:800;line-height:1;transition:transform .08s}
.tab .dot svg{width:24px;height:24px;stroke-width:2.6}
.tab.done .dot{background:var(--accent);color:var(--on-accent)}
.tab.next .dot,.tab.live .dot{background:var(--surface);box-shadow:inset 0 0 0 3px var(--accent);color:var(--accent-ink)}
.tab b{font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;color:var(--ink-2)}
.tab.next b,.tab.live b{color:var(--accent-ink);font-weight:700}

/* one workout: a progress strip, then one exercise at a time */
.hero{display:grid;gap:10px}
.hero:empty{display:none}
.meta{color:var(--ink-2);font-size:14px;padding-top:6px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.clock{display:inline-flex;align-items:center;gap:5px}
.clock svg{width:15px;height:15px;color:var(--ink-3)}
.clock b{font-weight:600}
.wk-bar{padding:0 2px}
.wk-bar .bar{height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.wk-bar .bar i{display:block;height:100%;min-width:4px;border-radius:99px;background:var(--accent);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.pre{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.pre-h{display:flex;gap:10px;align-items:center}
.pre-h b{flex:1;min-width:0;font-size:16px;line-height:1.3}
.pre-h .link{flex:none;padding:8px 0;white-space:nowrap}
.pre.gate{justify-items:center;text-align:center;gap:8px;padding:34px 22px 18px;margin-top:12vh}
.pre.gate h2{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.pre.gate p{font-size:15px;color:var(--ink-2)}
.pre-q{display:grid;gap:8px;width:100%;padding-top:14px}
.pre>.btn{margin-top:4px}
.app.pre-on .fx,.app.pre-on .dock,.app.pre-on .wk-bar{display:none}
.pre-row{display:grid;gap:6px}
.pre-row>span{font-size:14px;font-weight:700}
.pre-fx{font-size:13.5px;color:var(--ink-2);background:var(--accent-soft);border-radius:14px;padding:10px 12px}

/* the list of all exercises (in its sheet): plain rows, told apart by a hairline */
.ex-list{list-style:none;margin:0;padding:0}
.ex-list .ex+.ex{border-top:1px solid var(--line)}
.ex-head{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 2px;background:none;border:0;text-align:start}
.ex-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:700;line-height:1;color:var(--ink-2);background:var(--surface-2)}
.ex.cur .ex-n{background:var(--accent);color:var(--on-accent)}
.ex.done .ex-n{background:var(--accent-soft);color:var(--accent-ink)}
.ex.done .ex-n svg{width:15px;height:15px;stroke-width:3}
.ex-thumb{width:56px;height:40px;display:block}
.ex-title{min-width:0;display:grid}
.ex-name{font-weight:600;font-size:16px;line-height:1.3}
.ex-sub{font-size:13px;color:var(--warn)}
.ex-list .ex.done .ex-name{color:var(--ink-2)}
.ex-rx{font-size:14.5px;font-weight:500;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ex-rx.part{font-weight:700;color:var(--accent-ink)}
.ex.off .ex-n{color:var(--ink-3)}
.ex-list .ex.off .ex-rx{color:var(--ink-3);text-decoration:line-through}
.ls-links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px}
.ls-links .link{padding-inline:0}
.ls-act{display:grid;gap:4px;justify-items:center}
.ls-act .btn{color:var(--accent)}

/* the exercise on screen: its name and one line of what is asked, the demo, a slim row of sets, three quiet actions.
   One box only (the demo); everything else is grouped by the space around it */
.fx{list-style:none;margin:0;padding:0}
.fx .ex{display:grid;gap:16px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 10px)}
.fx .ex.in-next{animation:fx-next .28s cubic-bezier(.2,.8,.2,1)}
.fx .ex.in-prev{animation:fx-prev .28s cubic-bezier(.2,.8,.2,1)}
@keyframes fx-next{from{opacity:0;transform:translateX(-10px)}}
@keyframes fx-prev{from{opacity:0;transform:translateX(10px)}}
[dir="ltr"] .i.dir{transform:scaleX(-1)}
[dir="ltr"] .fx .ex.in-next{animation-name:fx-prev}
[dir="ltr"] .fx .ex.in-prev{animation-name:fx-next}
.fx-head{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:4px;padding-top:14px}
.fx-nav{width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink-3);padding:0}
.fx-nav svg{width:24px;height:24px;stroke-width:2.2}
.fx-nav:disabled{opacity:.25;cursor:default}
.fx-t{display:grid;justify-items:center;text-align:center;gap:6px;min-width:0}
.fx .ex-name{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.fx-rx{font-size:14.5px;line-height:1.4;color:var(--ink-2);text-wrap:balance}
.ex-body{display:grid;gap:14px}
.stage-wrap{position:relative;display:block;width:100%;padding:0;border:0;border-radius:var(--r);overflow:hidden;background:var(--surface)}
.stage{display:block;width:100%;max-width:100%;aspect-ratio:360/260}
.stage-play{position:absolute;inset:0;display:none;place-items:center;color:var(--ink-3)}
.stage-wrap[aria-pressed="true"] .stage-play{display:grid}
.stage-play svg{width:46px;height:46px}
.muscles{font-size:13.5px;font-weight:500;line-height:1.4;color:var(--ink-2);display:flex;gap:8px;align-items:baseline;justify-content:center;padding-inline:4px}
.muscles i{width:8px;height:8px;border-radius:50%;background:var(--muscle);flex:none}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px}
.setp{display:flex;align-items:center;justify-content:center;gap:4px;min-height:46px;min-width:0;padding:0 6px;border:0;border-radius:14px;background:var(--surface);font-size:15.5px;font-weight:700;line-height:1.2;color:var(--ink-3);white-space:nowrap}
.setp .v{color:var(--ink);direction:ltr}
.setp small{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.setp.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.setp .pr{display:grid}
.setp .pr svg{width:14px;height:14px;color:var(--xp-fill);fill:var(--xp-fill)}
.cut-note{grid-column:1/-1;font-size:13.5px;color:var(--ink-2);text-align:center}
.ex-acts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
/* what one can do with the exercise: three small buttons that stand on a lip like every other button */
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:0;padding:0 6px;border:0;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--lip);margin-bottom:3px;color:var(--ink);font-size:14.5px;font-weight:700;line-height:1.2}
.act svg{width:18px;height:18px;flex:none;color:var(--wk-ink);stroke-width:2.4}
.act:active{transform:scale(.96)}
/* the goal of a set, in the bar: a small label that says why when it is tapped */
.goal{position:relative;display:inline-block;flex:none;border:0;font-size:12px;font-weight:700;line-height:1.7;padding:0 9px;border-radius:99px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.goal::after{content:"";position:absolute;inset:-10px -6px}
.goal.g-reps{color:var(--accent-ink);background:var(--accent-soft)}
.goal.g-wt{color:var(--xp);background:var(--xp-soft)}
.goal.g-down{color:var(--warn);background:var(--warn-soft)}
.goal.g-cal{color:var(--rest);background:var(--rest-soft)}
.dk-why{font-size:13.5px;line-height:1.4;color:var(--ink-2)}
/* one question after an exercise; a strong pain report is answered with a headline, one line and one action */
.fbk{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;justify-items:start}
.fbk .seg{width:100%}
.fb-stop{display:grid;gap:6px;justify-items:start;padding:14px 16px;border-radius:18px;background:var(--surface-2)}
.fb-stop b{font-size:16px;line-height:1.3}
.fb-stop p{font-size:14px;color:var(--ink-2)}
.fb-stop .btn{min-height:44px;background:var(--surface);margin-block:2px}
.fb-stop .fine{font-size:12.5px;color:var(--ink-3)}
/* one tap away: how to do it, and more */
.cues{list-style:none;margin:0;padding:0;display:grid;gap:10px;color:var(--ink);font-size:16px;line-height:1.45}
.cues li{padding-inline-start:18px;position:relative}
.cues li::before{content:"";position:absolute;inset-inline-start:2px;top:.68em;width:7px;height:2px;background:var(--ink-4);border-radius:2px}
.hw .fine{font-size:12.5px;color:var(--ink-3)}
.en-name{font-size:12.5px;color:var(--ink-3);direction:ltr;text-align:right}
.note{display:grid;gap:6px}
.note>span{font-size:13px;color:var(--ink-2);font-weight:600}
.note-in{display:block;width:100%;min-height:64px;resize:none;border-radius:16px;border:0;background:var(--surface-2);padding:12px 14px;font-size:16px;line-height:1.4}
.prev-line{font-size:14px;color:var(--ink-2)}
.trend{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--surface-2)}
.trend .k{font-size:12.5px;color:var(--ink-3);font-weight:600}
.trend .val{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.02em;direction:ltr;text-align:right}
[dir="ltr"] .trend .val{text-align:left}
.trend .val small{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.trend .d{font-size:13px;font-weight:600;color:var(--ink-2)}
.trend .d.up{color:var(--ok)}
.trend .d.dn{color:var(--warn)}
.trend svg{grid-row:1/4;grid-column:2;width:118px;height:44px;overflow:visible;direction:ltr}
.mr-acts{display:grid;gap:8px}
.ask{color:var(--accent)}

/* progress */
.gains,.history{display:grid;gap:8px}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);overflow:hidden}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center;min-height:64px;padding:10px 18px;font-variant-numeric:tabular-nums}
.rows li+li{border-top:1px solid var(--line)}
.h-t,.g-t{font-weight:600;font-size:15.5px;line-height:1.3}
.h-s,.g-s{grid-column:1;color:var(--ink-2);font-size:13.5px}
.rows li.tap{display:block;padding:0}
.row-b{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center;width:100%;min-height:64px;padding:10px 18px;border:0;background:none;text-align:start}
.row-b.one{min-height:56px}
.row-b .h-s{grid-column:1}
.row-b svg{grid-column:2;grid-row:1/3;width:18px;height:18px;color:var(--ink-4)}
.g-d{grid-column:2;grid-row:1/3;font-size:15px;font-weight:700;color:var(--ink-2)}
.g-d.up{color:var(--ok)}
.g-d.dn{color:var(--warn)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-inline-end:4px}
.sec-h .go-link,.sec-h .link{position:relative;min-height:0;padding:10px 0 0;font-size:14px}
.sec-h .go-link::after{content:"";position:absolute;inset:-8px}
.empty-note{font-size:14px;color:var(--ink-2);padding:0 4px}
.history>.link{justify-self:start}
.backup{display:grid;gap:8px;padding-top:4px}
.backup-act{display:flex;flex-wrap:wrap;gap:8px}
.backup-act .btn{flex:1;min-width:104px;padding:0 12px}
.backup-note{font-size:14px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:14px;padding:10px 14px}
.empty .btn{justify-self:start}

/* dock: log a set, then rest */
.dock{position:fixed;z-index:40;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 96%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-radius:28px 28px 0 0;box-shadow:0 0 0 1px var(--line),0 -18px 40px -26px rgb(0 0 0 / .4)}
.dock-in{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.dk-top{display:flex;align-items:center;gap:8px;min-height:40px}
.dk-set{flex:1;min-width:0;font-size:14.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-set b{color:var(--ink);font-weight:800}
.dk-top .btn{min-height:44px;padding:0 14px}
.dk-note{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--ink-2);line-height:1.35}
.dk-note svg{width:14px;height:14px;margin-top:2px;color:var(--accent)}
.dk-note span{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dk-nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.num{display:flex;align-items:center;height:66px;padding:0 4px;border-radius:20px;background:var(--surface-2);direction:ltr;min-width:0}
.step,.rstep{width:44px;height:52px;flex:none;border:0;border-radius:16px;background:none;color:var(--ink);font-size:27px;font-weight:400;line-height:1;display:grid;place-items:center;padding:0}
.dk-kg,.dk-reps{flex:1;min-width:0;height:100%;display:grid;align-content:center;justify-items:center}
.dk-kg b,.dk-reps b{font-size:25px;font-weight:800;line-height:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.dk-kg small,.dk-reps small{font-size:11.5px;font-weight:600;line-height:14px;color:var(--ink-3);direction:rtl}
[dir="ltr"] .dk-kg small,[dir="ltr"] .dk-reps small{direction:ltr}
.dk-kg.ghost b,.dk-reps.ghost b{color:var(--ink-2)}
.num input{width:100%;height:46px;border:0;border-radius:12px;background:var(--surface);text-align:center;font-size:24px;font-weight:800;direction:ltr;outline:2px solid var(--accent);padding:0}
.hit{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:20px;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700;transition:transform .08s,background .15s}
.hit svg{width:24px;height:24px;stroke-width:2.6}
.hit.hit-on{background:var(--ok);color:var(--on-ok);transform:scale(.98)}
.dk-row{display:flex;gap:10px;align-items:center}
.dk-msg{flex:1;min-width:0;font-size:16px;font-weight:700}
.dk-msg small{display:block;font-size:13px;font-weight:500;color:var(--ink-2)}
.dk-row .btn{min-height:54px;border-radius:18px;padding:0 20px;font-size:16px}
.dk-row .btn svg{width:18px;height:18px}
.rt{display:flex;align-items:center;gap:14px}
.rt-time{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;direction:ltr;min-width:106px;text-align:center}
.rt-mid{flex:1;min-width:0;display:grid;gap:6px}
.rt-state{display:flex;gap:8px;font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.rt-state span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rt-state b{color:var(--ink);font-weight:700}
.dock.ready .rt-state b,.dock.go .rt-state b{color:var(--ok)}
.rt-track{height:6px;border-radius:99px;background:var(--surface-3);position:relative;overflow:hidden}
.rt-track i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:var(--accent);border-radius:99px}
.dock.ready .rt-track i,.dock.go .rt-track i{background:var(--ok)}
.rt-log{font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rt-log .link{padding:6px 6px;margin-block:-6px;font-size:13px}
.rt-log .pr{margin:0}
.rt-log .xp-tag{height:20px;font-size:12px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.rt-btns{display:flex;gap:8px}
.rt-btns button{min-width:56px;height:50px;border-radius:16px;border:0;background:var(--surface-2);color:var(--ink);font-weight:700;font-size:14px;padding:0 10px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rt-btns .go{flex:1;background:var(--accent);color:var(--on-accent);font-size:16px}
.fb-dock{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.fb-h{display:flex;align-items:center;gap:8px}
.fb-h b{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock.rest .fb-dock{border-top:1px solid var(--line);padding-top:10px}

/* chat with the coach */
.chat{flex-direction:column;background:var(--surface);min-height:0}
.chat-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-h .ava{width:46px;height:46px}
.chat-h div{flex:1;min-width:0}
.chat-h h2{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.chat-h p{font-size:13px;color:var(--ink-2);line-height:1.35}
.chat-h .icon-btn{width:40px;height:40px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.empty{margin:auto 0;display:grid;justify-items:center;text-align:center;gap:8px;color:var(--ink-2);font-size:15px;padding-block:8px}
.ava.big{width:88px;height:88px;margin-bottom:6px}
.empty strong{color:var(--ink);font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.empty>span{max-width:300px}
.empty .btn{margin-top:8px}
.sugs{display:grid;gap:8px;width:100%;padding-top:12px}
.sug{width:100%;min-height:50px;padding:8px 16px;border:0;border-radius:16px;background:var(--surface-2);font-size:15px;font-weight:600;line-height:1.3;text-align:center;color:var(--ink)}
.row{display:flex;align-items:flex-end;gap:8px}
.row.u{justify-content:flex-end}
.ava.sm{width:30px;height:30px}
.msg{max-width:84%;padding:11px 15px;border-radius:20px;font-size:15.5px;line-height:1.55;overflow-wrap:anywhere}
.msg.u{background:var(--accent);color:var(--on-accent);border-end-end-radius:6px}
.msg.a{background:var(--surface-2);border-end-start-radius:6px}
.msg img{display:block;max-width:170px;max-height:170px;border-radius:12px;margin-bottom:6px}
.msg p{margin:0 0 6px}.msg p:last-child{margin-bottom:0}
.msg ul{margin:0 0 6px;padding-inline-start:18px}
.msg .note{display:block;font-size:12.5px;color:var(--ink-3);margin-top:6px}
.msg.u .note{color:inherit;opacity:.8}
.think{display:inline-flex;gap:5px;align-items:center;height:22px}
.think i{width:7px;height:7px;border-radius:50%;background:var(--ink-4);animation:think 1.1s ease-in-out infinite}
.think i:nth-child(2){animation-delay:.16s}.think i:nth-child(3){animation-delay:.32s}
@keyframes think{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.msg .logged{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ok)}
.msg .logged .link{padding:0 4px}
.verdict{display:inline-block;font-weight:700;font-size:13px;line-height:1.7;padding:0 10px;border-radius:99px;margin-bottom:6px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.mid{background:var(--rest-soft);color:var(--rest)}
.verdict.no{background:var(--muscle-soft);color:var(--muscle-ink)}
.composer{padding:8px 12px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border-top:1px solid var(--line)}
/* what the question is about: a small pill above the field */
.chat-ctx{position:relative;justify-self:start;display:flex;align-items:center;gap:6px;max-width:100%;min-height:40px;padding-inline:14px 34px;border-radius:99px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.chat-ctx select{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;height:40px;border:0;background:none;padding:0;font-size:14px;font-weight:600;color:var(--ink);text-overflow:ellipsis}
.chat-ctx svg{position:absolute;inset-inline-end:10px;width:16px;height:16px;color:var(--ink-3);pointer-events:none}
.attach{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2)}
.attach img{width:48px;height:48px;object-fit:cover;border-radius:12px}
.attach span{flex:1}
.attach button{background:none;border:0;color:var(--ink-2);padding:6px}
.comp-note{font-size:13px;color:var(--warn)}
/* one bar: attach, write, send */
.comp-row{display:flex;gap:2px;align-items:flex-end;min-width:0;padding:5px;border-radius:27px;background:var(--surface-2)}
.comp-row .icon-btn{width:44px;height:44px;background:none}
.comp-row .icon-btn.send{background:var(--accent);color:var(--on-accent)}
.comp-row textarea{flex:1;min-width:0;width:0;height:44px;max-height:120px;resize:none;border:0;background:none;padding:10px 8px;font-size:16px;line-height:1.5}
.comp-row textarea:focus{outline:none}
.comp-row:focus-within{box-shadow:0 0 0 2px var(--accent)}

/* sheets: summary, editor, swap, mesocycle */
.sheet{position:fixed;inset:0;z-index:70;display:grid;place-items:end center;background:rgb(8 10 14 / .45);padding-top:calc(24px + env(safe-area-inset-top,0px))}
.sheet-in{position:relative;width:min(520px,100%);max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:28px 28px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.sheet-in::before{content:"";justify-self:center;width:36px;height:5px;border-radius:3px;background:var(--surface-3)}
.sheet h2{font-size:30px;font-weight:800;line-height:1.12;letter-spacing:-.02em}
.sheet h2 small{font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.sheet h3{font-size:16px;font-weight:700}
.sheet h4{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:baseline;padding-top:4px}
.sheet h4 small{font-size:12.5px;font-weight:600;color:var(--warn)}
.sheet p{font-size:14.5px;color:var(--ink-2)}
.sheet section{display:grid;gap:10px}
.sheet .ms-sub{font-size:13.5px}
.ed-h{display:flex;align-items:flex-start;gap:10px}
.ed-h div{flex:1;min-width:0}
.ed-date{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);font-weight:600}
.ed-date input{flex:1;min-width:0;height:48px;border-radius:14px;border:0;background:var(--surface-2);padding:0 12px;font-size:16px}
.ed-note{font-size:13.5px}
.ed-list{display:grid;gap:16px}
.ed-ex{display:grid;gap:6px}
.ed-ex h3{font-size:15px;font-weight:700}
.ed-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto minmax(0,1fr) 44px;gap:6px;align-items:center}
.ed-row>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.ed-f{position:relative;display:block;min-width:0}
.ed-f input{width:100%;height:48px;border-radius:14px;border:0;background:var(--surface-2);padding:0 30px 0 6px;font-size:18px;font-weight:700;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.ed-f span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--ink-3);pointer-events:none}
.ed-row.on .ed-f input{background:var(--accent-soft)}
.ed-clr{width:44px;height:48px;border-radius:14px;border:0;background:none;display:grid;place-items:center;color:var(--ink-3)}
.ed-clr svg{width:16px;height:16px}
.ed-row:not(.on) .ed-clr{visibility:hidden}
.ed>.link{justify-self:start;padding-inline:0}
.ed-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:12px calc(20px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-20px - env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ed-act .btn.primary{margin-inline-start:auto}
.ms-act{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:center}
.ms-act:empty{display:none}
.ms-act .link{padding-inline:0}
.sw h2{font-size:24px}
.mu-row{display:flex;gap:6px;overflow-x:auto;margin-inline:-20px;padding:2px 20px;scrollbar-width:none}
.mu-row::-webkit-scrollbar{display:none}
.mu-row button{flex:none;min-height:40px;padding:0 14px;border-radius:99px;border:0;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.mu-row button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sw-list{list-style:none;margin:0;padding:0}
.sw-opt+.sw-opt{border-top:1px solid var(--line)}
.sw-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;width:100%;min-height:64px;padding:10px 2px;border:0;background:none;text-align:start}
.sw-t{display:grid;gap:1px;min-width:0}
.sw-t b{font-size:16px;font-weight:600;line-height:1.3}
.sw-t>span{font-size:13.5px;color:var(--ink-2)}
.sw-opt.on .sw-t b{color:var(--accent-ink)}
.sw-b{display:flex;gap:8px;padding:0 2px 14px}
.sw-b .btn{flex:1;min-height:48px}
.sw-more{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px}
.sw-more .link{padding-inline:0}
/* a short menu: a title, what it stands at, and the way in */
.menu{list-style:none;margin:0;padding:0}
.menu li+li{border-top:1px solid var(--line)}
.m-row{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:6px 2px;border:0;background:none;text-align:start;font-size:16px;font-weight:600;color:var(--ink)}
.m-row>span{flex:1;min-width:0}
.m-row small{font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.m-row small.warn{color:var(--warn);font-weight:600}
.m-row svg{width:18px;height:18px;color:var(--ink-4)}
.mr .m-row{padding-block:0;min-height:48px}
.ms.pg h2{font-size:24px;padding-top:8px}
.ms.pg .fx-nav{margin-inline-start:-10px}
.wk-strip{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px}
.wk-strip li{display:grid;justify-items:center;gap:1px;padding:9px 2px;border-radius:14px;background:var(--surface-2);min-width:0}
.wk-strip small{font-size:11px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.wk-strip li{align-content:center}
.wk-strip b{font-size:12.5px;line-height:1.2;text-align:center}
.wk-strip li.cur{background:var(--accent);color:var(--on-accent)}
.wk-strip li.cur small{color:inherit;opacity:.85}
.wk-strip li.dl:not(.cur) b{color:var(--ok)}
.vol{display:grid;gap:10px}
.vol-row{display:grid;grid-template-columns:minmax(0,104px) minmax(0,1fr) 34px;gap:2px 10px;align-items:center}
.vol-n{font-size:13.5px;font-weight:600;line-height:1.2}
.vol-bar{position:relative;height:14px}
.vol-bar .band{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--surface-3)}
.vol-bar .val{position:absolute;inset-inline-start:0;top:4px;height:6px;min-width:2px;border-start-end-radius:4px;border-end-end-radius:4px;background:var(--accent)}
.vol-row.under .val,.vol-row.over .val{background:var(--warn)}
.vol-v{display:grid;justify-items:end;line-height:1.1}
.vol-v b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.vol-flag{grid-column:1/-1;font-size:12.5px;font-weight:700;color:var(--warn)}
.bl-w{display:grid;gap:8px}
.bl-once{font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.bl-row{display:flex;align-items:center;gap:10px}
.bl-n{flex:1;min-width:0;display:grid}
.bl-n b{font-size:14px;font-weight:600;unicode-bidi:plaintext;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl-n small{font-size:12.5px;color:var(--ink-2)}
.bl-ed{display:flex;gap:4px;flex:none}
.bl-ed button{width:40px;height:44px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--ink-2);padding:0}
.bl-ed button:disabled{opacity:.3;cursor:default}
.bl-ed .rm{color:var(--muscle-ink)}
.bl-ed svg{width:18px;height:18px}
.bl-act{display:flex;justify-content:space-between;gap:10px}
.bl-act .link{padding-inline:0;min-height:44px}
.stp{display:flex;align-items:center;flex:none;direction:ltr}
.stp button{width:44px;height:44px;border-radius:50%;border:0;background:none;font-size:24px;font-weight:400;line-height:1;color:var(--ink-2)}
.stp button:active:not(:disabled){background:var(--surface-2)}
.stp button:disabled{opacity:.3;cursor:default}
.stp b{min-width:28px;text-align:center;font-size:17px;font-weight:800;line-height:1}
.inc{display:grid}
.inc-row{display:flex;align-items:center;gap:10px;min-height:56px;font-size:16px;font-weight:600}
.inc-row+.inc-row{border-top:1px solid var(--line)}
.inc-row span{flex:1;min-width:0}
.inc-row select{height:44px;border-radius:14px;border:0;background:var(--surface-2);padding:0 10px;font-size:16px}
.sum-list{list-style:none;margin:0;padding:0;display:grid}
.sum-list li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;font-size:15px}
.sum-list li+li{border-top:1px solid var(--line)}
.sum-list li>span{min-width:0}
.sum-list b{flex:none;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sum-list b.up{color:var(--ok)}
.sum-list b.dn{color:var(--warn)}
.ms .sum-line{font-size:15px;color:var(--ink-2)}

/* profile */
.pf-top{position:relative;display:grid;justify-items:center;gap:8px;background:var(--surface);border-radius:var(--r);padding:18px 20px 22px;text-align:center}
.pf-edit{position:absolute;top:14px;inset-inline-end:14px}
.pf-edit svg,.pf-top .btn svg{width:18px;height:18px}
.pf-stage{width:min(220px,60%)}
.pf-name{font-size:32px;font-weight:800;line-height:1.12;letter-spacing:-.02em;overflow-wrap:anywhere;min-width:0}
.pf-rank{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600;color:var(--ink-2);padding-bottom:6px}
.pf-top .btn{margin-top:8px}
.xp{display:grid;gap:6px;width:100%}
.xp .xpbar{height:12px}
.xp-l{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
p.xp-l{display:block;text-align:center;font-weight:500;text-wrap:balance}
.pf-nums{list-style:none;margin:10px 0 0;padding:16px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%;border-top:1px solid var(--line)}
.pf-nums li{display:grid;gap:3px;justify-items:center;align-content:start;text-align:center}
.pf-nums b{font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pf-nums span{font-size:12px;color:var(--ink-3);font-weight:600;line-height:1.25}
.pf-sec{display:grid;gap:8px}
.badges{list-style:none;margin:0;padding:18px 6px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 2px;background:var(--surface);border-radius:var(--r)}
.bdg{display:grid;justify-items:center;align-content:start;gap:6px;text-align:center;font-size:11.5px;font-weight:600;line-height:1.25;color:var(--ink-3)}
.bdg-i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-4)}
.bdg-i svg{width:24px;height:24px}
.bdg.on{color:var(--ink)}
.bdg.on .bdg-i{background:var(--xp-soft);color:var(--xp)}
.pf-how{font-size:13px;color:var(--ink-3);text-align:center;padding:4px 8px}
/* settings: a choice out of a few is a row of words; on and off is a switch */
.st{gap:18px}
.set-list{display:grid}
.set-row{display:flex;align-items:center;gap:12px;min-height:56px;font-size:16px;font-weight:600}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row>span{flex:1;min-width:0}
.tog{position:relative;flex:none;width:52px;height:32px;border-radius:99px;border:0;padding:0;background:var(--ink-3);transition:background .15s}
.tog::after{content:"";position:absolute;inset:-8px -6px}
.tog i{position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:inset-inline-start .15s}
.tog[aria-checked="true"]{background:var(--accent)}
.tog[aria-checked="true"] i{inset-inline-start:23px}
.st>.link{justify-self:start;padding-inline:0}

/* the character */
.av{display:block;width:100%;height:auto;overflow:visible}
.av-aura{fill:var(--accent-soft)}
.av-aura.r0{fill:var(--surface-3)}.av-aura.r4,.av-aura.r5,.av-aura.r6{fill:var(--xp-soft)}
.av-shadow{fill:var(--shadow)}
.av-arm,.av-fore,.av-bi{transition:transform .55s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.av-arm.l{transform:rotate(9deg)}.av-arm.r{transform:rotate(-9deg)}
.av-arm.l .av-fore{transform:rotate(-13deg)}.av-arm.r .av-fore{transform:rotate(13deg)}
.av-bi{opacity:0;transform:scale(.5)}
.av.flex .av-arm.l{transform:rotate(96deg)}.av.flex .av-arm.r{transform:rotate(-96deg)}
.av.flex .av-arm.l .av-fore{transform:rotate(118deg)}.av.flex .av-arm.r .av-fore{transform:rotate(-118deg)}
.av.flex .av-bi{opacity:1;transform:scale(1)}
.av-grin{opacity:0}.av.flex .av-smile,.av.grin .av-smile{opacity:0}.av.flex .av-grin,.av.grin .av-grin{opacity:1}
.av-bod{animation:av-breathe 3.4s ease-in-out infinite}
.av-eyes{transform-origin:100px 56px;animation:av-blink 4.8s infinite}
.av.still .av-bod,.av.bust .av-bod,.av.bust .av-eyes{animation:none}
.av.flex .av-fig{animation:av-hop 1s ease-in-out 3}
/* a wave: one arm up and out, its forearm swinging */
.av.wave .av-arm.r{transform:rotate(-128deg)}
.av.wave .av-arm.r .av-fore{animation:av-wave .85s ease-in-out infinite}
@keyframes av-wave{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(4deg)}}
/* a cheer: both arms up, and a few hops */
.av.cheer .av-arm.l{transform:rotate(152deg)}.av.cheer .av-arm.r{transform:rotate(-152deg)}
.av.cheer .av-arm.l .av-fore{transform:rotate(16deg)}.av.cheer .av-arm.r .av-fore{transform:rotate(-16deg)}
.av.cheer .av-fig{animation:av-hop .62s ease-in-out 4}
.av.cheer .av-smile{opacity:0}.av.cheer .av-grin{opacity:1}
@keyframes av-breathe{50%{transform:translateY(-1.5px)}}
@keyframes av-blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes av-hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-9px)}}

/* the character sheet */
.lk-stage{width:150px;justify-self:center}
#lkRows{display:grid;gap:14px}
.lk-row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:center}
.lk-row>span{font-size:14px;font-weight:600;color:var(--ink-2)}
.lk-row.col{grid-template-columns:minmax(0,1fr);gap:6px}
.lk-row.col>span{font-size:13px}
.lk-row input{width:100%;min-width:0;height:48px;border-radius:14px;border:0;background:var(--surface-2);padding:0 14px;font-size:16px}
.lk-opts{display:flex;flex-wrap:wrap;gap:9px;padding:3px}
.lk-sw{position:relative;width:34px;height:34px;border-radius:50%;border:0;padding:0;background:var(--c);box-shadow:0 0 0 1px var(--line)}
.lk-sw::after{inset:-4px}
.lk-sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--accent)}

/* the end of a workout */
.sum{justify-items:center;text-align:center;gap:12px}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sum-av{width:158px;margin-block:-4px -6px}
.sum .sum-xp{display:grid;justify-items:center;font-size:54px;line-height:1.05;letter-spacing:-.03em;color:var(--xp);font-variant-numeric:tabular-nums}
.sum .sum-xp small{font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.sum .sum-up{display:inline-flex;align-items:center;gap:6px;font-size:17px;font-weight:800;color:var(--ink);background:var(--xp-soft);border-radius:99px;padding:6px 18px}
.sum-up svg{color:var(--xp);fill:var(--xp-fill)}
.sum-new{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.sum-new li{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;background:var(--surface-2);border-radius:99px;padding:6px 14px}
.sum-new svg{width:18px;height:18px;color:var(--xp)}
.sum .sum-line{font-size:15px;color:var(--ink-2)}
.sum .sum-next{font-size:13.5px}
.sum .btn{position:relative}
.xp-line{display:flex;align-items:center;gap:8px;font-weight:600}

/* ================================================================== a livelier look
   Colour means something: each workout has its own blue, what is done takes that blue, the streak burns, the game is gold.
   What can be pressed stands on a darker lip and goes down onto it under the finger. Icons are drawn, not outlined. */
.w0,.app[data-w="0"]{--wk:var(--w0);--wk-lip:var(--w0-lip);--wk-soft:var(--w0-soft);--wk-ink:var(--w0-ink)}
.w1,.app[data-w="1"]{--wk:var(--w1);--wk-lip:var(--w1-lip);--wk-soft:var(--w1-soft);--wk-ink:var(--w1-ink)}
.w2,.app[data-w="2"]{--wk:var(--w2);--wk-lip:var(--w2-lip);--wk-soft:var(--w2-soft);--wk-ink:var(--w2-ink)}
.w3,.app[data-w="3"]{--wk:var(--w3);--wk-lip:var(--w3-lip);--wk-soft:var(--w3-soft);--wk-ink:var(--w3-ink)}
/* the main button of a screen, and the quieter ones beside it */
.btn.primary{box-shadow:0 4px 0 var(--accent-lip);margin-bottom:4px}
.btn.primary:active:not(:disabled){transform:scale(.96)}
.btn:not(.primary){background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--lip);margin-bottom:3px}
.btn:not(.primary):active:not(:disabled){transform:scale(.96)}
/* today: the next workout in its own colour */
.card.next{position:relative;isolation:isolate;overflow:hidden;background:var(--wk);color:#fff;box-shadow:0 5px 0 var(--wk-lip);margin-bottom:5px}
.card.next::before,.card.next::after{content:"";position:absolute;z-index:-1;border-radius:50%;background:rgb(255 255 255 / .09)}
.card.next::before{width:220px;height:220px;inset-inline-end:-70px;top:-100px}
.card.next::after{width:130px;height:130px;inset-inline-end:70px;bottom:-80px}
.card.next .k,.card.next .meta{color:#fff}
.card.next .xp-tag{background:rgb(0 0 0 / .22);color:#fff}
.card.next .btn.primary{background:#fff;color:var(--wk-lip);box-shadow:0 4px 0 rgb(0 0 0 / .22)}
.card.next .btn.primary:active:not(:disabled){box-shadow:0 0 0 rgb(0 0 0 / .22)}
.w-dot{display:inline-block;width:12px;height:12px;margin-inline-end:10px;border-radius:50%;background:var(--wk);box-shadow:0 2px 0 var(--wk-lip)}
.sum .kicker{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--wk-soft);color:var(--wk-ink)}
/* the week: each stop in the colour of its workout */
.tab.done .dot{background:var(--wk);color:#fff;box-shadow:0 3px 0 var(--wk-lip)}
.tab.next .dot,.tab.live .dot{background:var(--surface);box-shadow:inset 0 0 0 3px var(--wk),0 3px 0 var(--wk-soft);color:var(--wk-ink)}
.tab.next b,.tab.live b{color:var(--wk-ink)}
.tab.done+.tab::before{background:var(--wk)}
/* the streak: a flame that flickers */
.p-streak{display:flex;align-items:center;gap:2px;color:var(--flame-ink);padding-inline:2px}
.p-streak .flame{width:30px;height:30px;fill:none;transform-origin:50% 92%;animation:flicker 2.6s ease-in-out infinite}
.p-streak b{font-size:20px;font-weight:800;line-height:1}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.07,.95) rotate(-3deg)}62%{transform:scale(.96,1.06) rotate(3deg)}}
/* a workout wears its colour: the bar, the set in hand, the button that logs it */
.app[data-view="workout"] .wk-bar .bar i,.rt-track i{background:var(--wk)}
.setp{box-shadow:0 3px 0 var(--lip);margin-bottom:3px}
.setp:active{transform:scale(.96)}
.setp.cur{box-shadow:inset 0 0 0 2px var(--wk),0 3px 0 var(--wk-soft)}
.setp.done{background:var(--wk-soft);box-shadow:0 3px 0 color-mix(in srgb,var(--wk) 24%,var(--wk-soft))}
.setp.done .v{color:var(--wk-ink)}
.hit,.rt-btns .go,.dock .btn.primary{background:var(--wk);color:#fff;box-shadow:0 4px 0 var(--wk-lip);margin-bottom:4px}
.hit:active,.rt-btns .go:active,.dock .btn.primary:active:not(:disabled){transform:scale(.96)}
.hit .xp-tag{background:rgb(0 0 0 / .22);color:#fff}
.hit.hit-on{background:var(--gold);color:var(--gold-ink);box-shadow:0 2px 0 var(--gold-lip)}
.hit.hit-on .xp-tag{background:rgb(255 255 255 / .45);color:var(--gold-ink)}
.dock.ready .rt-track i,.dock.go .rt-track i{background:var(--wk)}
.dock.ready .rt-state b,.dock.go .rt-state b{color:var(--wk-ink)}
.goal.g-reps{color:var(--wk-ink);background:var(--wk-soft)}
.ex.done .ex-n{background:var(--wk-soft);color:var(--wk-ink)}
/* the bar at the bottom: drawn icons and the two faces; the place you are in is lit */
.tabbar button{gap:1px;min-height:54px;margin-inline:2px;border-radius:16px;font-weight:600}
.tb-ic{display:grid;place-items:center;width:34px;height:34px}
.tb-ic svg{width:30px;height:30px;stroke-width:0}
.tb-face{width:32px;height:32px;margin:1px;border-radius:50%;overflow:hidden;background:var(--accent-soft)}
.tb-face .av{width:100%;height:100%}
.tabbar button[aria-current="page"],.app.chat-on #chatOpen{background:var(--accent-soft);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent-ink)}
.tabbar button.live::after{top:6px;inset-inline-start:calc(50% + 10px)}
/* medals: gold, standing on its edge; the ones still to earn are grey */
.bdg-i{width:54px;height:54px;background:var(--surface-3);color:var(--ink-4);box-shadow:0 3px 0 var(--lip)}
.bdg-i svg{width:26px;height:26px;stroke-width:2.3}
.bdg.on .bdg-i{background:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 var(--gold-lip)}
.sug{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--lip);margin-bottom:3px}
.sug:active{transform:scale(.96)}

/* ================================================================== the workout screen, second pass
   One exercise on a screen that does not scroll: its name, the demo (which gives up height so that the sets are never under the
   bar), the sets, and the bar that logs a set. The rest takes the whole screen in the workout's colour. Less to press: the
   details and "more" sit on the demo's corners, and what was "Undo" is an arrow at the top of the rest */
.app[data-view="workout"] .cols{padding-bottom:calc(var(--dock-h,250px) + 14px)}
#exList{touch-action:pan-y}
.fx .ex{gap:12px}
.fx .ex.snap{transition:transform .32s cubic-bezier(.3,1.35,.5,1),opacity .2s}
.fx-head{padding-top:8px}
.stage-box{position:relative}
.stage{object-fit:contain}
.st-btn{position:absolute;bottom:10px;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border:0;border-radius:99px;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);font-size:13.5px;font-weight:700;line-height:1}
.st-btn::after{content:"";position:absolute;inset:-6px}
.st-btn svg{width:18px;height:18px;color:var(--wk-ink)}
.st-btn.how{inset-inline-start:10px}
.st-btn.more{inset-inline-end:10px;width:38px;padding:0;justify-content:center}
.setp{min-height:44px}
.goal.g-start{color:var(--ink-2);background:var(--surface-3)}

/* the bar: which set this is, the weight and the reps, and the one big button */
.dock{padding-top:12px}
.dk-top{min-height:30px}
.num{height:64px;padding:0 3px}
.step{width:52px;font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--wk-ink);font-variant-numeric:tabular-nums}
.step:active,.rstep:active{background:var(--surface-3)}
.rstep{width:44px;color:var(--wk-ink)}
.dk-kg b.word{font-size:20px;letter-spacing:0}
.hit{min-height:60px;font-size:19px}

/* ---- the rest: the whole screen, in the workout's colour ---- */
.dock.rest{top:0;border-radius:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--wk);color:#fff;padding-top:calc(10px + env(safe-area-inset-top,0px));overflow-y:auto;animation:rest-in .34s cubic-bezier(.2,.8,.2,1)}
@keyframes rest-in{from{opacity:0;transform:translateY(24px)}}
.dock.rest::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 60% at 50% 38%,rgb(255 255 255 / .16),transparent 70%)}
.dock.rest .dock-in{position:relative;min-height:100%;max-width:480px;grid-template-rows:auto minmax(0,1fr) auto auto;gap:14px}
.rt-top{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;min-height:44px}
.rt-undo{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:rgb(255 255 255 / .16);color:#fff;padding:0}
.rt-undo svg{width:22px;height:22px;stroke-width:2.3}
.rt-log{justify-self:center;display:inline-flex;flex-wrap:nowrap;color:#fff;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:99px;background:rgb(0 0 0 / .2);font-size:15px;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.rt-log svg{width:18px;height:18px;stroke-width:2.8}
.rt-log i{font-style:normal;font-weight:800}
.rt-log.pr{background:var(--gold);color:var(--gold-ink)}
.rt-log.pr svg{fill:currentColor;stroke:none}
.rt{display:grid;justify-items:center;align-content:center;gap:16px;min-height:0}
.rt-ring{position:relative;display:grid;place-items:center;width:min(66vw,290px,42vh);aspect-ratio:1}
.rt-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rt-ring circle{fill:none;stroke-width:10}
.rt-ring .t{stroke:rgb(255 255 255 / .2)}
.rt-ring .f{stroke:#fff;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear,stroke .3s}
.rt-mid{display:grid;justify-items:center;gap:2px}
.rt-time{min-width:0;font-size:clamp(54px,17vw,76px);font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;direction:ltr}
.rt-word{font-size:17px;font-weight:700;opacity:.86}
.dock.ready .rt-ring .f,.dock.go .rt-ring .f{stroke:var(--gold)}
.dock.go .rt-ring{animation:rest-go 1s ease-in-out infinite}
@keyframes rest-go{50%{transform:scale(1.035)}}
.dock.go .rt-word{opacity:1;color:var(--gold)}
.rt-adj{display:flex;gap:12px}
.rt-adj button{min-width:76px;height:46px;border:0;border-radius:99px;background:rgb(255 255 255 / .16);color:#fff;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.rt-foot{display:grid;gap:12px;padding-bottom:2px}
.rt-state{display:block;font-size:16px;font-weight:600;line-height:1.35;color:rgb(255 255 255 / .86);text-align:center;white-space:normal;text-wrap:balance}
.rt-state b{display:none}
.rt-foot .go{width:100%;min-height:60px;border:0;border-radius:20px;background:#fff;color:var(--wk-lip);font-size:19px;font-weight:700;box-shadow:0 4px 0 rgb(0 0 0 / .22);margin-bottom:4px}

/* the question about an exercise that was just finished: a card with three answers, and pain as a quiet chip */
.fb-dock{display:grid;gap:10px;padding:14px;border-radius:22px;background:var(--surface-2)}
.fb-h{display:grid;gap:1px}
.fb-h b{font-size:17px;font-weight:800;white-space:normal}
.fb-h span{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbk{display:grid;gap:8px;justify-items:stretch}
.fb-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.fb-o{min-height:50px;padding:4px 6px;border:0;border-radius:16px;background:var(--surface);color:var(--ink);font-size:15.5px;font-weight:700;line-height:1.2;box-shadow:inset 0 0 0 1.5px var(--line)}
.fb-o[aria-pressed="true"]{background:var(--wk);color:#fff;box-shadow:none}
.fb-pain{justify-self:center;min-height:44px;padding:0 14px;border:0;border-radius:99px;background:none;color:var(--ink-2);font-size:14px;font-weight:600;text-decoration:underline;text-decoration-color:var(--ink-4);text-underline-offset:3px}
.fb-row.pain .fb-o[aria-pressed="true"]{background:var(--muscle);color:#fff}
.dock.rest .fb-dock{border-top:0;padding:14px;background:rgb(255 255 255 / .96);color:var(--ink);animation:ob-rise .4s cubic-bezier(.2,.8,.2,1) .15s both}
.dock.rest .fb-o{background:var(--surface-2)}
.dock.rest .fb-o[aria-pressed="true"]{background:var(--wk);color:#fff}
:root[data-theme="dark"] .dock.rest .fb-dock{background:var(--surface)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dock.rest .fb-dock{background:var(--surface)}}

/* ---- before the first set: how long is there today? Tiles with the minutes large, the whole workout across the foot ---- */
.pre.gate.time{margin-top:6vh;gap:6px}
.pre-ic{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;background:var(--wk-soft);color:var(--wk-ink);margin-bottom:6px}
.pre-ic svg{width:30px;height:30px;stroke-width:2.2}
.pre-times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;padding-top:16px}
.pre-t{display:grid;justify-items:center;align-content:center;gap:0;min-height:112px;padding:12px 8px;border:0;border-radius:22px;background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.pre-t b{font-size:36px;font-weight:800;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pre-t span{font-size:13px;font-weight:600;color:var(--ink-2)}
.pre-t small{margin-top:6px;font-size:13px;font-weight:600;color:var(--ink-3)}
.pre-t:only-child,.pre-t.full:nth-child(odd){grid-column:1/-1}
.pre-t.full{background:var(--wk);color:#fff;box-shadow:0 4px 0 var(--wk-lip);margin-bottom:4px}
.pre-t.full span,.pre-t.full small{color:rgb(255 255 255 / .86)}
.pre-t.usual{box-shadow:inset 0 0 0 2px var(--wk)}
.pre-times>*{animation:ob-rise .4s cubic-bezier(.2,.8,.2,1) both}
.pre-times>:nth-child(2){animation-delay:.05s}
.pre-times>:nth-child(3){animation-delay:.1s}
.pre-times>:nth-child(4){animation-delay:.15s}

/* ---- the details of an exercise, and "more" ---- */
.hw-facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hw-facts li{display:grid;justify-items:center;gap:2px;padding:12px 6px;border-radius:16px;background:var(--wk-soft);color:var(--wk-ink)}
.hw-facts b{font-size:20px;font-weight:800;line-height:1.15;white-space:nowrap}
.hw-facts span{font-size:12.5px;font-weight:600;opacity:.85}
.hw .muscles{justify-content:flex-start;font-size:14.5px}
.sheet .hw-h{font-size:17px;font-weight:800;margin-bottom:-6px}
.sheet .hw-rx{font-size:14px;color:var(--ink-2);padding:10px 14px;border-radius:14px;background:var(--surface-2)}
.mr-rows{display:grid;gap:8px}
.mr .fb-o{background:var(--surface-2)}
.mr-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 14px;border:0;border-radius:18px;background:var(--surface-2);color:var(--ink);text-align:start}
.mr-row i{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--wk-soft);color:var(--wk-ink)}
.mr-row i svg{width:22px;height:22px;stroke-width:2.3}
.mr-row span{display:grid;min-width:0}
.mr-row b{font-size:16px;font-weight:700;line-height:1.3}
.mr-row small{font-size:13px;color:var(--ink-2)}
.mr-row>svg{width:18px;height:18px;color:var(--ink-4)}

/* ---- the exercise picker: the workout's own card at its head, and every exercise a card with its demo and its tags ---- */
.sheet-in.sw{gap:12px}
.card.next.sw-hero{gap:6px;padding:16px 18px 18px;margin-bottom:5px}
.sw-hero .next-top{display:flex;align-items:center;gap:10px}
.sw-hero .k{flex:1;min-width:0;font-size:14px;font-weight:700;color:#fff;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-hero .icon-btn{width:38px;height:38px;background:rgb(255 255 255 / .18);color:#fff}
.sheet .sw-hero h2{font-size:27px;color:#fff}
.sheet .sw-hero .meta{font-size:14px;color:rgb(255 255 255 / .86)}
.sw .mu-row button[aria-pressed="true"]{background:var(--wk);color:#fff}
.sw-list{display:grid;gap:8px}
.sw-opt+.sw-opt{border-top:0}
.sw-opt{border-radius:20px;background:var(--surface-2);transition:box-shadow .2s,background-color .2s}
.sw-opt.on{background:var(--wk-soft);box-shadow:inset 0 0 0 2px var(--wk)}
.sw-row{grid-template-columns:auto minmax(0,1fr);min-height:72px;padding:10px 12px;border-radius:20px}
.sw-pic{display:grid;place-items:center;width:68px;height:52px;border-radius:14px;background:var(--surface);overflow:hidden}
.sw-t b{font-size:16px;font-weight:700}
.sw-tags{display:flex;flex-wrap:wrap;gap:4px;padding-top:3px}
.sw-tag{font-style:normal;font-size:12px;font-weight:600;line-height:1.7;padding:0 8px;border-radius:99px;background:var(--surface-3);color:var(--ink-2)}
.sw-tag.jf{background:var(--wk-soft);color:var(--wk-ink)}
.sw-opt.on .sw-tag{background:var(--surface)}
.sw-opt.on .sw-t b{color:var(--wk-ink)}
.sw-b{padding:0 12px 12px}
.sw-b .btn.primary{background:var(--wk);box-shadow:0 4px 0 var(--wk-lip)}

/* ---- the end of a workout: its colour over the whole sheet, the points large, the level bar, and what opened ---- */
.sheet:has(>.sum){padding-top:0}
.sheet-in.sum{justify-items:center;text-align:center;gap:10px;width:100%;height:100%;max-height:none;border-radius:0;align-content:center;background:radial-gradient(130% 90% at 50% 36%,#3B2477 0%,#1A1038 46%,#07050D 100%);color:#fff;padding-top:calc(26px + env(safe-area-inset-top,0px));overflow:hidden}
.sheet-in.sum::before{display:none}
.sheet-in.sum::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 34% at 50% 34%,color-mix(in srgb,var(--wk) 70%,transparent),transparent 72%)}
.sheet-in.sum>*{position:relative;z-index:1}
.sum .confetti{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.sheet .sum-k{display:inline-block;padding:5px 16px;border-radius:99px;background:rgb(255 255 255 / .14);font-size:15px;font-weight:700;color:#fff;animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) both}
.sum-av{width:min(190px,44vw);margin-block:4px -4px;animation:fin-max .7s cubic-bezier(.3,1.35,.5,1) .1s both}
.sum-av .av-aura{display:none}
.sum-av .av-shadow{fill:rgb(0 0 0 / .28)}
.sum-av.pump .av{animation:pump .65s cubic-bezier(.3,1.5,.5,1)}
.sum .sum-xp{display:grid;justify-items:center;font-size:72px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 4px 0 rgb(0 0 0 / .18);animation:ob-pop .5s cubic-bezier(.3,1.5,.5,1) .25s both}
.sum .sum-xp small{font-size:17px;font-weight:700;letter-spacing:0;color:#fff;text-shadow:none;opacity:.9}
.sheet .sum-up{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:99px;background:var(--gold);color:var(--gold-ink);font-size:20px;font-weight:800;opacity:0;transform:scale(.6)}
.sheet .sum-up.show{opacity:1;transform:none;transition:opacity .25s,transform .5s cubic-bezier(.3,1.7,.5,1)}
.sum-up svg{width:22px;height:22px;fill:currentColor;stroke:none}
.sum-lv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;max-width:340px;margin-top:6px;animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) .35s both}
.sum-lv .lv-badge{height:30px;padding:0 12px;font-size:14.5px;background:#fff;color:#2A1866}
.sum-lv .lv-badge.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.sum-lv .xpbar{height:14px;background:rgb(255 255 255 / .16)}
.sum-lv .xpbar i{background:var(--gold);transition:width .85s cubic-bezier(.2,.8,.2,1)}
.sum-nx{display:grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:99px;background:rgb(255 255 255 / .2);font-size:14.5px;font-weight:800}
.sum .sum-new{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;width:100%;max-width:340px}
.sum .sum-new li{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:6px 16px;border-radius:18px;background:rgb(255 255 255 / .16);font-size:17px;font-weight:700;animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) .8s both}
.sum .sum-new li:nth-child(2){animation-delay:.95s}
.sum .sum-new li:nth-child(3){animation-delay:1.1s}
.sum .sum-new li.gold{background:var(--gold);color:var(--gold-ink)}
.sum .sum-new svg{width:22px;height:22px;color:inherit}
.sum .sum-new li.gold svg{fill:currentColor;stroke:none}
.sheet-in.sum .btn.primary{margin-top:14px;max-width:440px;background:#fff;color:#2A1866;box-shadow:0 12px 34px rgb(109 63 224 / .45)}
.sum .sum-new,.sum-lv{max-width:360px}

/* on a wide screen the rest is a tall card over the workout's column, not the whole window */
@media (min-width:1000px){.dock.rest{top:16px;border-radius:28px;padding:16px}}
@media (max-height:700px){
  .fx .ex-name{font-size:22px}
  .fx-rx{font-size:13.5px}
  .num{height:56px}
  .hit{min-height:54px}
  .rt-adj button{height:42px}
  .pre-t{min-height:92px}
  .pre-t b{font-size:30px}
  .sum .sum-xp{font-size:58px}
  .sum-av{width:min(140px,36vw)}
}

/* ================================================================== the opening
   A black curtain with the name lifts onto a short film on a night-purple stage: the camera finds Eilon, who waves, pulls
   back onto the player's character, and pushes in as it grows. Then the questions, on the page's own paper: Eilon beside
   each one, the answers under him. The plan is built in front of the lifter, and the last screen is the stage again, with
   today's character and the one at level 100. Things rise softly into place; nothing slides in from the side */
.splash{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:#000;color:#fff}
.splash[hidden]{display:none}
.splash.out{animation:splash-out .44s ease-in forwards;pointer-events:none}
.splash-in{display:grid;justify-items:center;gap:12px;direction:ltr;animation:splash-logo 1.7s cubic-bezier(.2,.8,.2,1) both}
.splash .logo-w{font-size:60px;color:#fff}
.splash .logo-i{color:#A98BFF}
.splash small{font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#9693A3;animation:ob-rise .6s ease-out .5s both}
@keyframes splash-logo{0%{opacity:0;transform:scale(.84)}30%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1.04)}}
@keyframes splash-out{to{opacity:0;visibility:hidden}}

.ob{position:fixed;inset:0;z-index:90;background:var(--paper);overflow-x:clip;overflow-y:auto;overscroll-behavior:none;--side:1}
[dir="ltr"] .ob,.ob[dir="ltr"]{--side:-1}
.ob[data-k="film"],.ob[data-k="done"]{background:#07050D}
.ob[data-k="film"]{overflow:hidden}
.ob-in{position:relative;z-index:1;box-sizing:border-box;min-height:100%;max-width:480px;margin-inline:auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 0}
/* nothing is seen, and nothing moves, until the curtain is up */
.ob:not(.play) .ob-in,.ob:not(.play) .ob-film{visibility:hidden}
.ob:not(.play) *{animation-play-state:paused!important}
.ob-top{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:12px;min-height:44px}
.ob-top.first{grid-template-columns:auto minmax(0,1fr) auto}
.ob-top .link{min-height:44px;padding:0 6px;justify-self:end;white-space:nowrap}
.ob-sp{width:44px}
.ob-top .ob-lang{width:auto;margin:0;padding:3px;border-radius:14px;background:var(--surface)}
.ob-top .ob-lang button{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
/* the steps fill from left to right, in both languages */
.ob-prog{direction:ltr;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.ob-prog i{display:block;height:100%;min-width:6px;border-radius:99px;background:var(--accent);transition:width .55s cubic-bezier(.2,.8,.2,1)}
.ob-body{display:grid;gap:18px;align-content:start;min-height:0}
.ob-foot{position:sticky;bottom:0;z-index:2;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 72%,transparent)}
.ob-foot .btn{width:100%}

/* ---- the stage: the film at the start, and the last screen ---- */
.ob-film{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(130% 90% at 50% 38%,#3B2477 0%,#1A1038 46%,#07050D 100%);color:#fff}
.ob-film::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,#07050D 0%,rgb(7 5 13 / .72) 14%,transparent 31%),radial-gradient(120% 85% at 50% 45%,transparent 55%,rgb(0 0 0 / .5) 100%)}
.ob-cam{position:absolute;inset:0;display:grid;place-items:center;animation:cam-drift 11s ease-in-out infinite alternate}
@keyframes cam-drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(calc(var(--side) * -1.4%),-1%,0) scale(1.035)}}
/* the camera: it moves by moving the whole set under it. The feet stay where they stand, so a figure grows upwards */
.ob-set{position:relative;width:min(100vw,460px);height:min(60vh,520px);margin-top:-8vh;transform-origin:50% 92%;transition:transform 1.4s cubic-bezier(.65,0,.35,1)}
.ob-film[data-beat="0"] .ob-set{transform:scale(1.45) translateX(calc(var(--side) * -23%))}
.ob-film[data-beat="2"] .ob-set{transform:scale(1.4) translateX(calc(var(--side) * 24%))}
.ob-floor{position:absolute;left:4%;right:4%;bottom:2.5%;height:15%;border-radius:50%;background:radial-gradient(ellipse at center,rgb(169 139 255 / .3),transparent 70%)}
.ob-coach,.ob-you{position:absolute;bottom:5%;display:block;isolation:isolate}
/* each figure carries its own light, so whoever the camera is on stands in it */
.ob-coach::before,.ob-you::before,.ob-fig::before{content:"";position:absolute;z-index:-1;left:50%;top:42%;width:190%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgb(169 139 255 / .42) 0%,rgb(109 63 224 / .14) 42%,transparent 68%);animation:ob-glow 4.5s ease-in-out infinite alternate}
@keyframes ob-glow{to{opacity:.62;transform:translate(-50%,-50%) scale(1.08)}}
.ob-coach{inset-inline-start:5%;width:43%;transition:opacity .7s ease}
.ob-film[data-beat="2"] .ob-coach{opacity:0}
.ob-you{inset-inline-end:6%;width:40%;transition:opacity .8s ease .25s}
.ob-film[data-beat="0"] .ob-you{opacity:0;transition-delay:0s}
.ob-coach .av,.ob-you .av{display:block;width:100%;height:auto;overflow:visible}
.ob-film .av-aura,.ob-done .av-aura{display:none}
.ob-film .av-shadow,.ob-done .av-shadow{fill:rgb(0 0 0 / .4)}
.ob-you .y1,.ob-you .y2{display:block;transition:opacity .7s ease,transform .8s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 95%}
.ob-you .y2{position:absolute;inset:0;opacity:0;transform:scale(.94)}
.ob-film[data-beat="2"] .ob-you .y1{opacity:0;transform:scale(1.03)}
.ob-film[data-beat="2"] .ob-you .y2{opacity:1;transform:none}
.ob-you .lv-badge{position:absolute;top:4%;inset-inline-end:-4%;height:26px;padding:0 10px;font-size:12.5px;background:#F2B02E;color:#3D2600;box-shadow:0 6px 18px rgb(242 176 46 / .35);opacity:0;transform:scale(.6);transition:opacity .4s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.ob-film:not([data-beat="0"]) .ob-you .lv-badge{opacity:1;transform:none;transition-delay:.6s}
.ob-in.film,.ob-in.fin{color:#fff}
.ob-in.film .ob-body{grid-template-rows:auto minmax(0,1fr) auto;gap:8px}
.ob-in.film .ob-foot,.ob-in.fin .ob-foot{background:none}
.ob-head{display:grid;justify-items:center}
.ob-head .logo{justify-items:center;animation:ob-rise .7s cubic-bezier(.2,.8,.2,1) both}
.ob-in.film .logo-w{color:#fff;font-size:32px}
.ob-in.film .logo-i{color:#A98BFF}
.ob-in.film .logo small{color:rgb(255 255 255 / .55)}
.ob-tap{min-height:0;cursor:pointer}
.ob-cap{margin:0;min-height:2.5em;font-size:25px;font-weight:800;line-height:1.22;letter-spacing:-.015em;text-align:center;text-wrap:balance;text-shadow:0 2px 20px rgb(0 0 0 / .45)}
.ob-cap.in{animation:cap-in .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes cap-in{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
.ob-story{display:flex;gap:6px;direction:ltr;align-self:center;max-width:160px;width:100%;justify-self:center}
.ob-story i{flex:1;height:3px;border-radius:2px;background:rgb(255 255 255 / .22);overflow:hidden}
.ob-story b{display:block;width:0;height:100%;border-radius:inherit;background:#fff}
.ob-story i.full b{width:100%}
.ob-story i.run b{animation:story 3.2s linear forwards}
@keyframes story{to{width:100%}}
.ob-in.film .ob-lang{background:rgb(255 255 255 / .1)}
.ob-in.film .ob-lang button{color:rgb(255 255 255 / .75);background:none}
.ob-in.film .ob-lang button[aria-pressed="true"]{background:#fff;color:#22134F}
.ob-in.film .link{color:rgb(255 255 255 / .8)}
.ob-in.fin .fx-nav{color:rgb(255 255 255 / .7)}
