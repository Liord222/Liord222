.ob-in.film .btn.primary,.ob-in.fin .btn.primary{background:#fff;color:#2A1866;box-shadow:0 12px 34px rgb(109 63 224 / .45);animation:ob-rise .6s cubic-bezier(.2,.8,.2,1) .5s both}

/* ---- a question: Eilon beside it, the answers under it ---- */
.ob-q{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:end}
.ob-eilon{position:relative;display:block;width:86px}
.ob-eilon .av{display:block;width:100%;height:auto;overflow:visible}
.ob-eilon .av-aura{fill:var(--accent-soft)}
.ob-bub{position:relative;align-self:center;background:var(--surface);border-radius:22px;border-end-start-radius:6px;padding:14px 18px;box-shadow:0 1px 0 var(--line),0 12px 30px -20px rgb(40 20 90 / .45);transform-origin:var(--bub-o,0 100%)}
.ob-bub h1{margin:0;font-size:22px;font-weight:800;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.ob-bub p{margin:4px 0 0;font-size:14.5px;color:var(--ink-2)}
.ob-q.big{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;gap:14px;padding-top:2vh}
.ob-q.big .ob-eilon{width:min(150px,36vw)}
.ob-q.big .ob-bub{border-radius:22px;--bub-o:50% 0}
.ob-q.big .ob-bub::before{content:"";position:absolute;top:-6px;left:50%;width:14px;height:14px;border-radius:3px;background:inherit;transform:translateX(-50%) rotate(45deg)}
/* a large figure stands in a soft light, not on a disc */
.ob-q.big .av-aura,.ob-pre .av-aura,.ob-stage .av-aura{display:none}
.ob-q.big .ob-eilon,.ob-pre,.ob-stage .lk-stage{isolation:isolate}
.ob-q.big .ob-eilon::before,.ob-pre::before,.ob-stage .lk-stage::before{content:"";position:absolute;z-index:-1;left:50%;top:48%;height:104%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,var(--accent-soft) 0%,color-mix(in srgb,var(--accent-soft) 60%,transparent) 55%,transparent 100%)}
@keyframes ob-pop{from{opacity:0;transform:translateY(12px) scale(.92)}}
@keyframes bub-in{from{opacity:0;transform:scale(.95)}}
@keyframes ob-rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fade-in{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
/* a screen that is arrived at rises into place, its answers one after the other; one that is only drawn again stands still.
   From one question to the next Eilon stays where he stands */
.ob-body.in .ob-eilon{animation:ob-pop .55s cubic-bezier(.3,1.4,.5,1) both}
.ob-in.stay .ob-body.in .ob-eilon{animation:none}
.ob-body.in .ob-bub{animation:bub-in .45s cubic-bezier(.2,.8,.2,1) .06s both}
.ob-body.in .ob-opts>*,.ob-body.in .ob-times>*{animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) both}
.ob-opts>:nth-child(1),.ob-times>:nth-child(1){animation-delay:.1s}
.ob-opts>:nth-child(2),.ob-times>:nth-child(2){animation-delay:.16s}
.ob-opts>:nth-child(3),.ob-times>:nth-child(3){animation-delay:.22s}
.ob-times>:nth-child(4){animation-delay:.28s}
.ob-times>:nth-child(5){animation-delay:.34s}
.ob-body.in .ob-name,.ob-body.in .ob-pre,.ob-body.in .ob-plan,.ob-body.in .ob-fb,.ob-body.in .ob-pin,.ob-body.in .ob-stage,.ob-body.in .ob-look,.ob-body.in .ob-build{animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) .12s both}
.ob-body.in .ob-look{animation-delay:.2s}

/* the name, large, in the middle of the screen */
.ob-name{display:grid;justify-items:center;gap:8px;padding-top:3vh}
.ob-in-name{box-sizing:border-box;width:100%;max-width:340px;height:66px;border:0;border-radius:20px;background:var(--surface);padding:0 18px;text-align:center;font:inherit;font-size:28px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);transition:box-shadow .2s}
.ob-in-name:focus{outline:none;box-shadow:inset 0 0 0 2.5px var(--accent),0 0 0 6px var(--accent-soft)}
.ob-in-name::placeholder{color:var(--ink-4);font-weight:600}
.ob-hint{margin:0;font-size:13.5px;color:var(--ink-3)}

/* answers: a card each, with an icon on a tint; the chosen one is lit */
.ob-opts{display:grid;gap:10px}
.ob-opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;min-height:70px;padding:12px 16px;border:0;border-radius:20px;background:var(--surface);color:var(--ink);text-align:start;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .2s,background-color .2s,transform .3s cubic-bezier(.34,1.45,.64,1)}
.ob-opt:active{transform:scale(.98)}
.ob-opt .ob-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);transition:background-color .2s,color .2s}
.ob-opt .ob-ic svg{width:24px;height:24px;stroke-width:2.2}
.ob-opt .ob-ic svg.pl{width:30px;height:30px;fill:currentColor}
.ob-opt span{display:grid;min-width:0;gap:1px}
.ob-opt b{font-size:17px;font-weight:700;line-height:1.3}
.ob-opt small{font-size:13.5px;color:var(--ink-2)}
.ob-chk{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink-4);color:transparent;transition:background-color .2s,border-color .2s,color .2s}
.ob-opt[role="checkbox"] .ob-chk{border-radius:8px}
.ob-chk svg{width:15px;height:15px;stroke-width:3}
.ob-opt[aria-checked="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.ob-opt[aria-checked="true"] .ob-ic{background:var(--accent);color:var(--on-accent)}
.ob-opt[aria-checked="true"] .ob-chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:pop .35s cubic-bezier(.3,1.7,.5,1)}

/* the character under the experience question, as built as the answer: it takes the room that is left, so the screen never scrolls */
.ob-in[data-k="exp"] .ob-body{grid-template-rows:auto auto minmax(96px,1fr)}
.ob-pre{position:relative;align-self:center;width:100%;height:100%;max-height:310px;min-height:0}
.ob-pre .av,.ob-stage .lk-stage .av{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 92%}
.ob-pre.pump .av,.lk-stage.pump .av{animation:pump .65s cubic-bezier(.3,1.5,.5,1)}
@keyframes pump{0%{transform:scale(.9)}45%{transform:scale(1.07)}100%{transform:none}}

/* the time: four tiles with the minutes large, and "any length" across the bottom */
.ob-times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ob-time{display:grid;justify-items:center;align-content:center;min-height:106px;padding:12px;border:0;border-radius:22px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .2s,background-color .2s,color .2s,transform .3s cubic-bezier(.34,1.45,.64,1)}
.ob-time b{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.ob-time span{font-size:13px;font-weight:600;color:var(--ink-2)}
.ob-time small{margin-top:4px;font-size:12.5px;color:var(--ink-3)}
.ob-time.any{grid-column:1/-1;min-height:60px;grid-auto-flow:column;justify-content:center;gap:10px}
.ob-time.any span{font-size:16px;font-weight:700;color:var(--ink)}
.ob-time.any svg{width:22px;height:22px;color:var(--accent)}
.ob-time[aria-checked="true"]{background:var(--accent);box-shadow:0 10px 24px -12px var(--accent);color:var(--on-accent)}
.ob-time[aria-checked="true"] span,.ob-time[aria-checked="true"] small,.ob-time[aria-checked="true"] svg{color:inherit;opacity:.88}

/* the look: the character in the room that is left, and under it the editor */
.ob-in[data-k="look"] .ob-body{grid-template-rows:auto minmax(120px,1fr) auto}
.ob-stage{position:relative;display:grid;min-height:0}
.ob-stage .lk-stage{position:relative;justify-self:stretch;align-self:center;width:100%;height:100%;max-height:310px;min-height:0}
/* the photo button stands beside the head, where the figure leaves room on both sides */
.ob-stage .lk-photo-box{position:absolute;inset-inline-end:0;top:4px;justify-items:end}
.ob-stage .lk-note{max-width:128px;text-align:end}
.ob-look{padding:14px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}

/* ---- the character editor (here and in the profile): tabs, and the choices of the tab that is open ---- */
.lk-ed{display:grid;gap:12px;min-width:0}
.lk-tabs{display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--surface-2);overflow-x:auto;scrollbar-width:none}
.lk-tabs::-webkit-scrollbar{display:none}
.lk-tabs button{flex:1 0 auto;min-height:38px;padding:0 9px;border:0;border-radius:11px;background:none;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.lk-tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 4px rgb(20 10 50 / .16)}
.lk-pane{display:grid;align-content:center;min-height:164px}
.lk-opts{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:8px;justify-items:center;padding:4px 2px}
.lk-opts .lk-sw{width:100%;max-width:46px;height:auto;aspect-ratio:1}
.lk-sw:not([aria-pressed="true"]){box-shadow:inset 0 0 0 1px rgb(0 0 0 / .14)}
.lk-cuts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lk-cuts.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lk-cut{display:grid;justify-items:center;gap:3px;min-width:0;padding:6px 0 7px;border:0;border-radius:14px;background:var(--surface-2);color:var(--ink-2)}
.lk-cut small{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;font-weight:600;white-space:nowrap}
.lk-face{display:block;width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--surface-3)}
.lk-face .av{display:block;width:100%;height:100%}
.lk-cuts.three .lk-cut{padding:10px 0}
.lk-cuts.three .lk-face{width:60px;height:60px}
.lk-cuts.three .lk-cut small{font-size:13px}
.lk-cut[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent)}
.lk-tees{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lk-tee{display:grid;place-items:center;height:64px;border:0;border-radius:16px;background:var(--surface-2)}
.lk-tee svg{width:42px;height:42px;fill:var(--c);stroke:color-mix(in srgb,var(--ink) 26%,transparent);stroke-width:.7;stroke-linejoin:round}
.lk-tee[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.lk-photo-box{display:grid;justify-items:center;gap:4px}
.lk-photo{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border:0;border-radius:99px;background:var(--surface);color:var(--accent-ink);font-size:13.5px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line),0 8px 18px -12px rgb(40 20 90 / .55)}
.lk-photo svg{width:18px;height:18px}
.lk-photo:disabled{opacity:.8}
.spin{box-sizing:border-box;width:15px;height:15px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;animation:spin .8s linear infinite}
.lk-note{margin:0;max-width:180px;font-size:12px;font-weight:600;line-height:1.35;color:var(--ink-2)}

/* the plan is built in front of the lifter: a ring that fills, and each thing it is fitted to, ticked */
.ob-build{display:grid;justify-items:center;gap:22px;padding-top:1vh;cursor:pointer}
.ob-ring{position:relative;display:grid;place-items:center;width:128px;height:128px}
.ob-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ob-ring circle{fill:none;stroke-width:9}
.ob-ring .t{stroke:var(--surface-3)}
.ob-ring .f{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.ob-ring b{font-size:30px;font-weight:800;letter-spacing:-.02em}
.ob-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;width:100%}
.ob-steps li{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 16px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:15.5px;font-weight:600;color:var(--ink-3);opacity:.5;transition:opacity .3s,color .3s}
.ob-steps li.on{opacity:1;color:var(--ink)}
.ob-steps i{box-sizing:border-box;flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--surface-3);color:transparent}
.ob-steps li.on i{border-color:color-mix(in srgb,var(--accent) 22%,transparent);border-top-color:var(--accent);animation:spin .7s linear infinite}
.ob-steps li.done i{border-color:var(--accent);background:var(--accent);color:var(--on-accent);animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.ob-steps i svg{width:14px;height:14px;stroke-width:3.2}

/* the plan: the purple card of the workouts page, with its numbers; under it, whether Eilon asks */
.card.next.ob-plan{display:grid;gap:14px;padding:20px}
.ob-plan .k{margin:0;font-size:13px;font-weight:700;opacity:.85}
.ob-plan h2{margin:-8px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.ob-stats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ob-stats li{display:grid;justify-items:center;gap:2px;padding:12px 4px;border-radius:16px;background:rgb(255 255 255 / .14)}
.ob-stats b{font-size:23px;font-weight:800;line-height:1.1}
.ob-stats span{font-size:12px;font-weight:600;opacity:.88;text-align:center}
.ob-wks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ob-wks li{display:flex;align-items:center;gap:8px;min-width:0;padding:9px 10px;border-radius:12px;background:rgb(0 0 0 / .16);font-size:13.5px;font-weight:600}
.ob-wks .w-dot{flex:none;margin:0;box-shadow:0 0 0 2px rgb(255 255 255 / .7)}
.ob-shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 36%,rgb(255 255 255 / .3) 50%,transparent 64%);transform:translateX(-130%)}
.ob-plan.reveal{animation:plan-in .7s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes plan-in{from{opacity:0;transform:translateY(20px) scale(.93)}}
.ob-plan.reveal .ob-shine{animation:shine 1.1s ease .55s both}
@keyframes shine{to{transform:translateX(130%)}}
.ob-plan.reveal .ob-stats li{animation:ob-pop .5s cubic-bezier(.3,1.5,.5,1) both}
.ob-plan.reveal .ob-stats li:nth-child(1){animation-delay:.3s}
.ob-plan.reveal .ob-stats li:nth-child(2){animation-delay:.42s}
.ob-plan.reveal .ob-stats li:nth-child(3){animation-delay:.54s}
.ob-plan.reveal .ob-wks{animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) .7s both}
.ob-plan.reveal+.ob-fb{animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) .85s both}
.ob-fb{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.ob-fb span{flex:1;display:grid;min-width:0}
.ob-fb b{font-size:16px;font-weight:700}
.ob-fb small{font-size:13px;color:var(--ink-2)}

/* the code: four dots and a keypad, as on a phone */
.ob-pin{display:grid;justify-items:center;gap:10px;padding-top:1vh}
.pin-dots{display:flex;gap:16px;direction:ltr}
.pin-dots i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-4);transition:background-color .15s,box-shadow .15s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.pin-dots i.on{background:var(--accent);box-shadow:none;transform:scale(1.12)}
.pin-dots.ok i{background:var(--ok)}
.pin-err{min-height:20px;margin:0;font-size:13.5px;font-weight:600;color:var(--muscle-ink)}
.pin-pad{direction:ltr;display:grid;grid-template-columns:repeat(3,74px);gap:12px 22px}
.pin-k{display:grid;place-items:center;width:74px;height:74px;border:0;border-radius:50%;background:var(--surface);color:var(--ink);font-size:28px;font-weight:600;box-shadow:inset 0 0 0 1.5px var(--line)}
.pin-k svg{width:28px;height:28px}
.pin-k[data-pin="del"]{background:none;box-shadow:none;color:var(--ink-2)}
.pin-k:disabled{opacity:.35}

/* all set: on the stage again, today's character and the same one at level 100 */
.ob-in.fin .ob-body{align-content:center}
.ob-done{position:relative;display:grid;justify-items:center;gap:8px;text-align:center}
.ob-done h1{margin:0;font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.02em;text-wrap:balance;animation:ob-rise .5s cubic-bezier(.2,.8,.2,1) .1s both}
.ob-sub{margin:0;font-size:16px;color:rgb(255 255 255 / .72);animation:ob-rise .5s cubic-bezier(.2,.8,.2,1) .2s both}
.ob-ladder{display:grid;grid-template-columns:minmax(0,.8fr) auto minmax(0,1.2fr);align-items:end;gap:4px;width:100%;margin-top:22px}
.ob-ladder figure{margin:0;display:grid;justify-items:center;gap:10px;min-width:0}
.ob-fig{position:relative;display:block;width:100%;isolation:isolate}
.ob-fig .av{display:block;width:100%;height:auto;overflow:visible}
.ob-ladder .now{animation:ob-rise .55s cubic-bezier(.2,.8,.2,1) .35s both}
.ob-ladder .max{animation:fin-max .8s cubic-bezier(.3,1.35,.5,1) 1.05s both}
@keyframes fin-max{from{opacity:0;transform:translateY(16px) scale(.8)}}
.ob-ladder .max .ob-fig::before{width:150%;background:radial-gradient(circle,rgb(242 176 46 / .5) 0%,rgb(242 176 46 / .15) 42%,transparent 68%)}
.ob-ladder figcaption{display:grid;justify-items:center;gap:4px;font-size:12.5px;font-weight:600;color:rgb(255 255 255 / .6)}
.ob-ladder figcaption b{padding:3px 12px;border-radius:99px;background:rgb(255 255 255 / .14);font-size:14.5px;font-weight:800;color:#fff}

<script>
'use strict';
/* ================================================================== language
   Every text is written in both languages where it is used: say('עברית', 'English'). */
let LANG = 'he';
const say = (he, en) => (LANG === 'en' ? en : he);
/* the languages, each under its own name, and the label of the choice between them (read by both kinds of reader) */
const LANGS = [['he', 'עברית'], ['en', 'English']], LANG_LABEL = '<span lang="en">Language</span> · <span lang="he">שפה</span>';

/* ================================================================== plan */
/* each workout: name = the short English name kept in exports, t / te = the title shown in the app in Hebrew / English */
const E = (id, a, name, sets, reps, rest, int, lvl, suf) => ({ id, a, name, sets, reps, rest, int, lvl, suf: suf || '' });
const PLAN = [
  { name: 'Upper A', t: 'גוף עליון A', te: 'Upper Body A', ex: [
    E('ua1', 'inclineSmith', 'Incline Smith Machine Press', 3, '6–10', [120, 180], '1 חזרה לפני כשל', 2),
    E('ua2', 'assistedPullup', 'Assisted Pull-ups', 3, '6–10', [120, 120], '1 חזרה לפני כשל', 2),

    E('ua4', 'latRaise', 'Chest Supported Lateral Raises', 3, '12–15', [75, 75], 'סט אחרון לכשל טכני', 3),
    E('ua5', 'machinePress', 'Machine Chest Press', 2, '8–12', [90, 90], 'סט אחרון לכשל טכני', 3),
    E('ua6', 'pushdown', 'Triceps Pushdown', 2, '10–15', [60, 60], 'סט אחרון לכשל טכני', 3),
    E('ua7', 'dbCurl', 'Dumbbell Curl', 2, '10–15', [60, 60], 'סט אחרון לכשל טכני', 3),
    E('ua8', 'cableCrunch', 'Cable Crunch', 3, '10–15', [60, 60], 'חזרות קשות ומבוקרות', 0),
  ] },
  { name: 'Lower A', t: 'גוף תחתון A', te: 'Lower Body A', ex: [
    E('la1', 'hackSquat', 'Hack Squat', 3, '6–10', [120, 180], '1–2 חזרות לפני כשל', 1),
    E('la2', 'rdl', 'Romanian Deadlift', 3, '8–10', [120, 180], '1–2 חזרות לפני כשל', 1),
    E('la3', 'legPress', 'Leg Press', 3, '10–15', [120, 120], '1 חזרה לפני כשל', 2),
    E('la4', 'seatedLegCurl', 'Seated Leg Curl', 3, '10–15', [75, 75], 'סט אחרון לכשל טכני', 3),
    E('la5', 'standingCalf', 'Standing Calf Raises', 3, '12–18', [60, 60], 'סט אחרון לכשל טכני', 3),
    E('la6', 'pallof', 'Pallof Press', 2, '12', [60, 60], 'שליטה מלאה', 0, 'לצד'),
  ] },
  { name: 'Upper B', t: 'גוף עליון B', te: 'Upper Body B', ex: [
    E('ub1', 'assistedPullup', 'Assisted Pull-ups', 3, '6–10', [120, 120], '1 חזרה לפני כשל', 2),
    E('ub2', 'inclineSmith', 'Incline Smith Machine Press', 3, '8–12', [120, 120], '1 חזרה לפני כשל', 2),
    E('ub3', 'cableRow', 'Seated Cable Row', 3, '8–12', [90, 90], '1 חזרה לפני כשל', 2),
    E('ub4', 'latRaise', 'Chest Supported Lateral Raises', 3, '12–20', [75, 75], 'סט אחרון לכשל טכני', 3),
    E('ub5', 'shoulderPress', 'Machine Shoulder Press', 2, '8–12', [90, 90], '1 חזרה לפני כשל', 2),
    E('ub6', 'reversePec', 'Reverse Pec Deck', 2, '12–20', [60, 60], 'סט אחרון לכשל טכני', 3),
    E('ub7', 'hammerCurl', 'Hammer Curl', 2, '10–15', [60, 60], 'סט אחרון לכשל טכני', 3),
    E('ub8', 'ohTriceps', 'Overhead Triceps Extension', 2, '10–15', [60, 60], 'סט אחרון לכשל טכני', 3),
    E('ub9', 'kneeRaise', 'Hanging Knee Raises', 3, '8–15', [60, 60], 'חזרות נקיות', 0),
  ] },
  { name: 'Lower B', t: 'גוף תחתון B', te: 'Lower Body B', ex: [
    E('lb1', 'hackSquat', 'Hack Squat / Smith Squat', 3, '8–12', [120, 180], '1–2 חזרות לפני כשל', 1),
    E('lb2', 'bulgarian', 'Bulgarian Split Squat', 2, '8–10', [120, 120], '1–2 חזרות לפני כשל', 1, 'לרגל'),
    E('lb3', 'hipThrust', 'Hip Thrust', 3, '8–12', [120, 120], '1 חזרה לפני כשל', 2),
    E('lb4', 'lyingLegCurl', 'Lying Leg Curl', 3, '10–15', [75, 75], 'סט אחרון לכשל טכני', 3),

/* how a workout is called in the app: "אימון ראשון – גוף עליון A" */
const ORD = ['ראשון', 'שני', 'שלישי', 'רביעי'];
const wkName = (w) => say(PLAN[w].t, PLAN[w].te);
const wkOrd = (w) => say('אימון ' + ORD[w], 'Workout ' + (w + 1));
const wkFull = (w) => wkOrd(w) + ' – ' + wkName(w);
/* the short name for the week's path: "עליון A" / "Upper A" */
const wkShort = (w) => say(PLAN[w].t.replace('גוף ', ''), PLAN[w].name);
/* a count with its noun: "3 סטים" / "3 sets", "סט אחד" / "1 set" */
const cnt = (n, heN, he1, enN, en1) => (LANG === 'en' ? n + ' ' + (n === 1 ? en1 : enN) : n === 1 ? he1 : n + ' ' + heN);
/* "from → to", in the direction the page is read */
const arrow = () => say(' ← ', ' → ');
/* dates in the language of the page; in English the month is written out, so that day and month cannot be confused */
const dateFmt = () => (LANG === 'en' ? new Intl.DateTimeFormat(/^en\b/i.test(navigator.language || '') ? navigator.language : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : new Intl.DateTimeFormat('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric' }));

const PLAN_EN = { '1 חזרה לפני כשל': '1 rep before failure', '1–2 חזרות לפני כשל': '1–2 reps before failure', 'סט אחרון לכשל טכני': 'Last set to failure', 'חזרות קשות ומבוקרות': 'Hard, controlled reps', 'שליטה מלאה': 'Full control', 'חזרות נקיות': 'Clean reps', 'לצד': 'per side', 'לרגל': 'per leg' };
const planNote = (he) => (he ? say(he, PLAN_EN[he] || he) : '');

/* ================================================================== movement library */
/* muscle groups with weekly set landmarks (direct sets + half sets for helpers): below mev is too little to grow, above mrv is more than most people recover from */
const MUSCLE = {
  chest: { he: 'חזה', en: 'Chest', mev: 8, mrv: 22 },
  back: { he: 'גב', en: 'Back', mev: 10, mrv: 25 },
  delts: { he: 'כתף אמצעית ואחורית', en: 'Side and rear delts', mev: 8, mrv: 26 },
  fdelt: { he: 'כתף קדמית', en: 'Front delts', mev: 0, mrv: 12 },
  biceps: { he: 'ביספס', en: 'Biceps', mev: 8, mrv: 26 },
  triceps: { he: 'טרייספס', en: 'Triceps', mev: 6, mrv: 18 },
  quads: { he: 'ארבע ראשי', en: 'Quads', mev: 8, mrv: 20 },
  hams: { he: 'ירך אחורית', en: 'Hamstrings', mev: 6, mrv: 20 },
  glutes: { he: 'ישבן', en: 'Glutes', mev: 0, mrv: 16 },
  calves: { he: 'שוקיים', en: 'Calves', mev: 8, mrv: 20 },

  cv.width = W * dpr; cv.height = H * dpr; g.scale(dpr, dpr);

  const step = (now) => {

    g.globalAlpha = Math.min(1, (2400 - t) / 500);

}

   exercises as the time holds. It is written from the plan's own slots each time, so going through the opening again with
   other answers gives the plan those answers ask for. Only before the first logged set, like applyExp */
function fitPlan() {
  const me = S.cfg.me;

async function pinHash(pin) {
  const text = 'gymi:' + pin;
  try {
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(h)).map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    /* no subtle crypto here: a plain mix of the digits, as long as the real one */
    let x = 2166136261; for (const c of text) x = Math.imul(x ^ c.charCodeAt(0), 16777619) >>> 0;
    return (x.toString(16).padStart(8, '0')).repeat(8);
  }
}

  } else if (st === 'plan') {

    cta = say('נשמע טוב', 'Sounds good');
    body = ask(say('התוכנית שלך מוכנה', 'Your plan is ready'), say('בניתי אותה לפי מה שסיפרת לי', 'I built it from what you told me')) +

  } else if (st === 'pin') {

    body = ask(say('קוד אישי', 'A personal code'), OB.pin ? say('הקוד נשמר.', 'The code is saved.') : OB.pin1 ? say('עוד פעם, לאישור', 'Once more, to confirm') : say('4 ספרות. הקוד יידרש לפתיחת האפליקציה ולמחיקת החשבון.', '4 digits. It is asked when the app opens, and to delete the account.')) +

  } else {

    cta = old ? say('קדימה', "Let's go") : say('לאימון הראשון', 'To the first workout');
    body = '<div class="ob-done"><canvas class="confetti" id="obConfetti" aria-hidden="true"></canvas><h1 id="obTitle">' + (nm ? '<bdi>' + esc(nm) + '</bdi>' + say(', הכול מוכן!', ', you are all set!') : say('הכול מוכן!', 'You are all set!')) + '</h1>' +

  const first = st === 'film', fin = st === 'done', last = OB_LAST - 1;
  return (first ? filmHTML() : fin ? '<div class="ob-film fin" aria-hidden="true"></div>' : '') +
    '<div class="ob-in' + (first ? ' film' : '') + (fin ? ' fin' : '') + (OB.stay ? ' stay' : '') + '" data-step="' + OB.step + '" data-k="' + st + '"><div class="ob-top' + (first ? ' first' : '') + '">' +
    (first ? langs : '<button class="fx-nav" id="obBack" type="button" aria-label="' + say('חזרה', 'Back') + '">' + ICON.back + '</button>') +
    (first ? '<div class="ob-story" id="obStory" aria-hidden="true">' + storyHTML() + '</div>' : fin ? '<span></span>' : '<div class="ob-prog" role="img" aria-label="' + say('שלב ' + OB.step + ' מתוך ' + last, 'Step ' + OB.step + ' of ' + last) + '"><i style="width:' + Math.round((Math.min(OB.step, last) / last) * 100) + '%"></i></div>') +
    (first ? '<button class="link" id="obSkip" type="button">' + say('דלג', 'Skip') + '</button>' : '<span class="ob-sp"></span>') + '</div>' +
    '<div class="ob-body' + (OB.dir ? ' in' : '') + '">' + body + '</div>' +

}
/* the character under the experience question takes on the build of the answer */
function obPre() {
  const box = $('#obPre'); if (!box) return;
  box.innerHTML = avatar(1); const av = $('.av', box);
  box.classList.remove('pump'); void box.offsetWidth; box.classList.add('pump');
  requestAnimationFrame(() => requestAnimationFrame(() => { if (av && av.isConnected) av.classList.add('flex'); }));
  clearTimeout(OB.flexT); OB.flexT = setTimeout(() => { if (av && av.isConnected) av.classList.remove('flex'); }, 1200);
}
/* the timers of a screen's own show (the plan being built, the last screen) end with the screen */
function obClear() { for (const t of OB.ts || []) clearTimeout(t); OB.ts = []; cancelAnimationFrame(OB.buildRaf); }
/* the plan is built in front of the lifter: each thing it is fitted to is ticked in turn, the ring fills, and then the plan arrives */
const BUILD_MS = 640;
function obBuilt() { if (!OB.on || !obIs('plan') || !OB.building) return; OB.building = false; OB.reveal = true; renderOb(); }
function obBuild() {
  const lis = $$('#obBuild li'), ring = $('#obRing'), pct = $('#obPct'), t0 = performance.now(), all = lis.length * BUILD_MS;
  lis.forEach((li, i) => {
    OB.ts.push(setTimeout(() => { li.classList.add('on'); haptic('step'); }, i * BUILD_MS));
    OB.ts.push(setTimeout(() => li.classList.add('done'), (i + 1) * BUILD_MS - 110));
  });
  const step = (now) => { const k = Math.min(1, (now - t0) / all); if (ring) ring.style.strokeDashoffset = String(100 - k * 100); if (pct) pct.textContent = Math.round(k * 100) + '%'; if (k < 1 && pct && pct.isConnected) OB.buildRaf = requestAnimationFrame(step); };
  OB.buildRaf = requestAnimationFrame(step);
  OB.ts.push(setTimeout(obBuilt, all + 280));
}
/* the last screen: today's character cheers, and the one at level 100 arrives, flexes, and the paper flies */
function obFinale() {
  const now = $('.ob-ladder .now .av'), max = $('.ob-ladder .max .av');
  feel('done');
  if (reduced) { if (max) max.classList.add('flex'); return; }
  if (now) now.classList.add('cheer');
  OB.ts.push(setTimeout(() => { if (now && now.isConnected) now.classList.remove('cheer'); }, 2700));
  OB.ts.push(setTimeout(() => { if (max && max.isConnected) { max.classList.add('flex'); confetti($('#obConfetti'), 90); haptic('success'); } }, 1500));
}
function renderOb() {
  const el = $('#ob'); clearTimeout(OB.beatT); obClear();
  el.innerHTML = obHTML(); OB.dir = 0; OB.stay = false; el.dataset.step = OB.step; el.dataset.k = OB_STEPS[OB.step];
  if (obIs('name')) { const inp = $('#obName'); try { inp.focus({ preventScroll: true }); inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) { /* not focusable here */ } }
  if (obIs('plan')) { if (OB.building) obBuild(); else if (OB.reveal) { OB.reveal = false; feel('glory', 'success'); } }
  if (obIs('done')) obFinale();
  el.scrollTop = 0; obPlay();
}
/* the language changes under a short fade, never with a jump */
function obFade(fn) {
  const el = $('#ob'), box = $('.ob-in', el);
  if (!box || reduced) { fn(); return; }
  box.classList.add('out'); el.classList.add('swap');
  setTimeout(() => { fn(); el.classList.remove('swap'); el.classList.add('swapin'); clearTimeout(OB.swapT); OB.swapT = setTimeout(() => el.classList.remove('swapin'), 360); }, 170);
}
function openOb() {
  const me = S.cfg.me;
  LK.tab = 'skin'; LK.note = '';
  Object.assign(OB, { on: true, step: 0, dir: 0, beat: 0, stay: false, building: false, reveal: false, playT: 0, stepAt: 0, was: me.ob, name: me.name || '', exp: me.exp, goals: (me.goals || []).slice(), time: me.time, eq: me.eq, fb: me.fb == null ? 2 : me.fb, pin: me.pin || '', pin1: '', pinBuf: '', pinErr: '' });
  /* the language shown is the one kept: a look chosen on the way must not turn an English page Hebrew on the next visit */
  if (!S.cfg.lang) S.cfg.lang = LANG;
  $('#ob').hidden = false; document.body.style.overflow = 'hidden'; renderOb();
}
function closeOb() { OB.on = false; clearTimeout(OB.beatT); cancelAnimationFrame(OB.lvRaf); obClear(); OB.building = false; OB.reveal = false; const el = $('#ob'); el.hidden = true; el.classList.remove('play', 'swap', 'swapin'); el.innerHTML = ''; if (!(chat.modal && $('#chat').classList.contains('open'))) document.body.style.overflow = ''; }
/* the answers are kept when the last screen is passed. skip: only remember that the screens were seen */
function obFinish(skip) {
  const me = S.cfg.me;
  if (!skip) {
    me.name = String(OB.name || '').trim().slice(0, 16); me.exp = OB.exp; me.goals = OB.goals.slice(); me.goal = OB.goals.length ? OB.goals[0] : null;
    me.time = OB.time; me.eq = OB.eq; me.fb = OB.fb; if (OB.pin) me.pin = OB.pin; me.made = me.made || Date.now();
    fitPlan();
  }
  me.ob = Date.now(); S.cfg.lang = LANG; saveCfg();
  closeOb(); setView('home'); renderAll();
}
function obStep(d) {
  const n = OB.step + d; if (n < 0) return;
  OB.stepAt = Date.now();
  if (n > OB_LAST) { obFinish(false); return; }
  if (d > 0 && n < OB_LAST) sfx('set');
  /* Eilon stays where he stands from one question to the next: only the words and the answers arrive. (On the name he
     stands larger, in the middle, and the last screen has none of him, so there he arrives) */
  const side = (i) => i >= 2 && i < OB_LAST;
  OB.stay = side(OB.step) && side(n); OB.step = n; OB.dir = d; OB.pinErr = ''; OB.pin1 = ''; OB.pinBuf = '';
  /* the plan is built on the way forward only; on the way back it is simply there */
  const made = d > 0 && OB_STEPS[n] === 'plan'; OB.building = made && !reduced; OB.reveal = made && reduced;
  renderOb();
}
/* a digit of the code; the fourth asks for the code again, and the same code twice is kept */
function obPin(k) {
  if (OB.pin) return;
  if (k === 'del') OB.pinBuf = OB.pinBuf.slice(0, -1);
  else if (OB.pinBuf.length < 4) { OB.pinBuf += k; haptic('select'); }
  OB.pinErr = '';
  const dots = $$('#pinDots i'); dots.forEach((d, i) => d.classList.toggle('on', i < OB.pinBuf.length));
  const err = $('#pinErr'); if (err) err.textContent = '';
  if (OB.pinBuf.length < 4) return;
  const typed = OB.pinBuf;
  setTimeout(() => {
    if (!OB.on || !obIs('pin')) return;
    if (!OB.pin1) { OB.pin1 = typed; OB.pinBuf = ''; renderOb(); return; }
    if (typed !== OB.pin1) { OB.pin1 = ''; OB.pinBuf = ''; OB.pinErr = say('הקודים לא תואמים. מתחילים מחדש.', 'The codes did not match. Let us start again.'); renderOb(); haptic('warn'); return; }
    pinHash(typed).then((h) => { if (!OB.on || !obIs('pin')) return; OB.pin = h; OB.pin1 = ''; OB.pinBuf = ''; renderOb(); feel('set', 'success'); });
  }, 180);
}
/* show the opening screens when they are due: the settings are known, they were never passed, and no workout is in the middle */
function maybeOb() {
  /* passed on another device while open here: they close. Opened again from the profile, they were passed before, and stay */
  if (OB.on) { if (S.cfg.me.ob && S.cfg.me.ob !== OB.was) closeOb(); return; }
  if (S.cfgReady && !S.cfg.me.ob && nextUp().live < 0 && $('#sheet').hidden) openOb();
}
function wireOb() {
  const el = $('#ob');
  el.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    /* a touch on the film moves it on to its next beat */
    if (!b) { if (OB.step === 0 && ev.target.closest('#obTap,.ob-film,.ob-cap')) filmBeat(OB.beat + 1); else if (ev.target.closest('#obBuild')) obBuilt(); return; }
    if (b.id === 'obNext') { if (ev.detail !== 0 && Date.now() - (OB.stepAt || 0) < 300) return; obStep(1); }
    else if (b.id === 'obBack') obStep(-1);
    else if (b.id === 'obSkip') obFinish(true);
    else if (b.id === 'obFb') { OB.fb = OB.fb > 0 ? 0 : 2; b.setAttribute('aria-checked', String(OB.fb > 0)); haptic('select'); }
    else if (b.dataset.pin) obPin(b.dataset.pin);
    else if (b.dataset.lang) { if (b.getAttribute('aria-pressed') === 'true') return; obFade(() => { setLang(b.dataset.lang, true); renderOb(); }); }
    /* an answer is marked where it stands: the screen does not arrive a second time */
    else if (b.dataset.ob) {
      const k = b.dataset.ob, v = +b.dataset.v;
      if (k === 'goals') { const i = OB.goals.indexOf(v); if (i >= 0) OB.goals.splice(i, 1); else OB.goals.push(v); b.setAttribute('aria-checked', String(i < 0)); $('#obNext').disabled = !OB.goals.length; }
      else { OB[k] = v; for (const o of $$('[data-ob="' + k + '"]', el)) o.setAttribute('aria-checked', String(o === b)); $('#obNext').disabled = false; }
      haptic('select');
      if (k === 'exp') obPre();
    }
    else if (b.dataset.look) setLook(b.dataset.look, +b.dataset.v);
    else if (b.dataset.lktab) lookTab(b.dataset.lktab);
    else if (b.id === 'lkPhoto') $('#lkFile').click();
  });
  el.addEventListener('input', (ev) => { if (ev.target.id === 'obName') OB.name = ev.target.value; });
  el.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.id === 'obName') { ev.preventDefault(); obStep(1); }
    else if (obIs('pin') && /^[0-9]$/.test(ev.key)) obPin(ev.key);
    else if (obIs('pin') && ev.key === 'Backspace') obPin('del');
  });
}

/* ================================================================== boot */
let booted = false;
function boot(data) {
  if (booted) return; booted = true;
  data = data || {};
  const d = loadLocal();
  if (d.sessions) S.sessions = d.sessions;
  if (typeof d.sound === 'boolean') S.sound = d.sound;
  if (typeof d.buzz === 'boolean') S.buzz = d.buzz;
  if (Array.isArray(d.dirty)) S.dirty = new Set(d.dirty);
  if (Array.isArray(d.gone)) S.gone = new Set(d.gone);
  if (d.cfg) S.cfg = normCfg(d.cfg);
  /* the copy of the settings this device last shared with the account: a fresh copy starts from its defaults; one saved before this was kept has none until the account answers */
  S.cfgBase = d.cfg ? (d.cb ? normCfg(d.cb) : null) : clone(S.cfg);
  if (d.pre && typeof d.pre === 'object') S.pre = d.pre;
  if (d.day && typeof d.day === 'object' && !Array.isArray(d.day)) S.day = d.day;
  sweep();
  /* a workout that was already running before mesocycles existed joins the current one where it stands */
  for (const s of Object.values(S.sessions)) if (!s.end && !s.m) { stamp(s); touch(s, true); }
  S.tab = typeof data.tab === 'number' && data.tab >= 0 && data.tab < 4 ? data.tab : nextUp().next;
  if (Array.isArray(data.msgs)) chat.msgs = data.msgs;
  if (Array.isArray(data.turns)) chat.turns = data.turns;
  applyLang();
  readColors(); wireApp(); wireFeel(); wireCoach(); wireChat(); wireMe(); wireOb();
  setView(['workout', 'home', 'profile'].includes(data.view) ? data.view : nextUp().live >= 0 ? 'workout' : 'home', true);
  S.open = typeof data.open === 'string' ? data.open : null;
  splash(); renderAll(); initChat();
  initCloud(onRemoteChange);
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then((dl) => { if (dl) { S.dl = dl; renderHistory(); } }).catch(() => {});
}
(function () {
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ view: S.view, tab: S.tab, open: S.open, turns: chat.turns.slice(-16), msgs: chat.msgs.filter((m) => !m.live).slice(-24).map((m) => ({ role: m.role, text: m.text, hadImg: !!m.hadImg, ctx: m.ctx || '', note: m.note || '' })) })); } catch (e) { /* no live update here */ }
  try { if (hot && typeof hot.ready === 'function') { hot.ready(boot); setTimeout(() => boot({}), 1200); } else boot((hot && hot.data) || {}); } catch (e) { console.error('gymi: boot failed', e); if (!booted) boot({}); }
})();
