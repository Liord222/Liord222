.num{height:64px;padding:0 3px}
.step{width:52px;font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--wk-ink);font-variant-numeric:tabular-nums}
.step:active,.rstep:active{background:var(--surface-3)}
.rstep{width:44px;color:var(--wk-ink)}
.dk-kg b.word{font-size:20px;letter-spacing:0}
.hit{min-height:60px;font-size:19px}

/* ---- the rest: the whole screen, in the workout's colour ---- */
.dock.rest{top:0;border-radius:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--wk);color:#fff;padding-top:calc(10px + env(safe-area-inset-top,0px));overflow-y:auto;animation:rest-in .34s cubic-bezier(.2,.8,.2,1)}
@keyframes rest-in{from{opacity:0;transform:translateY(24px)}}
.dock.rest::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 60% at 50% 38%,rgb(255 255 255 / .16),transparent 70%)}
.dock.rest .dock-in{position:relative;min-height:100%;max-width:480px;grid-template-rows:auto minmax(0,1fr) auto auto;gap:14px}
.rt-top{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;min-height:44px}
.rt-undo{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:rgb(255 255 255 / .16);color:#fff;padding:0}
.rt-undo svg{width:22px;height:22px;stroke-width:2.3}
.rt-log{justify-self:center;display:inline-flex;flex-wrap:nowrap;color:#fff;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:99px;background:rgb(0 0 0 / .2);font-size:15px;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.rt-log svg{width:18px;height:18px;stroke-width:2.8}
.rt-log i{font-style:normal;font-weight:800}
.rt-log.pr{background:var(--gold);color:var(--gold-ink)}
.rt-log.pr svg{fill:currentColor;stroke:none}
.rt{display:grid;justify-items:center;align-content:center;gap:16px;min-height:0}
.rt-ring{position:relative;display:grid;place-items:center;width:min(66vw,290px,42vh);aspect-ratio:1}
.rt-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rt-ring circle{fill:none;stroke-width:10}
.rt-ring .t{stroke:rgb(255 255 255 / .2)}
.rt-ring .f{stroke:#fff;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear,stroke .3s}
.rt-mid{display:grid;justify-items:center;gap:2px}
.rt-time{min-width:0;font-size:clamp(54px,17vw,76px);font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;direction:ltr}
.rt-word{font-size:17px;font-weight:700;opacity:.86}
.dock.ready .rt-ring .f,.dock.go .rt-ring .f{stroke:var(--gold)}
.dock.go .rt-ring{animation:rest-go 1s ease-in-out infinite}
@keyframes rest-go{50%{transform:scale(1.035)}}
.dock.go .rt-word{opacity:1;color:var(--gold)}
.rt-adj{display:flex;gap:12px}
.rt-adj button{min-width:76px;height:46px;border:0;border-radius:12px;background:rgb(255 255 255 / .16);color:#fff;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.rt-foot{display:grid;gap:12px;padding-bottom:2px}
.rt-state{display:block;font-size:16px;font-weight:600;line-height:1.35;color:rgb(255 255 255 / .86);text-align:center;white-space:normal;text-wrap:balance}
.rt-state b{display:none}
.rt-foot .go{width:100%;min-height:60px;border:0;border-radius:16px;background:#fff;color:var(--wk-lip);font-size:19px;font-weight:700;box-shadow:0 4px 0 rgb(0 0 0 / .22);margin-bottom:4px}

/* the question about an exercise that was just finished: a card with three answers, and pain as a quiet chip */
.fb-dock{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--surface-2)}
.fb-h{display:grid;gap:1px}
.fb-h b{font-size:17px;font-weight:800;white-space:normal}
.fb-h span{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbk{display:grid;gap:8px;justify-items:stretch}
.fb-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.fb-o{min-height:50px;padding:4px 6px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);font-size:15.5px;font-weight:700;line-height:1.2;box-shadow:inset 0 0 0 1.5px var(--line)}
.fb-o[aria-pressed="true"]{background:var(--wk);color:#fff;box-shadow:none}
.fb-pain{justify-self:center;min-height:44px;padding:0 14px;border:0;border-radius:99px;background:none;color:var(--ink-2);font-size:14px;font-weight:600;text-decoration:underline;text-decoration-color:var(--ink-4);text-underline-offset:3px}
.fb-row.pain .fb-o[aria-pressed="true"]{background:var(--muscle);color:#fff}
.dock.rest .fb-dock{border-top:0;padding:14px;background:rgb(255 255 255 / .96);color:var(--ink);animation:ob-rise .4s cubic-bezier(.2,.8,.2,1) .15s both}
.dock.rest .fb-o{background:var(--surface-2)}
.dock.rest .fb-o[aria-pressed="true"]{background:var(--wk);color:#fff}
:root[data-theme="dark"] .dock.rest .fb-dock{background:var(--surface)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dock.rest .fb-dock{background:var(--surface)}}

/* ---- before the first set: how long is there today? Tiles with the minutes large, the whole workout across the foot ---- */
.pre.gate.time{margin-top:6vh;gap:6px}
.pre-ic{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;background:var(--wk-soft);color:var(--wk-ink);margin-bottom:6px}
.pre-ic svg{width:30px;height:30px;stroke-width:2.2}

/* ---- the details of an exercise, and "more" ---- */
.hw-facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hw-facts li{display:grid;justify-items:center;gap:2px;padding:12px 6px;border-radius:14px;background:var(--wk-soft);color:var(--wk-ink)}
.hw-facts b{font-size:20px;font-weight:800;line-height:1.15;white-space:nowrap}
.hw-facts span{font-size:12.5px;font-weight:600;opacity:.85}
.hw .muscles{justify-content:flex-start;font-size:14.5px}
.sheet .hw-h{font-size:17px;font-weight:800;margin-bottom:-6px}

.mr-rows{display:grid;gap:8px}
.mr .fb-o{background:var(--surface-2)}
.mr-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 14px;border:0;border-radius:14px;background:var(--surface-2);color:var(--ink);text-align:start}
.mr-row i{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--wk-soft);color:var(--wk-ink)}
.mr-row i svg{width:22px;height:22px;stroke-width:2.3}
.mr-row span{display:grid;min-width:0}
.mr-row b{font-size:16px;font-weight:700;line-height:1.3}
.mr-row small{font-size:13px;color:var(--ink-2)}
.mr-row>svg{width:18px;height:18px;color:var(--ink-4)}

/* ---- the exercise picker: the workout's own card at its head, and every exercise a card with its demo and its tags ---- */
.sheet-in.sw{gap:12px}
.card.next.sw-hero{gap:6px;padding:16px 18px 18px;margin-bottom:5px}
.sw-hero .next-top{display:flex;align-items:center;gap:10px}
.sw-hero .k{flex:1;min-width:0;font-size:14px;font-weight:700;color:#fff;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-hero .icon-btn{width:38px;height:38px;background:rgb(255 255 255 / .18);color:#fff}
.sheet .sw-hero h2{font-size:27px;color:#fff}
.sheet .sw-hero .meta{font-size:14px;color:rgb(255 255 255 / .86)}
.sw .mu-row button[aria-pressed="true"]{background:var(--wk);color:#fff}
.sw-list{display:grid;gap:8px}
.sw-opt+.sw-opt{border-top:0}
.sw-opt{border-radius:16px;background:var(--surface-2);transition:box-shadow .2s,background-color .2s}
.sw-opt.on{background:var(--wk-soft);box-shadow:inset 0 0 0 2px var(--wk)}
.sw-row{grid-template-columns:auto minmax(0,1fr);min-height:72px;padding:10px 12px;border-radius:16px}
.sw-pic{display:grid;place-items:center;width:68px;height:52px;border-radius:14px;background:var(--surface);overflow:hidden}
.sw-t b{font-size:16px;font-weight:700}
.sw-tags{display:flex;flex-wrap:wrap;gap:4px;padding-top:3px}
.sw-tag{font-style:normal;font-size:12px;font-weight:600;line-height:1.7;padding:0 8px;border-radius:99px;background:var(--surface-3);color:var(--ink-2)}
.sw-tag.jf{background:var(--wk-soft);color:var(--wk-ink)}
.sw-opt.on .sw-tag{background:var(--surface)}
.sw-opt.on .sw-t b{color:var(--wk-ink)}
.sw-b{padding:0 12px 12px}
.sw-b .btn.primary{background:var(--wk);box-shadow:0 4px 0 var(--wk-lip)}

/* ---- the end of a workout: its colour over the whole sheet, the points large, the level bar, and what opened ---- */
.sheet:has(>.sum){padding-top:0}
.sheet-in.sum{justify-items:center;text-align:center;gap:10px;width:100%;height:100%;max-height:none;border-radius:0;align-content:center;background:radial-gradient(130% 90% at 50% 36%,#3B2477 0%,#1A1038 46%,#07050D 100%);color:#fff;padding-top:calc(26px + env(safe-area-inset-top,0px));overflow:hidden}
.sheet-in.sum::before{display:none}
.sheet-in.sum::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 34% at 50% 34%,color-mix(in srgb,var(--wk) 70%,transparent),transparent 72%)}
.sheet-in.sum>*{position:relative;z-index:1}
.sum .confetti{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.sheet .sum-k{display:inline-block;padding:5px 16px;border-radius:99px;background:rgb(255 255 255 / .14);font-size:15px;font-weight:700;color:#fff;animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) both}
.sum-av{width:min(190px,44vw);margin-block:4px -4px;animation:fin-max .7s cubic-bezier(.3,1.35,.5,1) .1s both}
.sum-av .av-aura{display:none}
.sum-av .av-shadow{fill:rgb(0 0 0 / .28)}
.sum-av.pump .av{animation:pump .65s cubic-bezier(.3,1.5,.5,1)}
.sum .sum-xp{display:grid;justify-items:center;font-size:72px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 4px 0 rgb(0 0 0 / .18);animation:ob-pop .5s cubic-bezier(.3,1.5,.5,1) .25s both}
.sum .sum-xp small{font-size:17px;font-weight:700;letter-spacing:0;color:#fff;text-shadow:none;opacity:.9}
.sheet .sum-up{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:99px;background:var(--gold);color:var(--gold-ink);font-size:20px;font-weight:800;opacity:0;transform:scale(.6)}
.sheet .sum-up.show{opacity:1;transform:none;transition:opacity .25s,transform .5s cubic-bezier(.3,1.7,.5,1)}
.sum-up svg{width:22px;height:22px;fill:currentColor;stroke:none}
.sum-lv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;max-width:340px;margin-top:6px;animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) .35s both}
.sum-lv .lv-badge{height:30px;padding:0 12px;font-size:14.5px;background:#fff;color:#2A1866}
.sum-lv .lv-badge.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.sum-lv .xpbar{height:14px;background:rgb(255 255 255 / .16)}
.sum-lv .xpbar i{background:var(--gold);transition:width .85s cubic-bezier(.2,.8,.2,1)}
.sum-nx{display:grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:12px;background:rgb(255 255 255 / .2);font-size:14.5px;font-weight:800}
.sum .sum-new{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;width:100%;max-width:340px}
.sum .sum-new li{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:6px 16px;border-radius:14px;background:rgb(255 255 255 / .16);font-size:17px;font-weight:700;animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) .8s both}
.sum .sum-new li:nth-child(2){animation-delay:.95s}
.sum .sum-new li:nth-child(3){animation-delay:1.1s}
.sum .sum-new li.gold{background:var(--gold);color:var(--gold-ink)}
.sum .sum-new svg{width:22px;height:22px;color:inherit}
.sum .sum-new li.gold svg{fill:currentColor;stroke:none}
.sheet-in.sum .btn.primary{margin-top:14px;max-width:440px;background:#fff;color:#2A1866;box-shadow:0 12px 34px rgb(109 63 224 / .45)}
.sum .sum-new,.sum-lv{max-width:360px}

/* on a wide screen the rest is a tall card over the workout's column, not the whole window */
@media (min-width:1000px){.dock.rest{top:16px;border-radius:20px;padding:16px}}
@media (max-height:700px){
  .fx .ex-name{font-size:22px}
  .fx-rx{font-size:13.5px}
  .num{height:56px}
  .hit{min-height:54px}
  .rt-adj button{height:42px}

  .sum .sum-xp{font-size:58px}
  .sum-av{width:min(140px,36vw)}
}

/* ================================================================== the opening
   A black curtain with the name lifts onto a short film on a night-purple stage: the camera finds Eilon, who waves, pulls
   back onto the player's character, and pushes in as it grows. Then the questions, on the page's own paper: Eilon beside
   each one, the answers under him. The plan is built in front of the lifter, and the last screen is the stage again, with
   today's character and the one at level 100. Things rise softly into place; nothing slides in from the side */
.splash{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:#000;color:#fff}
.splash[hidden]{display:none}
.splash.out{animation:splash-out .44s ease-in forwards;pointer-events:none}
.splash-in{display:grid;justify-items:center;gap:12px;direction:ltr;animation:splash-logo 1.7s cubic-bezier(.2,.8,.2,1) both}
.splash .logo-w{font-size:60px;color:#fff}
.splash .logo-i{color:#A98BFF}
.splash small{font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#9693A3;animation:ob-rise .6s ease-out .5s both}
@keyframes splash-logo{0%{opacity:0;transform:scale(.84)}30%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1.04)}}
@keyframes splash-out{to{opacity:0;visibility:hidden}}

.ob{position:fixed;inset:0;z-index:90;background:var(--paper);overflow-x:clip;overflow-y:auto;overscroll-behavior:none;--side:1}
[dir="ltr"] .ob,.ob[dir="ltr"]{--side:-1}
.ob[data-k="film"],.ob[data-k="done"]{background:#07050D}
.ob[data-k="film"]{overflow:hidden}
.ob-in{position:relative;z-index:1;box-sizing:border-box;min-height:100%;max-width:480px;margin-inline:auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 0}
/* nothing is seen, and nothing moves, until the curtain is up */
.ob:not(.play) .ob-in,.ob:not(.play) .ob-film{visibility:hidden}
.ob:not(.play) *{animation-play-state:paused!important}
.ob-top{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:12px;min-height:44px}
.ob-top.first{grid-template-columns:auto minmax(0,1fr) auto}
.ob-top .link{min-height:44px;padding:0 6px;justify-self:end;white-space:nowrap}
.ob-sp{width:44px}
.ob-top .ob-lang{width:auto;margin:0;padding:3px;border-radius:14px;background:var(--surface)}
.ob-top .ob-lang button{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
/* the steps fill from left to right, in both languages */
.ob-prog{direction:ltr;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.ob-prog i{display:block;height:100%;min-width:6px;border-radius:99px;background:var(--accent);transition:width .55s cubic-bezier(.2,.8,.2,1)}
.ob-body{display:grid;gap:18px;align-content:start;min-height:0}
.ob-foot{position:sticky;bottom:0;z-index:2;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 72%,transparent)}
.ob-foot .btn{width:100%}

/* ---- the stage: the film at the start, and the last screen ---- */
.ob-film{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(130% 90% at 50% 38%,#3B2477 0%,#1A1038 46%,#07050D 100%);color:#fff}
.ob-film::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,#07050D 0%,rgb(7 5 13 / .72) 14%,transparent 31%),radial-gradient(120% 85% at 50% 45%,transparent 55%,rgb(0 0 0 / .5) 100%)}
.ob-cam{position:absolute;inset:0;display:grid;place-items:center;animation:cam-drift 11s ease-in-out infinite alternate}
@keyframes cam-drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(calc(var(--side) * -1.4%),-1%,0) scale(1.035)}}
/* the camera: it moves by moving the whole set under it. The feet stay where they stand, so a figure grows upwards */
.ob-set{position:relative;width:min(100vw,460px);height:min(60vh,520px);margin-top:-8vh;transform-origin:50% 92%;transition:transform 1.4s cubic-bezier(.65,0,.35,1)}
.ob-film[data-beat="0"] .ob-set{transform:scale(1.45) translateX(calc(var(--side) * -23%))}
.ob-film[data-beat="2"] .ob-set{transform:scale(1.4) translateX(calc(var(--side) * 24%))}
.ob-floor{position:absolute;left:4%;right:4%;bottom:2.5%;height:15%;border-radius:50%;background:radial-gradient(ellipse at center,rgb(169 139 255 / .3),transparent 70%)}
.ob-coach{position:absolute;bottom:5%;display:block;isolation:isolate}
/* each figure carries its own light, so whoever the camera is on stands in it */
.ob-coach::before,.ob-fig::before{content:"";position:absolute;z-index:-1;left:50%;top:42%;width:190%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgb(169 139 255 / .42) 0%,rgb(109 63 224 / .14) 42%,transparent 68%);animation:ob-glow 4.5s ease-in-out infinite alternate}
@keyframes ob-glow{to{opacity:.62;transform:translate(-50%,-50%) scale(1.08)}}
.ob-coach{inset-inline-start:5%;width:43%;transition:opacity .7s ease}
.ob-film[data-beat="2"] .ob-coach{opacity:0}

.ob-coach .av{display:block;width:100%;height:auto;overflow:visible}
.ob-film .av-aura,.ob-done .av-aura{display:none}
.ob-film .av-shadow,.ob-done .av-shadow{fill:rgb(0 0 0 / .4)}

.ob-in.film,.ob-in.fin{color:#fff}
.ob-in.film .ob-body{grid-template-rows:auto minmax(0,1fr) auto;gap:8px}
.ob-in.film .ob-foot,.ob-in.fin .ob-foot{background:none}

.ob-in.film .logo-w{color:#fff;font-size:32px}
.ob-in.film .logo-i{color:#A98BFF}
.ob-in.film .logo small{color:rgb(255 255 255 / .55)}

@keyframes cap-in{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}

@keyframes story{to{width:100%}}
.ob-in.film .ob-lang{background:rgb(255 255 255 / .1)}
.ob-in.film .ob-lang button{color:rgb(255 255 255 / .75);background:none}
.ob-in.film .ob-lang button[aria-pressed="true"]{background:#fff;color:#22134F}
.ob-in.film .link{color:rgb(255 255 255 / .8)}
.ob-in.fin .fx-nav{color:rgb(255 255 255 / .7)}
.ob-in.film .btn.primary,.ob-in.fin .btn.primary{background:#fff;color:#2A1866;box-shadow:0 12px 34px rgb(109 63 224 / .45);animation:ob-rise .6s cubic-bezier(.2,.8,.2,1) .5s both}

/* ---- a question: Eilon beside it, the answers under it ---- */
.ob-q{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:end}
.ob-eilon{position:relative;display:block;width:86px}
.ob-eilon .av{display:block;width:100%;height:auto;overflow:visible}
.ob-eilon .av-aura{fill:var(--accent-soft)}
.ob-bub{position:relative;align-self:center;background:var(--surface);border-radius:16px;border-end-start-radius:6px;padding:14px 18px;box-shadow:0 1px 0 var(--line),0 12px 30px -20px rgb(40 20 90 / .45);transform-origin:var(--bub-o,0 100%)}
.ob-bub h1{margin:0;font-size:22px;font-weight:800;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.ob-bub p{margin:4px 0 0;font-size:14.5px;color:var(--ink-2)}
.ob-q.big{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;gap:14px;padding-top:2vh}
.ob-q.big .ob-eilon{width:min(150px,36vw)}
.ob-q.big .ob-bub{border-radius:16px;--bub-o:50% 0}
.ob-q.big .ob-bub::before{content:"";position:absolute;top:-6px;left:50%;width:14px;height:14px;border-radius:3px;background:inherit;transform:translateX(-50%) rotate(45deg)}
/* a large figure stands in a soft light, not on a disc */
.ob-q.big .av-aura,.ob-pre .av-aura{display:none}
.ob-q.big .ob-eilon,.ob-pre{isolation:isolate}
.ob-q.big .ob-eilon::before,.ob-pre::before{content:"";position:absolute;z-index:-1;left:50%;top:48%;height:104%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,var(--accent-soft) 0%,color-mix(in srgb,var(--accent-soft) 60%,transparent) 55%,transparent 100%)}
@keyframes ob-pop{from{opacity:0;transform:translateY(12px) scale(.92)}}
@keyframes bub-in{from{opacity:0;transform:scale(.95)}}
@keyframes ob-rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fade-in{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
/* a screen that is arrived at rises into place, its answers one after the other; one that is only drawn again stands still.
   From one question to the next Eilon stays where he stands */
.ob-body.in .ob-eilon{animation:ob-pop .55s cubic-bezier(.3,1.4,.5,1) both}
.ob-in.stay .ob-body.in .ob-eilon{animation:none}
.ob-body.in .ob-bub{animation:bub-in .45s cubic-bezier(.2,.8,.2,1) .06s both}
.ob-body.in .ob-opts>*{animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) both}
.ob-opts>:nth-child(1){animation-delay:.1s}
.ob-opts>:nth-child(2){animation-delay:.16s}
.ob-opts>:nth-child(3){animation-delay:.22s}

.ob-body.in .ob-name,.ob-body.in .ob-pre,.ob-body.in .ob-build{animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) .12s both}

/* the name, large, in the middle of the screen */
.ob-name{display:grid;justify-items:center;gap:8px;padding-top:3vh}
.ob-in-name{box-sizing:border-box;width:100%;max-width:340px;height:66px;border:0;border-radius:16px;background:var(--surface);padding:0 18px;text-align:center;font:inherit;font-size:28px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);transition:box-shadow .2s}
.ob-in-name:focus{outline:none;box-shadow:inset 0 0 0 2.5px var(--accent),0 0 0 6px var(--accent-soft)}
.ob-in-name::placeholder{color:var(--ink-4);font-weight:600}

/* answers: a card each, with an icon on a tint; the chosen one is lit */
.ob-opts{display:grid;gap:10px}
.ob-opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;min-height:70px;padding:12px 16px;border:0;border-radius:16px;background:var(--surface);color:var(--ink);text-align:start;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .2s,background-color .2s,transform .3s cubic-bezier(.34,1.45,.64,1)}
.ob-opt:active{transform:scale(.98)}
.ob-opt .ob-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);transition:background-color .2s,color .2s}
.ob-opt .ob-ic svg{width:24px;height:24px;stroke-width:2.2}
.ob-opt .ob-ic svg.pl{width:30px;height:30px;fill:currentColor}
.ob-opt span{display:grid;min-width:0;gap:1px}
.ob-opt b{font-size:17px;font-weight:700;line-height:1.3}
.ob-opt small{font-size:13.5px;color:var(--ink-2)}
.ob-chk{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink-4);color:transparent;transition:background-color .2s,border-color .2s,color .2s}
.ob-opt[role="checkbox"] .ob-chk{border-radius:8px}
.ob-chk svg{width:15px;height:15px;stroke-width:3}
.ob-opt[aria-checked="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.ob-opt[aria-checked="true"] .ob-ic{background:var(--accent);color:var(--on-accent)}
.ob-opt[aria-checked="true"] .ob-chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:pop .35s cubic-bezier(.3,1.7,.5,1)}

/* the character under the experience question, as built as the answer: it takes the room that is left, so the screen never scrolls */
.ob-in[data-k="exp"] .ob-body{grid-template-rows:auto auto minmax(96px,1fr)}
.ob-pre{position:relative;align-self:center;width:100%;height:100%;max-height:310px;min-height:0}
.ob-pre .av{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 92%}
.ob-pre.pump .av,.lk-stage.pump .av{animation:pump .65s cubic-bezier(.3,1.5,.5,1)}
@keyframes pump{0%{transform:scale(.9)}45%{transform:scale(1.07)}100%{transform:none}}

/* the time: four tiles with the minutes large, and "any length" across the bottom */

/* the look: the character in the room that is left, and under it the editor */
.ob-in[data-k="look"] .ob-body{grid-template-rows:auto minmax(120px,1fr) auto}

/* the photo button stands beside the head, where the figure leaves room on both sides */

/* ---- the character editor (here and in the profile): tabs, and the choices of the tab that is open ---- */
.lk-ed{display:grid;gap:12px;min-width:0}
.lk-tabs{display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--surface-2);overflow-x:auto;scrollbar-width:none}
.lk-tabs::-webkit-scrollbar{display:none}
.lk-tabs button{flex:1 0 auto;min-height:38px;padding:0 9px;border:0;border-radius:11px;background:none;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.lk-tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 4px rgb(20 10 50 / .16)}
.lk-pane{display:grid;align-content:center;min-height:164px}
.lk-opts{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:8px;justify-items:center;padding:4px 2px}
.lk-opts .lk-sw{width:100%;max-width:46px;height:auto;aspect-ratio:1}
.lk-sw:not([aria-pressed="true"]){box-shadow:inset 0 0 0 1px rgb(0 0 0 / .14)}
.lk-cuts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lk-cuts.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lk-cut{display:grid;justify-items:center;gap:3px;min-width:0;padding:6px 0 7px;border:0;border-radius:14px;background:var(--surface-2);color:var(--ink-2)}
.lk-cut small{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;font-weight:600;white-space:nowrap}
.lk-face{display:block;width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--surface-3)}
.lk-face .av{display:block;width:100%;height:100%}
.lk-cuts.three .lk-cut{padding:10px 0}
.lk-cuts.three .lk-face{width:60px;height:60px}
.lk-cuts.three .lk-cut small{font-size:13px}
.lk-cut[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent)}
.lk-tees{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lk-tee{display:grid;place-items:center;height:64px;border:0;border-radius:14px;background:var(--surface-2)}
.lk-tee svg{width:42px;height:42px;fill:var(--c);stroke:color-mix(in srgb,var(--ink) 26%,transparent);stroke-width:.7;stroke-linejoin:round}
.lk-tee[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.lk-photo-box{display:grid;justify-items:center;gap:4px}
.lk-photo{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border:0;border-radius:12px;background:var(--surface);color:var(--accent-ink);font-size:13.5px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line),0 8px 18px -12px rgb(40 20 90 / .55)}
.lk-photo svg{width:18px;height:18px}
.lk-photo:disabled{opacity:.8}
.spin{box-sizing:border-box;width:15px;height:15px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;animation:spin .8s linear infinite}
.lk-note{margin:0;max-width:180px;font-size:12px;font-weight:600;line-height:1.35;color:var(--ink-2)}

/* the plan is built in front of the lifter: a ring that fills, and each thing it is fitted to, ticked */
.ob-build{display:grid;justify-items:center;gap:22px;padding-top:1vh;cursor:pointer}
.ob-ring{position:relative;display:grid;place-items:center;width:128px;height:128px}
.ob-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ob-ring circle{fill:none;stroke-width:9}
.ob-ring .t{stroke:var(--surface-3)}
.ob-ring .f{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.ob-ring b{font-size:30px;font-weight:800;letter-spacing:-.02em}
.ob-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;width:100%}
.ob-steps li{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 16px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:15.5px;font-weight:600;color:var(--ink-3);opacity:.5;transition:opacity .3s,color .3s}
.ob-steps li.on{opacity:1;color:var(--ink)}
.ob-steps i{box-sizing:border-box;flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--surface-3);color:transparent}
.ob-steps li.on i{border-color:color-mix(in srgb,var(--accent) 22%,transparent);border-top-color:var(--accent);animation:spin .7s linear infinite}
.ob-steps li.done i{border-color:var(--accent);background:var(--accent);color:var(--on-accent);animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.ob-steps i svg{width:14px;height:14px;stroke-width:3.2}

/* the plan: the purple card of the workouts page, with its numbers; under it, whether Eilon asks */

@keyframes plan-in{from{opacity:0;transform:translateY(20px) scale(.93)}}

@keyframes shine{to{transform:translateX(130%)}}

/* all set: on the stage again, today's character and the same one at level 100 */
.ob-in.fin .ob-body{align-content:center}
.ob-done{position:relative;display:grid;justify-items:center;gap:8px;text-align:center}
.ob-done h1{margin:0;font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.02em;text-wrap:balance;animation:ob-rise .5s cubic-bezier(.2,.8,.2,1) .1s both}
.ob-sub{margin:0;font-size:16px;color:rgb(255 255 255 / .72);animation:ob-rise .5s cubic-bezier(.2,.8,.2,1) .2s both}
.ob-ladder{display:grid;grid-template-columns:minmax(0,.8fr) auto minmax(0,1.2fr);align-items:end;gap:4px;width:100%;margin-top:22px}
.ob-ladder figure{margin:0;display:grid;justify-items:center;gap:10px;min-width:0}
.ob-fig{position:relative;display:block;width:100%;isolation:isolate}
.ob-fig .av{display:block;width:100%;height:auto;overflow:visible}
.ob-ladder .now{animation:ob-rise .55s cubic-bezier(.2,.8,.2,1) .35s both}
.ob-ladder .max{animation:fin-max .8s cubic-bezier(.3,1.35,.5,1) 1.05s both}
@keyframes fin-max{from{opacity:0;transform:translateY(16px) scale(.8)}}
.ob-ladder .max .ob-fig::before{width:150%;background:radial-gradient(circle,rgb(242 176 46 / .5) 0%,rgb(242 176 46 / .15) 42%,transparent 68%)}
.ob-ladder figcaption{display:grid;justify-items:center;gap:4px;font-size:12.5px;font-weight:600;color:rgb(255 255 255 / .6)}
.ob-ladder figcaption b{padding:3px 12px;border-radius:99px;background:rgb(255 255 255 / .14);font-size:14.5px;font-weight:800;color:#fff}
.ob-ladder .max figcaption b{background:#F2B02E;color:#3D2600;box-shadow:0 6px 20px rgb(242 176 46 / .4)}
/* the way from one to the other: three arrowheads that light up in turn */
.ob-go{align-self:center;display:flex;gap:0;padding-bottom:34%;color:#A98BFF;animation:ob-rise .4s cubic-bezier(.2,.8,.2,1) .75s both}
.ob-go svg{width:20px;height:20px;margin-inline:-4px;stroke-width:2.6;opacity:.25;animation:go 1.5s ease-in-out infinite}
.ob-go svg:nth-child(2){animation-delay:.2s}
.ob-go svg:nth-child(3){animation-delay:.4s}
@keyframes go{0%,60%,100%{opacity:.25}25%{opacity:1}}
.ob-note{margin:18px 0 0;max-width:340px;font-size:12.5px;line-height:1.45;color:rgb(255 255 255 / .5);animation:fade-in .6s ease 1.4s both}
.ob-done .confetti{position:absolute;inset:-10% -20px;width:calc(100% + 40px);height:120%;pointer-events:none;z-index:2}

/* a change of language: what is on screen fades out, and comes back in the other one */
.ob-in.out{opacity:0;transition:opacity .17s ease}
.ob.swap .ob-film{opacity:.4;transition:opacity .17s ease}
.ob.swapin>*{animation:fade-in .32s ease both}
#app.lang-out>.brand,#app.lang-out>.cols,#app.lang-out>.dock,#app.lang-out>.sheet{opacity:0;transition:opacity .15s ease}
#app.lang-in>.brand,#app.lang-in>.cols,#app.lang-in>.dock,#app.lang-in>.sheet{animation:fade-in .3s ease}

@media (max-height:700px){
  .ob-q{grid-template-columns:64px minmax(0,1fr)}
  .ob-eilon{width:64px}
  .ob-q.big .ob-eilon{width:min(110px,30vw)}
  .ob-body{gap:14px}
  .ob-opt{min-height:62px;padding:10px 14px}

  .ob-set{height:min(54vh,460px)}

  .lk-pane{min-height:150px}
  .ob-ring{width:104px;height:104px}
  .ob-steps li{min-height:48px}
  .ob-ladder{margin-top:10px;padding-inline:8%}
  .ob-done h1{font-size:28px}
}
@media (max-height:600px){.ob-pre{display:none}.ob-in[data-k="exp"] .ob-body{grid-template-rows:auto auto}}
@media (max-width:359.98px){.ob-bub h1{font-size:20px}.ob-bub{padding:12px 14px}.lk-tabs button{padding:0 7px;font-size:12.5px}}

/* the clear label over every control on an iPhone browser, and the hidden switch it belongs to (feel.js) */
.hxp{position:relative}
.hx{position:absolute;inset:0;z-index:4;margin:0;padding:0;border:0;border-radius:inherit;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hx input{position:absolute;top:0;left:0;width:1px;height:1px;margin:0;visibility:hidden;pointer-events:none}
:disabled>.hx,[aria-disabled="true"]>.hx,[data-hx="off"] .hx{display:none}

@media (max-width:999.98px){
  .chat{position:fixed;inset:0;z-index:60;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .chat.open{display:flex}
  .app:not([data-view="workout"]) .chat{bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));padding-bottom:0}
  .app[data-view="workout"] .tabbar{display:none}
  .app[data-view="workout"] .logo{display:none}
  .app[data-view="workout"] .brand{display:grid;grid-template-columns:44px minmax(0,1fr) 44px}
  .app.chat-on .tabbar button[aria-current="page"]{color:var(--ink-3);background:none;box-shadow:none}
  .app.chat-on #chatOpen{color:var(--accent);font-weight:700}
  .app.chat-on:not([data-view="workout"]) .chat-close{display:none}
}
@media (max-width:999.98px){
  .sync{display:none}
  /* with no connection the phone says so, in one quiet line under the name */
  .app[data-sync="off"]:not([data-view="workout"]) .brand{flex-wrap:wrap;row-gap:2px}
  .app[data-sync="off"]:not([data-view="workout"]) .sync{display:block;flex:none;width:100%;text-align:center}
  .app:not([data-view="workout"]) .brand{justify-content:center}
  .app:not([data-view="workout"]) .logo{justify-items:center}
}
@media (min-width:700px){
  .fx .ex,.pre{max-width:560px;margin-inline:auto}
  .pre{width:100%}
  .sheet{place-items:center;padding:24px}
  .sheet-in{border-radius:20px;padding-top:26px}
  .sheet-in::before{display:none}
}
@media (min-width:1000px){
  .cols{grid-template-columns:minmax(0,1fr) 384px;padding-bottom:60px}
  .tabbar{position:static;padding:0;background:none;border:0;gap:4px;-webkit-backdrop-filter:none;backdrop-filter:none}
  .tabbar button{flex:none;display:flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:99px;font-size:14.5px}
  .tabbar svg{width:20px;height:20px}
  .tabbar button[aria-current="page"]{background:var(--surface)}
  #chatOpen,.chat-close{display:none}
  .chat{display:flex;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);height:calc(100vh - 112px);min-height:420px;margin-top:14px;border-radius:var(--r);overflow:hidden}
  .dock{left:auto;right:auto;inset-inline-start:max(20px,calc((100vw - 1180px)/2 + 20px));bottom:16px;width:min(620px,calc(100vw - 452px));border-radius:20px;padding:16px}
}
/* touch that feels like an app: a long press on a control does not select its words or open the system's menu */
button,[role="button"],.tabbar,.dock,.splash,.ob-film,.stage-wrap,canvas,.hx{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* a place opens with a short rise; a sheet slides up from the bottom, can be pulled back down by a finger, and slides away when it closes */
.view{animation:view-in .26s cubic-bezier(.2,.8,.2,1)}
/* a fade only: a screen that moved while it came in carried what is pinned inside it (the card of today's questions) with it, and that was cut and then jumped */
@keyframes view-in{from{opacity:0}}
.sheet.rise{animation:sheet-fade .22s ease-out}
.sheet.rise>.sheet-in{animation:sheet-up .34s cubic-bezier(.2,.9,.25,1)}
.sheet-in.back{transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.sheet.ghost{z-index:69;pointer-events:none;animation:sheet-fade-out .24s ease-in forwards}
.sheet.ghost>.sheet-in{animation:sheet-down .24s ease-in forwards}
@keyframes sheet-fade{from{background:rgb(8 10 14 / 0)}}
@keyframes sheet-fade-out{to{background:rgb(8 10 14 / 0)}}
@keyframes sheet-up{from{transform:translateY(100%)}}
@keyframes sheet-down{from{transform:var(--from,none)}to{transform:translateY(100%)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* read by a screen reader, not shown */
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---- a new exercise: the screen turns purple for a moment. Its place in the workout fills a ring that beats out waves, the word
   "new exercise" above it, the name and what it asks below. Everything rises into place; nothing comes from the side ---- */

@keyframes xi-up{from{opacity:0;transform:translateY(14px)}}
@keyframes xi-pop{from{opacity:0;transform:scale(.6)}}
@keyframes xi-fill{to{stroke-dashoffset:var(--to)}}
@keyframes xi-wave{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
@keyframes xi-time{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* a set on its button: the weight over the reps, each with its word */
.setp .v,.setp .hint{display:grid;justify-items:center;gap:1px;line-height:1.1;direction:inherit}
.sv{display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap}
.sv b{font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums}
.sv small{font-size:11px;font-weight:600;color:var(--ink-3)}
.setp .hint .sv b{font-weight:700;color:var(--ink-3)}
.setp{min-height:52px}
/* a workout's own name, on its page of the plan */
.bl-name{display:grid;gap:6px;margin-bottom:4px}
.bl-name>span{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.bl-name input{height:50px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:17px;font-weight:700}
.bl-name input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.bl-name small{font-size:12.5px;color:var(--ink-3)}
/* the opening's plan: the workouts are numbered, and can be named */
.ob-wk-tip{position:relative;display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:600;color:rgb(255 255 255 / .86)}
.ob-wk-tip svg{flex:none;width:16px;height:16px}
/* ---- the journey's map: four worlds of colour down the screen, the levels as medallions on a path, and the summit at 100 ---- */

/* the sign that opens a world: its number and levels, its name, and how much of it is open */

/* the levels: gold once reached, white and pulsing when next, glass when still ahead */

/* the kiosk's red buttons and its shelves: after the general button styles, so that they keep their colour */
.card.kiosk .btn.ks-go,.card.kiosk .btn.ks-go:hover{background:var(--ks);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--ks) 70%,#000)}

.sheet-in.ks .ks-shelf{min-height:46px;overflow-y:hidden}
/* the journey's medallions ahead are solid, so the path does not show through them */

/* the figure: a boy and a girl, whole, side by side */
.lk-cuts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.lk-bod .lk-face{width:110px;height:150px;border-radius:14px;background:var(--surface-3)}
.lk-bod .lk-face .av{width:100%;height:100%}
.lk-bod .av-aura,.lk-bod .av-glow{display:none}
/* on the narrowest phones the sixteen haircuts sit a little closer, so the look still fits on one screen */
@media (max-width:340px){.lk-cuts{gap:4px}.lk-cut{padding:4px 0 5px;gap:2px}.lk-face{width:38px;height:38px}}
.week-h h2{white-space:nowrap}

/* ---- round 2, phase 3: things that are pressed look pressable. Each stands on a solid edge of its own colour, and a press
   flattens the edge as the thing squeezes; nothing moves down. (The edge is a shadow, so it takes no room) */
.ob-opt,.lk-cut,.lk-tee,.pl-card,.ks-shelf button,.lk-photo,.act{box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--lip)}
.ks-it{box-shadow:0 3px 0 var(--lip)}
.ob-opt[aria-checked="true"],.lk-cut[aria-pressed="true"],.lk-tee[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent),0 3px 0 var(--accent-lip)}

.pl-card{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--wk-ink,var(--accent)) 16%,transparent),0 3px 0 color-mix(in srgb,var(--wk-ink,var(--accent)) 30%,var(--lip))}
.ks-shelf button[aria-checked="true"]{box-shadow:0 3px 0 var(--ks-ink)}
.ks-it.on{box-shadow:0 3px 0 var(--ks-ink)}
.ob-opt:active,.lk-cut:active,.lk-tee:active,.pl-card:active,.ks-shelf button:active,.ks-it:active,.lk-photo:active,.act:active{transform:scale(.97);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--lip);transition:transform .08s ease-out,box-shadow .08s ease-out}
.ob-opt[aria-checked="true"]:active,.lk-cut[aria-pressed="true"]:active,.lk-tee[aria-pressed="true"]:active{box-shadow:inset 0 0 0 2px var(--accent),0 1px 0 var(--accent-lip)}

.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--accent-lip)}
.btn:not(.primary):active:not(:disabled){box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--lip)}
.card.next .btn.primary:active:not(:disabled){box-shadow:0 1px 0 rgb(0 0 0 / .22)}
.setp:active{box-shadow:0 1px 0 var(--lip)}
.rt-adj button{box-shadow:0 3px 0 rgb(0 0 0 / .18)}
.rt-adj button:active{transform:scale(.96);box-shadow:0 1px 0 rgb(0 0 0 / .18)}
.st-btn{box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--lip)}
.st-btn:active{transform:scale(.96);box-shadow:inset 0 0 0 1.5px var(--line),0 0 0 var(--lip)}

/* ---- the opening asks the way the Workouts screen speaks: a purple card with a small line over a big one, and Eilon at its side.
   No speech bubble */
.ob-q:not(.big){grid-template-columns:minmax(0,1fr) 64px;align-items:center;gap:12px;padding:16px 18px 16px 14px;border-radius:20px;background:var(--wk-bg,var(--accent));color:#fff;box-shadow:0 4px 0 var(--accent-lip);position:relative;overflow:hidden}
[dir="rtl"] .ob-q:not(.big){padding:16px 18px 16px 14px}
.ob-q:not(.big)::after{content:"";position:absolute;inset-inline-end:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgb(255 255 255 / .07);pointer-events:none}
.ob-q:not(.big) .ob-bub{order:0;background:none;box-shadow:none;padding:0;border-radius:0;align-self:center}
.ob-q:not(.big) .ob-eilon{order:1;width:64px;height:64px;border-radius:50%;overflow:hidden;background:rgb(255 255 255 / .16);box-shadow:inset 0 0 0 2px rgb(255 255 255 / .28)}
.ob-q:not(.big) .ob-eilon .av-aura{display:none}

.ob-q:not(.big) .ob-bub h1{font-size:23px;line-height:1.15;color:#fff}

.ob-q.big .ob-bub{background:none;box-shadow:none;padding:0}
.ob-q.big .ob-bub::before{display:none}
.ob-q.big .ob-bub h1{font-size:28px}
/* on the plan the purple card is the plan itself, so the words over it stand plain */
.ob-in[data-k="plan"] .ob-q:not(.big){padding:0;background:none;color:var(--ink);box-shadow:none;overflow:visible}
.ob-in[data-k="plan"] .ob-q:not(.big)::after{display:none}
.ob-in[data-k="plan"] .ob-q:not(.big) .ob-eilon{background:var(--accent-soft);box-shadow:none}

.ob-in[data-k="plan"] .ob-q:not(.big) .ob-bub h1{color:var(--ink)}

/* ---- the plan's advanced settings, as finished as the rest: the round on a card of its own (its weeks rising toward failure,
   the easy week low again), its settings in a group with icons, and two real buttons */
.pl-more{gap:12px}
.adv-round{display:grid;gap:12px;padding:16px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.adv-round .kicker{margin:0;color:var(--accent-ink)}
.adv-round h3{margin:-8px 0 0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.adv-round>p:last-child{margin:0;font-size:14px;color:var(--ink-2)}
.adv-round .wk-strip{gap:6px;align-items:end}
.adv-round .wk-strip li{position:relative;display:grid;align-content:end;justify-items:center;gap:2px;min-height:112px;padding:8px 2px 9px;border-radius:12px;background:var(--surface-2);overflow:hidden}
.adv-round .wk-strip .wv{position:absolute;inset-inline:0;bottom:0;height:var(--h);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 24%,transparent),color-mix(in srgb,var(--accent) 10%,transparent));border-top:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.adv-round .wk-strip li.dl .wv{background:color-mix(in srgb,var(--ok) 14%,transparent);border-top-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.adv-round .wk-strip small,.adv-round .wk-strip b{position:relative}
.adv-round .wk-strip li.cur{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-lip)}
.adv-round .wk-strip li.cur .wv{background:rgb(255 255 255 / .16);border-top-color:rgb(255 255 255 / .6)}
.pl-more>.st-t{margin:6px 0 -4px}
.menu.adv-g{padding:2px 14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.menu.adv-g .m-row{gap:12px;min-height:60px}
.menu.adv-g .m-row .st-i svg{width:19px;height:19px;color:inherit}
.menu.adv-g .stp{gap:4px}
.menu.adv-g .stp button{width:40px;height:40px;border-radius:12px;background:var(--surface-2);box-shadow:0 3px 0 var(--lip);color:var(--ink);font-size:22px}
.menu.adv-g .stp button:active:not(:disabled){transform:scale(.94);box-shadow:0 1px 0 var(--lip)}
.menu.adv-g .stp b{min-width:34px;font-size:19px}
.pl-more .ms-act{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}
.btn.adv-b{gap:8px;min-height:50px;font-size:15px;font-weight:700}
.btn.adv-b svg{width:19px;height:19px;color:var(--accent-ink)}
.pl-more .ms-act .confirm{grid-column:1/-1}
/* its pages: the sets of each muscle as clean rows, the weight steps as pressable choices */
.vol{display:grid;gap:4px;padding:6px 14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.vol-row{padding:9px 0}
.vol-row+.vol-row{border-top:1px solid var(--line)}
.vol-bar{height:16px}
.vol-bar .band{border-radius:6px;background:color-mix(in srgb,var(--ok) 16%,var(--surface-2))}
.vol-bar .val{top:5px;height:6px;border-radius:3px}
.inc{display:grid;gap:0;padding:2px 14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.inc-row+.inc-row{border-top:1px solid var(--line)}
.inc-row select{box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--lip);border-radius:12px}
.menu.adv-g .m-row>.st-i{flex:none}

/* ---- the summary: almost there, what the workout weighed, and the surprise chest */
.sum-to{margin:-4px 0 0;font-size:14.5px;font-weight:700;color:var(--ink-2);text-align:center}
.sum-kg{display:flex;align-items:center;gap:10px;margin:0;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:15px;font-weight:600;line-height:1.35;color:var(--ink);text-align:start}
.sum-kg svg{flex:none;width:30px;height:30px;padding:5px;border-radius:10px;background:var(--xp-soft);color:var(--xp)}
.sum-kg b{font-weight:800}
.sum-chest{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:14px;width:100%;padding:10px 16px 10px 10px;border:0;border-radius:16px;background:linear-gradient(135deg,#FFF6DA,#FFE7A3);color:#5C3A00;text-align:start;box-shadow:inset 0 0 0 1.5px #F2C14E,0 4px 0 #D9A21E;animation:ch-call 2.4s ease-in-out infinite}
.sum-chest:active{transform:scale(.97);box-shadow:inset 0 0 0 1.5px #F2C14E,0 1px 0 #D9A21E}
.sum-chest .chest{display:block;width:96px;height:80px;overflow:visible}
.sum-chest .ch-lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.sum-chest .ch-t{display:grid;gap:2px}
.sum-chest .ch-t b{font-size:19px;font-weight:800;letter-spacing:-.01em}
.sum-chest .ch-t small{font-size:14px;font-weight:600;opacity:.8}
.sum-chest .ch-n{display:inline-flex;align-items:center;gap:6px;direction:ltr;justify-self:start;font-size:26px!important;animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
.sum-chest .ch-n .coin{width:26px;height:26px}
.sum-chest.open{animation:none}
.sum-chest.open .ch-lid{transform:rotate(-24deg) translate(-4px,-8px)}
.sum-chest .ch-shine{opacity:0;transition:opacity .3s .15s}
.sum-chest.open .ch-shine{opacity:1}
@keyframes ch-call{0%,78%,100%{transform:none}84%{transform:rotate(-2deg) scale(1.02)}90%{transform:rotate(2deg) scale(1.02)}}
@media (prefers-reduced-motion:reduce){.sum-chest{animation:none}}
:root[data-theme="dark"] .sum-chest{background:linear-gradient(135deg,#3A2A08,#4A3410);color:#FFE3A1;box-shadow:inset 0 0 0 1.5px #7A5A12,0 4px 0 #241804}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sum-chest{background:linear-gradient(135deg,#3A2A08,#4A3410);color:#FFE3A1;box-shadow:inset 0 0 0 1.5px #7A5A12,0 4px 0 #241804}}
.sum .sum-to{color:rgb(255 255 255 / .82)}
.sum .sum-kg{justify-content:center;min-height:50px;padding:8px 16px;background:rgb(255 255 255 / .16);color:#fff;font-size:16px;animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) 1.1s both}
.sum .sum-kg svg{background:rgb(255 255 255 / .18);color:#FFD66B}
.sum .sum-chest{animation:ob-rise .5s cubic-bezier(.2,.8,.2,1) 1.3s both,ch-call 2.4s ease-in-out 2s infinite}
.sum .sum-chest.open{animation:none}
.sum-chest.open .ch-lid{transform:rotate(-14deg) translate(-2px,-16px)}
/* the question card keeps the deep purple of the Workouts card in the dark too, where the accent itself is light */
.ob-q:not(.big){background:#6D3FE0;box-shadow:0 4px 0 #4B27B8}
.pl-more .ms-act{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
@media (max-width:360px){.menu.adv-g .stp button{width:36px;height:36px}.menu.adv-g .stp b{min-width:28px}.menu.adv-g .m-row{gap:10px}}

/* ==================================================================== round 3, phase 1: the workout, lighter and calmer
   ---- the colour of a muscle: soft, and only where it names the muscle (its chip, the new exercise's screen, a dot in a list) */
.tn-chest{--tn:#E8613A;--tn-bg:#FDEEE8;--tn-ink:#9A3412}
.tn-back{--tn:#2F7FE0;--tn-bg:#E8F1FC;--tn-ink:#164A8C}
.tn-sh{--tn:#E39A12;--tn-bg:#FCF2DE;--tn-ink:#7A4E05}
.tn-arm{--tn:#D9487A;--tn-bg:#FCEAF1;--tn-ink:#8E2450}
.tn-leg{--tn:#3F9B2A;--tn-bg:#EBF6E5;--tn-ink:#2B6418}
.tn-core{--tn:#14A07E;--tn-bg:#E2F6F0;--tn-ink:#0B6650}
:root[data-theme="dark"] .tn-chest{--tn-bg:#3A2219;--tn-ink:#FFB59A}
:root[data-theme="dark"] .tn-back{--tn-bg:#172A44;--tn-ink:#9CC7FF}
:root[data-theme="dark"] .tn-sh{--tn-bg:#3A2C10;--tn-ink:#FFD48A}
:root[data-theme="dark"] .tn-arm{--tn-bg:#3B1A28;--tn-ink:#FFA9C8}
:root[data-theme="dark"] .tn-leg{--tn-bg:#1E3317;--tn-ink:#A9E08F}
:root[data-theme="dark"] .tn-core{--tn-bg:#11332B;--tn-ink:#8EE6CF}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tn-chest{--tn-bg:#3A2219;--tn-ink:#FFB59A}
  :root:not([data-theme="light"]) .tn-back{--tn-bg:#172A44;--tn-ink:#9CC7FF}
  :root:not([data-theme="light"]) .tn-sh{--tn-bg:#3A2C10;--tn-ink:#FFD48A}
  :root:not([data-theme="light"]) .tn-arm{--tn-bg:#3B1A28;--tn-ink:#FFA9C8}
  :root:not([data-theme="light"]) .tn-leg{--tn-bg:#1E3317;--tn-ink:#A9E08F}
  :root:not([data-theme="light"]) .tn-core{--tn-bg:#11332B;--tn-ink:#8EE6CF}
}
.mus-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0}
.mus-chips span{padding:4px 10px;border-radius:9px;background:var(--surface-2);color:var(--ink-2);font-size:13px;font-weight:700;line-height:1.35}
.mus-chips span.p{background:var(--tn-bg);color:var(--tn-ink)}
.ex-body>.mus-chips{margin:2px 0 0}

/* ---- the demo's two corner buttons: details, and a plain swap */
.st-btn.swp{inset-inline-end:10px}
.st-btn span{font-size:13.5px;font-weight:700}

/* ---- a set still ahead says only which set it is */
.setp .hint{font-size:14px;font-weight:700;color:var(--ink-3)}
.setp.cur .hint{color:var(--accent-ink)}

/* ---- a new exercise: a light screen, the colour of its muscle on top with the figure doing it, and Start. It stays until Start */

@keyframes xi-up{from{opacity:0;transform:translateY(10px)}}

/* ---- the rest: dark and neutral in both themes. A ring of ticks around the time, a soft purple arc with a dot that leads it,
   a glow that breathes slowly behind it. Green when it is fine to start, gold when the rest is over */
.dock.rest{background:#121116;color:#fff}
.dock.rest::before{background:radial-gradient(70% 45% at 50% 40%,rgb(140 116 230 / .16),transparent 70%)}
.rt-top{grid-template-columns:44px minmax(0,1fr) 44px}
.rt-k{justify-self:center;font-size:15px;font-weight:700;color:rgb(255 255 255 / .6)}
.rt-undo{background:rgb(255 255 255 / .08)}
.rt-ring{width:min(76vw,320px,46vh)}
.rt-ring::before{content:"";position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle,rgb(140 116 230 / .28),transparent 68%);animation:rt-breathe 4s ease-in-out infinite}
@keyframes rt-breathe{50%{transform:scale(1.12);opacity:.7}}
.rt-ring svg{overflow:visible}
.rt-ring .t{stroke:rgb(255 255 255 / .07);stroke-width:7}
.rt-ring .f{stroke:#9B85F0;stroke-width:7;transition:stroke .4s}
.rt-ring .h{fill:#fff;stroke:#9B85F0;stroke-width:4;transition:stroke .4s}
.rt-ticks line{stroke:rgb(255 255 255 / .12);stroke-width:2.2;stroke-linecap:round;transition:stroke .3s}
.rt-ticks line.on{stroke:rgb(255 255 255 / .62)}
.dock.ready .rt-ring .f{stroke:#4FD1A5}.dock.ready .rt-ring .h{stroke:#4FD1A5}
.dock.go .rt-ring .f{stroke:var(--gold)}.dock.go .rt-ring .h{stroke:var(--gold)}
.dock.ready .rt-ring::before{background:radial-gradient(circle,rgb(79 209 165 / .22),transparent 68%)}
.dock.go .rt-ring::before{background:radial-gradient(circle,rgb(242 176 46 / .28),transparent 68%)}
.rt-time{font-size:clamp(60px,19vw,84px)}
.rt-word{font-size:16px;font-weight:700;color:rgb(255 255 255 / .62)}
.dock.ready .rt-word{color:#4FD1A5}
.rt-adj button{min-width:84px;height:48px;border-radius:14px;background:#24222B;box-shadow:0 3px 0 #08070B;font-size:17px}
.rt-adj button:active{transform:translateY(2px);box-shadow:0 1px 0 #08070B}
.rt-foot .go{background:#fff;color:#121116;box-shadow:0 4px 0 #8E8A99}
@media (prefers-reduced-motion: reduce){.rt-ring::before{animation:none}}

/* ---- points for a set: they rise above the screen and stay long enough to read. A best and a run of good sets get a word */
.gain{position:fixed;z-index:95;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);display:grid;justify-items:center;gap:6px;pointer-events:none;transform:translateX(-50%);animation:gain 1.9s cubic-bezier(.2,.8,.2,1) both}
.gain b{font-size:38px;font-weight:800;line-height:1;color:var(--gold);text-shadow:0 3px 0 rgb(0 0 0 / .3);direction:ltr}
.gain span{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:12px;background:var(--gold);color:var(--gold-ink);font-size:15px;font-weight:800;box-shadow:0 3px 0 var(--gold-lip)}
.gain.run span{background:#FF6A3D;color:#fff;box-shadow:0 3px 0 #C2410C}
.gain span svg{width:18px;height:18px;fill:currentColor;stroke:none}
@keyframes gain{0%{opacity:0;transform:translate(-50%,14px) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1.14)}20%{transform:translate(-50%,0) scale(1)}78%{opacity:1;transform:translate(-50%,-4px)}100%{opacity:0;transform:translate(-50%,-30px)}}

/* ---- how long there is today: one big card in the middle. A number to type, a few taps, and on */
.pre.gate.tq{margin-top:7vh;gap:12px;padding:30px 20px 20px;border-radius:24px;box-shadow:inset 0 0 0 1.5px var(--line),0 4px 0 var(--lip)}
.tq h2{margin:0 0 4px}
.tq-in{display:flex;align-items:baseline;justify-content:center;gap:8px;width:100%;max-width:260px;padding:10px 16px;border-radius:18px;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--accent)}
.tq-in input{width:3.2ch;border:0;background:none;color:var(--ink);font:inherit;font-size:56px;font-weight:800;line-height:1.05;text-align:center;font-variant-numeric:tabular-nums;direction:ltr;outline:none;padding:0}
.tq-in span{font-size:17px;font-weight:700;color:var(--ink-3)}
.tq-in input.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tq-ch{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;width:100%}
.tq-c{min-height:50px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);font-size:18px;font-weight:800;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--lip);direction:ltr}
.tq-c small{font-size:13px;font-weight:700;color:var(--ink-3)}
.tq-c.all{font-size:15px}
.tq-c:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--lip)}
.tq .btn{width:100%}

/* ---- today's workout before it starts, and what is missing */
.pre.gate.eqq{margin-top:4vh;gap:12px;padding:24px 18px 18px;border-radius:24px;justify-items:stretch;text-align:start;box-shadow:inset 0 0 0 1.5px var(--line),0 4px 0 var(--lip)}
.eqq h2{text-align:center}
.eq-list{list-style:none;margin:0;padding:0;display:grid}
.eq-list li{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:15.5px;font-weight:700}
.eq-list li+li{border-top:1px solid var(--line)}
.eq-list li i{width:10px;height:10px;flex:none;border-radius:4px;background:var(--tn)}
.eq-list li span{flex:1;min-width:0}
.eq-list li small{font-size:13px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.eq-list li.sw span::after{content:"";display:inline-block;width:7px;height:7px;margin-inline-start:7px;border-radius:50%;background:var(--accent);vertical-align:middle}
.eq-q{margin:4px 0 0;text-align:center;font-size:16px;font-weight:800}
.eq-ch{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.eq-c{min-height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--lip)}
.eq-c[aria-pressed="true"]{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through;box-shadow:inset 0 0 0 1.5px var(--line)}
.eq-b{display:grid;gap:8px}

/* ---- the summary: three numbers that run up, the level, the bests one by one */
.sum-st{list-style:none;margin:2px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:360px}
.sum-st li{display:grid;gap:2px;padding:12px 4px;border-radius:16px;background:rgb(255 255 255 / .1);animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) .15s both}
.sum-st li:nth-child(2){animation-delay:.25s}.sum-st li:nth-child(3){animation-delay:.35s}
.sum-st b{font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.sum-st span{font-size:13px;font-weight:600;color:rgb(255 255 255 / .7)}
.sum-st li.up{background:rgb(79 209 165 / .16)}.sum-st li.up b{color:#5BE0B0}
.sum-st li.xp b{color:var(--gold)}
.sum .sum-new li{font-size:15.5px}

/* round 3, phase 1 polish: the time card in the middle of the screen, a chip that reads as chosen, a bigger figure on the intro */
#app.pre-on #pre{min-height:calc(100dvh - 150px);display:grid;align-content:center}
.eq-c[aria-pressed="true"]{background:var(--ink);color:var(--paper);text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.eq-c[aria-pressed="true"]::before{content:"✕";margin-inline-end:6px;font-size:12px;opacity:.8}

.hw-rir{margin:2px 0 0;text-align:center;font-size:14px;font-weight:700;color:var(--ink-3)}
.gain.pr,.gain.run{animation-duration:2.7s}
/* the card of today's time stands in the middle without making the page longer than the screen */
#app.pre-on #pre{position:fixed;z-index:6;top:calc(64px + env(safe-area-inset-top,0px));bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);min-height:0;height:auto;display:flex;flex-direction:column;overflow:auto;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));background:var(--paper)}
#app.pre-on #pre>.pre{margin:auto 0;flex:none}
.sum-st span{font-size:14px}
.hw .en-name{margin:2px 0 0;text-align:start}
/* today's workout never pushes its buttons off the screen: the list of exercises scrolls inside the card */
#app.pre-on #pre>.pre.eqq{display:flex;flex-direction:column;max-height:100%}
.eqq .eq-list{flex:1 1 auto;min-height:96px;overflow:auto;overscroll-behavior:contain}
.eqq>h2,.eqq>.eq-q,.eqq>.eq-ch,.eqq>.eq-b,.eqq>#eqGo{flex:none}

/* round 3, phase 1, after the owner tried it */
/* today's time: a number between a minus and a plus, and under the button how long the whole workout takes */

.tq-st{height:52px;border:0;border-radius:16px;background:var(--surface);color:var(--ink);font-size:26px;font-weight:800;line-height:1;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--lip)}
.tq-st:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--lip)}

/* today's workout: green is easy, yellow is medium, red is hard */
.eq-list li i{border-radius:50%;background:var(--ink-3)}
.eq-list li.d1 i,.eq-key .d1 i{background:#2FB56A}
.eq-list li.d2 i,.eq-key .d2 i{background:#F2B01E}
.eq-list li.d3 i,.eq-key .d3 i{background:#E5484D}
.eq-key{display:flex;justify-content:center;gap:16px;margin:0;font-size:13px;font-weight:700;color:var(--ink-3);flex:none}
.eq-key span{display:inline-flex;align-items:center;gap:6px}
.eq-key i{width:9px;height:9px;border-radius:50%}
/* a new exercise stands on purple with a few soft white circles; the muscles are named in quiet chips */

.mus-chips span.p{background:var(--ink);color:var(--paper)}
/* and "start" leaves it at once */
/* the demo is a picture, not a button */
.stage-wrap:active{transform:none}

/* round 3, phase 1, the owner's second notes */
/* the rest clock: yellow for the last half minute, green when it says go */
.dock.ready .rt-ring .f,.dock.ready .rt-ring .h{stroke:#F5B82E}
.dock.ready .rt-ring::before{background:radial-gradient(circle,rgb(245 184 46 / .24),transparent 68%)}
.dock.ready .rt-word{color:#F5B82E}
.dock.go .rt-ring .f,.dock.go .rt-ring .h{stroke:#3DDC97}
.dock.go .rt-ring::before{background:radial-gradient(circle,rgb(61 220 151 / .28),transparent 68%)}
.dock.go .rt-word{opacity:1;color:#3DDC97}
/* a way back at the top corner of a card before the workout */
.pre.gate{position:relative}
.pre-back{position:absolute;top:10px;inset-inline-start:10px;width:44px;height:44px;border:0;border-radius:14px;background:none;color:var(--ink-3);display:grid;place-items:center}
.pre-back svg{width:22px;height:22px}
.pre-back:active{background:var(--surface-2)}
/* a new exercise: the whole screen in purple with a few soft white circles, its number large behind, the name, and one white button */

/* the points of a set rise from the button that logged it, with a ring and sparks, and fade slowly on the way up */
.gain{left:var(--gx,50%);top:var(--gy,70%);z-index:96;transform:translate(-50%,-50%);animation:gain-rise 1.95s cubic-bezier(.16,.84,.3,1) both}
.gain.pr,.gain.run{animation-duration:2.75s}
.gain b{position:relative;font-size:46px;font-weight:800;line-height:1;letter-spacing:-.02em;color:#FFC83D;background:linear-gradient(180deg,#FFF3B0 0%,#FFD24A 42%,#F59E0B 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 rgb(120 60 0 / .45)) drop-shadow(0 0 16px rgb(255 196 60 / .6))}
.gain.pr b,.gain.run b{font-size:56px}
.gain span{position:relative}
.gain-ring{position:absolute;left:50%;top:22px;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid rgb(255 208 74 / .9);animation:gain-ring .55s ease-out both;pointer-events:none}
.gain-s{position:absolute;left:50%;top:22px;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:#FFD24A;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:gain-spark .8s cubic-bezier(.15,.8,.3,1) var(--sd,0ms) both;pointer-events:none}
.gain-s.w{background:#fff;width:7px;height:7px}
@keyframes gain-rise{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}10%{opacity:1;transform:translate(-50%,calc(-50% - 30px)) scale(1.28)}20%{transform:translate(-50%,calc(-50% - 44px)) scale(1)}62%{opacity:1}100%{opacity:0;transform:translate(-50%,calc(-50% - var(--dy,220px))) scale(.9)}}
@keyframes gain-ring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}
@keyframes gain-spark{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(1.15) rotate(140deg)}}

/* ================================================================== round 3, phase 2: the opening */
/* the first screen: a real skip button in one top corner and the logo in the other, Eilon in the middle, the language under the button */
.ob-top.first{grid-template-columns:auto minmax(0,1fr) auto;align-items:start}
.ob-skip{min-height:40px;padding:0 18px;border:0;border-radius:12px;font-size:15px;font-weight:700;background:rgb(255 255 255 / .16);color:#fff;box-shadow:0 3px 0 rgb(0 0 0 / .3)}
.ob-skip:active{transform:translateY(2px);box-shadow:0 1px 0 rgb(0 0 0 / .3)}
.ob-logo{display:grid;justify-items:end;gap:1px;line-height:1}
.ob-in.film .ob-logo .logo-w{font-size:27px}
.ob-in.film .ob-logo small{font-size:10px}
.ob-film[data-beat="0"] .ob-set{transform:scale(1.18)}
.ob-film .ob-coach{inset-inline-start:auto;left:50%;width:56%;margin-left:-28%}
.ob-in.film .ob-body{grid-template-rows:minmax(0,1fr);align-content:end}
.ob-hello{align-self:end;display:grid;gap:6px;text-align:center;padding-bottom:4px;animation:ob-rise .6s cubic-bezier(.2,.8,.2,1) .25s both}
.ob-hello h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-shadow:0 2px 20px rgb(0 0 0 / .45)}
.ob-hello p{margin:0;font-size:17px;font-weight:600;color:rgb(255 255 255 / .82)}
.ob-foot{display:grid}
.ob-foot .ob-lang{width:auto;margin:12px 0 0;padding:3px;border-radius:14px;justify-self:end}
.ob-foot .ob-lang button{min-height:36px;padding:0 14px;font-size:13.5px;border-radius:11px}
/* the goals: six cards, two in a row, a name on each */
.ob-opts.g2{grid-template-columns:1fr 1fr}
.ob-opts.g2 .ob-opt{grid-template-columns:auto minmax(0,1fr);min-height:74px;padding:12px;gap:10px}
.ob-opts.g2 .ob-opt .ob-chk{position:absolute;top:8px;inset-inline-end:8px}
.ob-opts.g2 .ob-opt{position:relative}
.ob-opts.g2 .ob-opt b{font-size:16px}
.ob-opts.g2 .ob-ic{width:40px;height:40px;border-radius:12px}
.ob-opts>:nth-child(4){animation-delay:.28s}.ob-opts>:nth-child(5){animation-delay:.34s}.ob-opts>:nth-child(6){animation-delay:.4s}
/* a number in one big square between a minus and a plus */
.ob-num{display:grid;grid-template-columns:60px minmax(0,1fr) 60px;align-items:center;gap:12px;direction:ltr;max-width:360px;width:100%;justify-self:center;padding-top:2vh}
.ob-st{height:60px;border:0;border-radius:18px;background:var(--surface);color:var(--ink);font-size:30px;font-weight:800;line-height:1;box-shadow:inset 0 0 0 1.5px var(--line),0 4px 0 var(--lip)}
.ob-st:active{transform:translateY(3px);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--lip)}
.ob-nbox{display:grid;justify-items:center;gap:2px;padding:18px 10px 14px;border-radius:24px;background:var(--surface);box-shadow:inset 0 0 0 2.5px var(--accent),0 0 0 6px var(--accent-soft)}
.ob-nbox input{width:2.4ch;border:0;background:none;color:var(--ink);font:inherit;font-size:84px;font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums;outline:none;padding:0}
.ob-nbox span{font-size:16px;font-weight:700;color:var(--ink-3)}
.ob-body.in .ob-num,.ob-body.in .ob-chips,.ob-body.in .ob-plan2{animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) .12s both}
/* the quick questions: chips to tap */
.ob-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding-top:1vh}
.ob-chip{min-height:52px;padding:0 20px;border:0;border-radius:16px;background:var(--surface);color:var(--ink);font-size:17px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--lip)}
.ob-chip:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--lip)}
.ob-chip[aria-checked="true"]{background:var(--ink);color:var(--paper);box-shadow:0 3px 0 rgb(0 0 0 / .3)}
/* the character: the figure large on one side, the choices beside it */

/* the plan: one light card, a row for each workout with its real time */
.ob-plan2{display:grid;gap:12px;padding:14px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),0 4px 0 var(--lip)}
.ob-plan2.reveal{animation:plan-in .7s cubic-bezier(.2,.9,.3,1.15) both}

.ob-wks2{list-style:none;margin:0;padding:0;display:grid}
.ob-wks2 li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 2px}
.ob-wks2 li+li{border-top:1px solid var(--line)}
.ob-wks2 i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--ink);color:var(--paper);font-style:normal;font-size:15px;font-weight:800}
.ob-wks2 span{display:grid;min-width:0;gap:1px}
.ob-wks2 span b{font-size:16.5px;font-weight:800}
.ob-wks2 span small{font-size:13px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-wks2 em{display:grid;justify-items:end;font-style:normal;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.ob-wks2 em b{display:inline;font-size:19px;font-weight:800;color:var(--ink)}
.ob-wks2 em small{font-size:12px;font-weight:600;color:var(--ink-3)}
.ob-plan2 .ob-wk-tip{margin:0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-3)}
.ob-plan2 .ob-wk-tip svg{width:16px;height:16px;flex:none}
.ob-in.film .ob-top .ob-skip{background:rgb(255 255 255 / .16);color:#fff;border:0}

.ob-wks2 em span{white-space:nowrap}
.ob-wks2 em span{display:block}
.ob-opts.g2 .ob-opt .ob-chk{display:none}
.ob-opts.g2 .ob-opt b{overflow-wrap:anywhere}

@media (max-height:640px){.ob-film .ob-coach{width:42%;margin-left:-21%}.ob-hello h1{font-size:28px}}

.ob-opts.g2 .ob-opt b{overflow-wrap:normal}
@media (max-width:360px){.ob-opts.g2 .ob-opt{padding:10px 8px;gap:8px}.ob-opts.g2 .ob-ic{width:34px;height:34px}.ob-opts.g2 .ob-opt b{font-size:14.5px}}
@media (max-height:640px){.ob-film .ob-coach{bottom:24%}}

/* ================================================================== round 3, phase 4: the tour with Eilon
   the dark layer itself takes no touch: what is lit is the real control under it, and a guard lets a touch reach only that */
.tour{pointer-events:none;z-index:99}
.tour-card{pointer-events:auto}
.tour-hole{box-shadow:0 0 0 200vmax rgb(8 6 18 / .86)}
.tour.wait .tour-hole{outline-color:transparent}
.tour-say p{font-size:17px;font-weight:700;line-height:1.35;margin:0}
.tour-foot .btn[hidden]{display:none}
.tour-foot{min-height:26px}
/* during the tour there is no way back from a step: the tour itself leads */
body.touring .pre-back,body.touring .xi-back{display:none}
.tour-dots{gap:3px;min-width:0;flex:1 1 auto;overflow:hidden}
.tour-dots i{width:4px;height:4px;flex:none}
.tour-dots i.on{width:14px}
.tour-foot .btn{margin-inline-start:8px}

/* ================================================================== round 3, phase 5 (first part) */
/* a rank's medal, wherever it stands */
.medal{display:block;width:28px;height:34px;flex:none}
.pf-rank{display:flex;align-items:center;justify-content:center;gap:8px}
.pf-rank .medal{width:26px;height:31px}
/* the profile: three numbers, no tons */
.pf-nums{grid-template-columns:repeat(3,minmax(0,1fr))}
/* achievements: each a card; one that is still ahead shows how far along it is */
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;list-style:none;margin:0;padding:0}

/* recent workouts: light grey cards, one for each, with the day, what was done and the new bests */
.rows.hist{display:grid;gap:8px;background:none;border-radius:0;overflow:visible}
.rows.hist li.tap{border:0;border-radius:16px;background:var(--surface-2)}
.rows.hist li+li{border-top:0}
.rows.hist .row-b{grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;min-height:66px;padding:11px 14px}
.rows.hist .h-t{font-size:16px;font-weight:800}
.rows.hist .h-d{grid-column:2;grid-row:1;font-size:13px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.rows.hist .h-s{grid-column:1 / 3;display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;font-weight:700}
.rows.hist .h-s span{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:9px;background:var(--surface);color:var(--ink-2)}
.rows.hist .h-s .pr{background:#FFE7A6;color:#5A3A00}
.rows.hist .h-s .pr svg{grid-column:auto;grid-row:auto;width:12px;height:12px;color:#B5820E;fill:currentColor}
.rows.hist .row-b>svg{grid-column:3;grid-row:1 / 3}
/* the journey: where the lifter stands among the ranks, then the prizes on the way, and at the foot the goal, small */
.jr-top{display:grid;gap:10px;padding:16px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),0 4px 0 var(--lip)}

.jr-top h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}

.jr-ranks{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.jr-ranks li{display:grid;justify-items:center;gap:2px;padding:8px 0 6px;border-radius:12px;text-align:center;opacity:.38;filter:grayscale(1)}
.jr-ranks li.done{opacity:1;filter:none}
.jr-ranks li.cur{opacity:1;filter:none;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.jr-ranks .medal{width:24px;height:29px}
.jr-ranks b{font-size:11.5px;font-weight:800;line-height:1.1}
.jr-ranks small{font-size:10px;font-weight:700;color:var(--ink-3)}
.stop .dot.rk{background:var(--surface);box-shadow:0 6px 0 var(--lip),inset 0 0 0 2px var(--line)}
.stop .dot.rk .medal{width:44px;height:53px}
.stop.later .dot.rk .medal{filter:grayscale(1);opacity:.55}

/* a new rank, on the whole screen */
.rank-up{position:fixed;inset:0;z-index:97;display:grid;place-items:center;padding:24px;background:radial-gradient(90% 70% at 50% 42%,#3B2477 0%,#150D2E 60%,#07050D 100%);color:#fff;animation:tour-fade .25s ease-out}
.rank-up.out{opacity:0;transition:opacity .2s}
.ru-in{position:relative;display:grid;justify-items:center;gap:8px;text-align:center}
.ru-rays{position:absolute;top:-70px;width:330px;height:330px;border-radius:50%;background:repeating-conic-gradient(rgb(255 215 106 / .16) 0 12deg,transparent 12deg 24deg);animation:ru-spin 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.ru-medal{position:relative;animation:ru-pop .7s cubic-bezier(.2,1.5,.4,1) both}
.ru-medal .medal{width:150px;height:180px;filter:drop-shadow(0 12px 22px rgb(0 0 0 / .5))}
.ru-k{position:relative;margin:14px 0 0;font-size:16px;font-weight:800;color:#FFD76A}
.ru-in h2{position:relative;margin:0;font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.ru-in .btn{position:relative;min-width:200px;margin-top:18px;border:0;background:#fff;color:#2A1866;box-shadow:0 5px 0 rgb(0 0 0 / .3)}
@keyframes ru-spin{to{transform:rotate(360deg)}}
@keyframes ru-pop{0%{transform:scale(.2) rotate(-18deg);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ru-rays,.ru-medal{animation:none}}
/* the chat opens on four ready questions, as chips two by two */
.sugs.chips{grid-template-columns:1fr 1fr;gap:8px}
.sugs.chips .sug{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;min-height:58px;padding:8px 10px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--lip);font-size:14px;font-weight:700;line-height:1.25;text-align:start}
.sugs.chips .sug:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--lip)}
.sugs.chips .sug-i{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--surface-2);color:var(--ink-2)}
.sugs.chips .sug-i svg{width:18px;height:18px}
.msg{font-size:15px;line-height:1.45}

/* the journey's own bar stands on a light card */

/* ================================================================== round 3, phase 5 (second part): the collection */
/* how rare a thing is: a small tag in the colour of its rarity */
.rr{display:inline-flex;align-items:center;justify-self:center;min-height:22px;padding:0 9px;border-radius:99px;background:color-mix(in srgb,var(--rc) 16%,var(--surface));color:color-mix(in srgb,var(--rc) 78%,var(--ink));font-size:12px;font-weight:800;white-space:nowrap}
.bx{display:block;width:100%;height:auto;overflow:visible}
/* the kiosk's card in the profile */
.ks-prog{display:block;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.ks-prog i{display:block;height:100%;border-radius:inherit;background:var(--ks)}
.ks-wait{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:60px;padding:6px 12px;border:0;border-radius:16px;background:linear-gradient(135deg,#FFF6DA,#FFE7A3);color:#5C3A00;font:inherit;text-align:start;box-shadow:inset 0 0 0 1.5px #F2C14E,0 4px 0 #D9A21E;animation:ch-call 2.4s ease-in-out 1s infinite}
.ks-wait:active{transform:translateY(3px);box-shadow:inset 0 0 0 1.5px #F2C14E,0 1px 0 #D9A21E}
.ks-wait b{font-size:16.5px;font-weight:800}
.ks-wait>svg:last-child{width:20px;height:20px;stroke-width:2.6}
.ks-peek li{padding:6px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc,transparent) 55%,transparent)}
.ks-peek li.bxp{padding:10px 18px}
/* the kiosk: sections one under the other */
.ks-sec{display:grid;gap:10px}
.ks-sec h3{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.ks-sec h3 small{font-size:13px;font-weight:700;color:var(--ink-3)}
.ks-boxes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ks-bx{position:relative;display:grid;justify-items:center;gap:4px;width:100%;padding:8px 6px 10px;border:0;border-radius:16px;background:var(--surface);color:var(--ink);font:inherit;text-align:center;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--lip)}
.ks-bx:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--lip)}
.ks-bx .bx{width:62px}
.ks-bx b{font-size:14.5px;font-weight:800;line-height:1.2}
.ks-bx small{font-size:12px;font-weight:700;color:var(--ink-3)}
.ks-bx.far .ks-pr{background:var(--surface-3);color:var(--ink-2)}
.ks-bx.far .ks-pr .coin{filter:grayscale(1);opacity:.8}
.ks-bx.full{opacity:.6;box-shadow:inset 0 0 0 1.5px var(--line)}
.ks-bx.full .bx{filter:grayscale(1)}
.ks-boxes.wait .ks-bx{background:linear-gradient(160deg,#FFF6DA,#FFE7A3);color:#5C3A00;box-shadow:inset 0 0 0 1.5px #F2C14E,0 3px 0 #D9A21E}
.ks-boxes.wait .ks-bx .bx{animation:bx-hop 1.6s ease-in-out infinite}
.ks-boxes.wait .ks-st{background:#5C3A00;color:#FFE7A3}
.ks-n{position:absolute;top:6px;inset-inline-end:8px;display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--ks);color:#fff;font-size:13px;font-weight:800}
@keyframes bx-hop{0%,100%{transform:none}12%{transform:translateY(-5px) rotate(-4deg)}24%{transform:none}36%{transform:translateY(-3px) rotate(3deg)}48%{transform:none}}
.ks-week{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--lip)}
.ks-week>div{display:grid;gap:5px;justify-items:start;min-width:0}
.ks-week b{font-size:16px;font-weight:800;line-height:1.2}
.ks-week p{margin:0;font-size:13.5px;font-weight:600;line-height:1.3;color:var(--ink-3)}
.ks-week .ks-pic{background:var(--ks-soft)}
.ks-week .btn{min-height:44px;padding:0 14px;border:0;border-radius:14px;background:var(--ks);color:#fff;font-size:16px;font-weight:800;direction:ltr;gap:5px;box-shadow:0 4px 0 color-mix(in srgb,var(--ks) 70%,#000)}
.ks-week .btn .coin{width:17px;height:17px}
.ks-week .btn.far{background:var(--surface-3);color:var(--ink-2);box-shadow:0 4px 0 var(--lip)}
.ks-week .btn.far .coin{filter:grayscale(1);opacity:.8}
