<div class="app" id="app" dir="rtl" lang="he" data-view="home">
  <header class="wrap brand">
    <button class="back" id="backBtn" type="button" aria-label="חזרה למסך הראשי"><svg class="i dir" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="logo" role="img" aria-label="gymi by Lior Dahan">
      <span class="logo-w" aria-hidden="true">gym<span class="logo-i">i</span></span>
      <small aria-hidden="true">by Lior Dahan</small>
    </div>
    <div class="wk-title" id="wkTitle"></div>
    <span class="sync" id="syncNote"></span>
    <button class="top-list" id="listBtn" type="button" aria-label="כל התרגילים"><svg class="i" viewBox="0 0 24 24"><path d="M8.5 7h11M8.5 12h11M8.5 17h11"/><path d="M4.5 7h.01M4.5 12h.01M4.5 17h.01" stroke-width="2.6"/></svg></button>
    <nav class="tabbar" id="tabbar" aria-label="ניווט ראשי">
      <button type="button" data-view="home" aria-current="page"><span class="tb-ic" aria-hidden="true"><svg viewBox="0 0 28 28"><rect x="1.5" y="10.5" width="3.6" height="7" rx="1.5" fill="#1C43BF"/><rect x="5.6" y="7" width="4.6" height="14" rx="1.9" fill="#2152E0"/><rect x="10.2" y="12.2" width="7.6" height="3.6" rx="1.2" fill="#8FA9F5"/><rect x="17.8" y="7" width="4.6" height="14" rx="1.9" fill="#2152E0"/><rect x="22.9" y="10.5" width="3.6" height="7" rx="1.5" fill="#1C43BF"/></svg></span><span class="tb-l">היום</span></button>
      <button type="button" data-view="profile"><span class="tb-ic tb-face" id="tbMe" aria-hidden="true"></span><span class="tb-l">פרופיל</span></button>
      <button type="button" data-view="progress"><span class="tb-ic" aria-hidden="true"><svg viewBox="0 0 28 28"><rect x="3.5" y="15" width="5.6" height="9.5" rx="2" fill="#8FA9F5"/><rect x="11.2" y="9.5" width="5.6" height="15" rx="2" fill="#2152E0"/><rect x="18.9" y="3.5" width="5.6" height="21" rx="2" fill="#F2B02E"/></svg></span><span class="tb-l">התקדמות</span></button>
      <button type="button" id="chatOpen"><span class="tb-ic tb-face" id="tbCoach" aria-hidden="true"></span><span class="tb-l">אילון</span></button>
    </nav>
  </header>

  <div class="wrap cols">
    <main class="main">
      <div class="view v-home" id="home"></div>

      <div class="view v-workout">
        <div class="wk-bar" id="wkBar"></div>
        <section class="hero" id="hero"></section>
        <section id="pre" aria-label="התאוששות מהאימון הקודם" hidden></section>
        <ol class="fx" id="exList"></ol>
      </div>

      <div class="view v-profile" id="profile"></div>

      <div class="view v-progress">
        <div class="page-h"><p class="cap" id="progCap"></p><h1 class="big">התקדמות</h1></div>
        <section class="gains" id="gains"></section>
        <section class="history" id="history"></section>
      </div>

    </main>

    <aside class="chat" id="chat" aria-label="צ׳אט עם אילון">
      <div class="chat-h">
        <span class="ava" aria-hidden="true"></span>
        <div><h2>אילון</h2><p>המאמן שלך</p></div>
        <button class="icon-btn" id="chatKey" type="button" aria-label="החיבור של אילון" title="החיבור של אילון" hidden><svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2.5 2.5M19 4l1.5 1.5"/></svg></button>
        <button class="icon-btn" id="chatNew" type="button" aria-label="שיחה חדשה" title="שיחה חדשה" hidden><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 2.6 5.9"/><path d="M4 18v-5h5"/></svg></button>
        <button class="icon-btn chat-close" id="chatClose" type="button" aria-label="סגור את הצ׳אט"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <label class="chat-ctx" for="chatCtx"><span>על</span><select id="chatCtx"></select><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></label>
        <div class="attach" id="attach" hidden><img id="attachImg" alt="התמונה שצורפה"><span>תישלח עם ההודעה</span><button type="button" id="attachX" aria-label="הסר את התמונה"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <p class="comp-note" id="compNote" hidden></p>
        <div class="comp-row">
          <button class="icon-btn" id="camBtn" type="button" aria-label="צלם את המכשיר" title="צלם את המכשיר" hidden><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg></button>
          <button class="icon-btn" id="galBtn" type="button" aria-label="בחר תמונה מהגלריה" title="בחר תמונה מהגלריה" hidden><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.4"/><path d="M5 17l5-5 4 4 2-2 3 3"/></svg></button>
          <textarea id="chatInput" rows="1" maxlength="500" placeholder="שאל את אילון" enterkeyhint="send" aria-label="הודעה לאילון"></textarea>
          <button class="icon-btn send" id="sendBtn" type="button" aria-label="שלח"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </div>
        <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
        <input type="file" id="galFile" accept="image/*" hidden>
      </div>
    </aside>
  </div>

  <div class="dock" id="dock" role="region" aria-label="רישום סטים וטיימר מנוחה"></div>
  <div class="sheet" id="sheet" hidden></div>
  <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="sr" id="srSay" aria-live="polite"></div>
  <div class="ob" id="ob" role="dialog" aria-modal="true" aria-labelledby="obTitle" hidden></div>
  <div class="splash" id="splash" hidden><div class="splash-in" role="img" aria-label="gymi by Lior Dahan"><span class="logo-w" aria-hidden="true">gym<span class="logo-i">i</span></span><small aria-hidden="true">by Lior Dahan</small></div></div>
</div>
