.ks-shield{grid-template-columns:44px minmax(0,1fr) auto}
.shd{display:block;width:44px;height:48px}
/* the collection: a thing that is owned wears the colour of its rarity; one that is not is a question mark in that colour */
.ks-it{position:relative}
.ks-it.own{border-color:color-mix(in srgb,var(--rc) 55%,var(--line))}
.ks-it.own .ks-pic{background:color-mix(in srgb,var(--rc) 13%,var(--surface))}
.ks-it .rr{min-height:20px;font-size:11.5px}
.ks-it.q{display:grid;justify-items:center;gap:6px;padding:8px 6px 10px;border:1.5px dashed color-mix(in srgb,var(--rc) 50%,var(--line));border-radius:14px;background:var(--surface-2);box-shadow:none}
.ks-it.q .ks-pic{display:grid;place-items:center;width:100%;border-radius:12px;background:color-mix(in srgb,var(--rc) 10%,var(--surface));color:color-mix(in srgb,var(--rc) 70%,var(--ink-3));font-size:34px;font-weight:800;line-height:1}
.ks-none{margin:0;padding:18px 12px;border-radius:14px;background:var(--surface-2);font-size:14.5px;font-weight:600;text-align:center;color:var(--ink-3)}

/* the box of the summary */
#sumBox:empty{display:none}
.sum-chest{grid-template-columns:72px minmax(0,1fr)}
.sum-chest .bx{width:72px}
/* a box is opened, on the whole screen: the box waits, shakes, and gives way to the thing in the colour of its rarity */
.box-up{position:fixed;inset:0;z-index:98;display:grid;place-items:center;padding:24px;background:radial-gradient(90% 70% at 50% 42%,#2A2140 0%,#120E22 60%,#07050D 100%);color:#fff;animation:tour-fade .2s ease-out;overflow:hidden}
.box-up.open{background:radial-gradient(90% 70% at 50% 40%,color-mix(in srgb,var(--rc) 46%,#1B1530) 0%,#120E22 62%,#07050D 100%)}
.box-up.out{opacity:0;transition:opacity .2s}
.box-up .confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bu-in{position:relative;display:grid;justify-items:center;gap:10px;width:min(100%,340px);text-align:center}
.bu-rays{position:absolute;top:-60px;left:50%;width:360px;height:360px;margin-left:-180px;border-radius:50%;opacity:0;background:repeating-conic-gradient(color-mix(in srgb,var(--rc) 55%,transparent) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 28%,transparent 70%);mask:radial-gradient(circle,#000 28%,transparent 70%);pointer-events:none}
.box-up.open .bu-rays{opacity:1;animation:ru-spin 16s linear infinite;transition:opacity .4s}
.bu-box{position:relative;width:190px;padding:0;border:0;background:none;animation:bx-hop 1.5s ease-in-out infinite;cursor:pointer}
.bu-box .bx{filter:drop-shadow(0 14px 22px rgb(0 0 0 / .5))}
.box-up.shake .bu-box{animation:bu-shake .9s cubic-bezier(.36,.07,.19,.97) both}
.bu-hint{position:relative;margin:6px 0 0;font-size:17px;font-weight:800;color:rgb(255 255 255 / .82);animation:glow-pulse 1.4s ease-in-out infinite}
.box-up.shake .bu-hint{visibility:hidden}
.bu-got{position:relative;display:grid;justify-items:center;gap:10px;width:100%}
.bu-pic{display:block;width:176px;aspect-ratio:1;border-radius:32px;overflow:hidden;background:#fff;box-shadow:0 0 0 5px var(--rc),0 0 46px 6px color-mix(in srgb,var(--rc) 70%,transparent);animation:ru-pop .6s cubic-bezier(.2,1.5,.4,1) both}
.bu-pic .av{display:block;width:100%;height:100%}
.bu-got .rr{min-height:30px;padding:0 16px;background:var(--rc);color:#fff;font-size:15px;animation:ob-rise .4s .25s both}
.bu-got h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;animation:ob-rise .4s .32s both}
.bu-act{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:10px;animation:ob-rise .4s .45s both}
.bu-act .btn{min-width:0;border:0;background:#fff;color:#1B1530;box-shadow:0 5px 0 rgb(0 0 0 / .35)}
.bu-act .btn.ghost{background:rgb(255 255 255 / .14);color:#fff;box-shadow:inset 0 0 0 1.5px rgb(255 255 255 / .3),0 5px 0 rgb(0 0 0 / .3)}
@keyframes bu-shake{0%{transform:none}10%{transform:rotate(-7deg) scale(1.03)}22%{transform:rotate(7deg) scale(1.05)}34%{transform:rotate(-9deg) scale(1.07)}46%{transform:rotate(9deg) scale(1.09)}58%{transform:rotate(-11deg) scale(1.12)}70%{transform:rotate(11deg) scale(1.15)}82%{transform:rotate(-6deg) scale(1.2)}100%{transform:scale(1.5);opacity:0}}
/* things of the collection that glow or flicker */
.av-pulse{animation:glow-pulse 1.8s ease-in-out infinite}
@keyframes glow-pulse{50%{opacity:.7}}
.av-flick{transform-box:fill-box;transform-origin:50% 0;animation:av-flick .28s ease-in-out infinite alternate}
@keyframes av-flick{from{transform:scaleY(.8)}to{transform:scaleY(1.12)}}
.av.still .av-pulse,.av.still .av-flick{animation:none}
@media (prefers-reduced-motion:reduce){.bu-box,.box-up.shake .bu-box,.bu-hint,.bu-rays,.ks-wait,.ks-boxes.wait .ks-bx .bx,.av-pulse,.av-flick{animation:none!important}}

/* what is still to be found: small question marks, each in the colour of its rarity */

.ks-qs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.ks-q{display:grid;place-items:center;aspect-ratio:1;border:1.5px dashed color-mix(in srgb,var(--rc) 55%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--rc) 11%,var(--surface));color:color-mix(in srgb,var(--rc) 75%,var(--ink-3));font-size:20px;font-weight:800;line-height:1}

/* ================================================================== the body log */
.scale{display:block;width:100%;height:auto}
.body-card{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;padding:12px 16px 12px 14px;border:0;color:var(--ink);font:inherit;text-align:start;box-shadow:inset 0 0 0 1.5px var(--line),0 4px 0 var(--lip)}
.body-card:active{transform:translateY(3px);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--lip)}
.body-card .bd-t{display:grid;gap:3px;min-width:0}
.body-card b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.body-card small{font-size:14px;font-weight:600;color:var(--ink-3)}
.body-card>svg:last-child{width:20px;height:20px;stroke-width:2.6;color:var(--ink-3)}
.sheet-in.bd{gap:14px}
.bd-top{display:grid;grid-template-columns:108px minmax(0,1fr);align-items:center;gap:14px}

.bd-kg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px}
.bd-kg .tq-in input{width:100%;min-width:0}
.bd-f{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:14px;background:var(--surface-2);font-size:15px;font-weight:700;color:var(--ink-2)}
.bd-f input{min-width:0;width:100%;min-height:44px;border:0;background:none;color:var(--ink);font:inherit;font-size:17px;font-weight:800;text-align:end}
.bd-f small{font-size:13px;font-weight:700;color:var(--ink-3)}
.bd-more{display:grid;gap:8px}
.bd-more-b{justify-self:start;min-height:40px;font-size:15px;font-weight:800}
.bd-act{display:grid;gap:8px}
.bd-hist{display:grid;gap:10px}
.bd-hist h3{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 0;font-size:18px;font-weight:800}
.bd-hist h3 small{font-size:13px;font-weight:700;color:var(--ink-3)}
.bd-chart{display:block;width:100%;height:84px;border-radius:14px;background:var(--surface-2)}
.bd-area{fill:color-mix(in srgb,var(--ink) 9%,transparent)}
.bd-line{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.bd-dot{fill:var(--ink)}
.bd-trend{margin:0;font-size:15px;font-weight:800;color:var(--ink-2)}

/* the opening: height and weight side by side */
.ob-hw{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px;margin-inline:auto}
.ob-hw .ob-nbox{width:auto}
.ob-hw .ob-nbox input{width:100%;min-width:0}
.ob-may{margin:14px 0 0;font-size:14.5px;font-weight:600;text-align:center;color:var(--ink-3)}
/* the tour speaks in colour: each step its own, on Eilon's words, on the light round what he shows, and on his button */
.tour-say{background:var(--tc,#6D3FE0);color:#fff;transition:background-color .35s}
.tour-hole{outline-color:color-mix(in srgb,var(--tc,#fff) 45%,#fff);transition-property:left,top,width,height,outline-color}
.tour-dots i{background:rgb(255 255 255 / .36)}
.tour-dots i.on{background:#fff}
.tour-dots i{width:6px;height:6px}
.tour-dots i.on{width:18px}
.tour-foot .btn,.tour-foot .btn.primary{background:#fff;color:var(--tc,#6D3FE0);box-shadow:0 3px 0 rgb(0 0 0 / .22)}

/* numbers of three digits and a point need a smaller hand than the days of the week */
.ob-hw .ob-nbox{padding:16px 8px 12px}
.ob-hw .ob-nbox input{font-size:50px;direction:ltr}
.ob-hw .ob-nbox input::placeholder{color:var(--ink-3);opacity:.45}
.ob-body.in .ob-hw,.ob-body.in .ob-may{animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) .12s both}
.bd-kg{direction:ltr}
.bd-kg .tq-in{direction:rtl;padding:8px 10px;gap:6px}
[dir="ltr"] .bd-kg .tq-in{direction:ltr}
.bd-kg .tq-in input{font-size:38px}
.bd-kg .tq-in span{font-size:14px}
.bd-kg .tq-st{width:44px;min-width:44px}

/* the weight of the day: the number over its unit, so that four figures and a point have room */
.bd-top{grid-template-columns:88px minmax(0,1fr)}
.bd-kg .tq-in{flex-direction:column;align-items:center;gap:0;padding:6px 8px 8px}
.bd-kg .tq-in input{width:100%;font-size:36px;line-height:1.1}

/* the body log on a narrow phone */
@media (max-width:359px){.bd-top{grid-template-columns:62px minmax(0,1fr);gap:10px}.bd-kg .tq-in input{font-size:28px}.bd-kg .tq-st{width:40px;min-width:40px}}

/* ---- round 4: the demo is one size on a given screen. It no longer shrinks when the page has more on it (a long name, a note), which
   made it change size from one exercise to the next; on a short screen it is lower for every exercise alike, and the camera fits the
   picture to the card (rig.js) ---- */
.stage{object-fit:fill}
#exList .stage{max-height:max(150px,calc(100vh - 546px));max-height:max(150px,calc(100dvh - 546px - env(safe-area-inset-bottom,0px)))}
@media (min-height:760px){.fx-t{min-height:86px;display:grid;align-content:center}}
/* the two buttons on the demo sit in its top corners, where a scene is empty: at the bottom they covered the feet and the floor */
.st-btn{top:8px;bottom:auto;min-height:34px;padding:0 10px}
.st-btn span{font-size:13px}

/* ---- round 4: the kiosk. Its name in red, a box for each rarity in the colour of that rarity, what is sold for a limited time,
   and the collection: everything there is (a question mark until it is found), or only what is owned ---- */
.ks-title{margin:0;font-size:36px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--ks)}
.sheet-in.ks .ks-h{align-items:center}
.sheet-in.ks .ks-h .ks-title{flex:1}
.ks-card-h{align-items:center}
.card.kiosk .ks-title{font-size:30px}
.ks-boxes:not(.wait) .ks-bx{gap:6px;padding:10px 6px 12px;background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 30%,var(--surface)),color-mix(in srgb,var(--rc) 10%,var(--surface)));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--rc) 50%,var(--line)),0 4px 0 color-mix(in srgb,var(--rc) 60%,var(--lip))}
.ks-boxes:not(.wait) .ks-bx:active{transform:translateY(3px);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--rc) 50%,var(--line)),0 1px 0 color-mix(in srgb,var(--rc) 60%,var(--lip))}
.ks-boxes:not(.wait) .ks-bx b{font-size:15px;color:color-mix(in srgb,var(--rc) 58%,var(--ink))}
.ks-boxes:not(.wait) .ks-bx .ks-pr{background:var(--rc);color:#fff}
.ks-pr.far{background:var(--surface-3)!important;color:var(--ink-2)!important}
.ks-pr.far .coin{filter:grayscale(1);opacity:.8}
.ks-week .btn{padding:0 6px;background:none;box-shadow:none}
.ks-week .btn .ks-pr{min-height:40px;padding:0 14px;font-size:16px;box-shadow:0 4px 0 color-mix(in srgb,var(--ks) 70%,#000)}
.ks-week .btn .ks-pr.far{box-shadow:0 4px 0 var(--lip)}
.ks-week .btn:active .ks-pr{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ks) 70%,#000)}
.ks-week+.ks-week{margin-top:10px}
.ks-week b,.ks-it b,.ks-bx b{overflow-wrap:anywhere;text-wrap:balance}
.ks-sec h3 small{font-weight:800}
.ks-rar{display:grid;gap:8px;margin-top:14px}
.ks-rar h4{margin:0;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;color:color-mix(in srgb,var(--rc) 68%,var(--ink))}
.ks-rar h4 i{width:10px;height:10px;border-radius:50%;background:var(--rc)}
.ks-rar h4 small{margin-inline-start:auto;font-size:12.5px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ks-q.got{padding:0;border-style:solid;background:color-mix(in srgb,var(--rc) 16%,var(--surface));overflow:hidden}
.ks-q.got button{display:block;width:100%;height:100%;padding:0;border:0;background:none}
.ks-q.got .ks-pic{display:block;width:100%}
.ks-q.got.on{border-color:var(--rc);box-shadow:inset 0 0 0 2px var(--rc)}
.ks-chance{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ks-chance li{display:grid;grid-template-columns:82px minmax(0,1fr);align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--rc) 10%,var(--surface));font-size:12.5px;font-weight:700}
.ks-chance b{font-size:14px;font-weight:800;color:color-mix(in srgb,var(--rc) 68%,var(--ink))}
.ks-chance li>span{display:flex;flex-wrap:wrap;gap:3px 10px}
.ks-chance i{font-style:normal;color:color-mix(in srgb,var(--rc) 72%,var(--ink))}
.ks-chance i span{color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---- round 4: the weigh-ins. A big button for today, then the days as a schedule: a tap on a day opens it ---- */
.body-card{grid-template-columns:56px minmax(0,1fr) auto}
.body-card b{font-size:22px}
.bd-now{display:grid;grid-template-columns:70px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;padding:12px 16px 12px 14px;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);font:inherit;text-align:start;box-shadow:0 5px 0 var(--accent-lip)}
.bd-now:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-lip)}
.bd-now>span{display:grid;gap:3px;min-width:0}
.bd-now b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.bd-now small{font-size:14px;font-weight:600;opacity:.86}
.bd-now .scale{width:70px}
.bd-now>svg:last-child{width:22px;height:22px;stroke-width:2.6}
.bd-days{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bd-day{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:66px;padding:10px 16px;border:0;border-radius:16px;background:var(--surface);color:var(--ink);font:inherit;text-align:start;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--lip)}
.bd-day:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--lip)}
.bd-day .bd-d{display:grid;gap:2px;min-width:0}
.bd-day .bd-d b{font-size:17.5px;font-weight:800}
.bd-day .bd-d small{font-size:13.5px;font-weight:600;color:var(--ink-3)}
.bd-day .bd-v{display:inline-flex;align-items:baseline;gap:5px}
.bd-day .bd-v b{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bd-day .bd-v small{font-size:13px;font-weight:700;color:var(--ink-3)}
.bd-day .bd-add{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--surface-2);color:var(--ink-3);font-size:25px;font-weight:700;line-height:1}
.bd-day.has{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 30%,var(--line)),0 3px 0 color-mix(in srgb,var(--accent) 28%,var(--lip))}
.bd-day.today:not(.has){box-shadow:inset 0 0 0 2px var(--accent),0 3px 0 var(--lip)}
.bd-old{margin:8px 0 0;font-size:14.5px;font-weight:800;color:var(--ink-3)}
.sheet-in.bd .ed-h{align-items:center}
.sheet-in.bd .ed-h h2{flex:1;margin:0}
.bd-top{grid-template-columns:96px minmax(0,1fr)}
.bd-more-b{justify-self:center}

/* ---- round 4: the journey. Its name, the rank in large with its medal, the six ranks, and then the road: it climbs through the sky
   from edge to edge and down to the end of the screen. The level of a station stands at the edge of the screen ---- */
.jr-top{justify-items:center;text-align:center;gap:6px;padding:4px 0 0;background:none;box-shadow:none;border-radius:0}
.jr-title{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;color:var(--ink-3)}
.jr-top .jr-now{display:grid;justify-items:center;gap:0}
.jr-now .medal{width:96px;height:115px;filter:drop-shadow(0 8px 12px rgb(0 0 0 / .2))}
.jr-now b{font-size:52px;font-weight:900;letter-spacing:-.03em;line-height:1.05}
.jr-top .jr-ranks{width:100%;margin-top:10px}
.sky{position:relative;display:grid;gap:0;overflow:hidden;border-radius:26px;color:#fff;background:linear-gradient(180deg,#58B4F7 0%,#8CCEFB 10%,#FFC9B0 24%,#FF8FB8 36%,#9566EE 50%,#4530A3 66%,#1B1357 82%,#0B0828 100%)}
.sky-h{position:relative;z-index:2;margin:0;padding:22px 16px 0;font-size:26px;font-weight:900;letter-spacing:-.02em;text-align:center;text-shadow:0 2px 0 rgb(0 0 0 / .14)}
.sky-road{position:relative}
.sky-road ol{list-style:none;margin:0;padding:0}
.sky-stars{position:absolute;inset:46% 0 0 0;background-image:radial-gradient(circle at 12% 8%,#fff 0 1.2px,transparent 1.6px),radial-gradient(circle at 78% 22%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 42% 46%,#fff 0 1.4px,transparent 1.8px),radial-gradient(circle at 88% 64%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 24% 82%,#fff 0 1.2px,transparent 1.6px),radial-gradient(circle at 60% 92%,#FFE27A 0 1.4px,transparent 1.8px);background-size:210px 260px;opacity:.8;-webkit-mask-image:linear-gradient(180deg,transparent,#000 22%);mask-image:linear-gradient(180deg,transparent,#000 22%)}
.cloud{position:absolute;width:132px;height:40px;border-radius:40px;background:#fff;opacity:.6}
.cloud::before,.cloud::after{content:"";position:absolute;bottom:14px;border-radius:50%;background:#fff}
.cloud::before{left:20px;width:52px;height:46px}
.cloud::after{right:22px;width:44px;height:36px}
.cloud.c1{transform:scale(.72);opacity:.45}
.cloud.c2{transform:scale(1.25);opacity:.34}
li.st{position:absolute;left:0;right:0;height:0}
.st-n{position:absolute;top:14px;display:grid;place-items:center;min-width:44px;height:32px;padding:0 8px;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:#fff;text-shadow:0 1px 2px rgb(0 0 0 / .28);opacity:.92}
li.st.r .st-n{right:6px}
li.st.l .st-n{left:6px}
li.st.done .st-n{color:#FFE27A}
li.st.top .st-n{right:6px}
/* the lifter leans in from the far edge, at the station that comes next */
.peek{position:absolute;top:-8px;display:flex;align-items:center;gap:6px;pointer-events:none}
li.st.r .peek{left:-16px;flex-direction:row}
li.st.l .peek{right:-16px;flex-direction:row-reverse}
.peek-fig{display:block;width:74px;height:74px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 3px #fff,0 6px 14px rgb(0 0 0 / .25)}
li.st.r .peek-fig{transform:rotate(16deg);animation:peek-l .7s cubic-bezier(.3,1.4,.5,1) .3s both}
li.st.l .peek-fig{transform:rotate(-16deg);animation:peek-r .7s cubic-bezier(.3,1.4,.5,1) .3s both}
.peek-fig svg{display:block;width:100%;height:100%}
.peek-say{padding:7px 11px;border-radius:13px;background:#fff;color:#2A1F66;font-size:13.5px;font-weight:800;white-space:nowrap;box-shadow:0 4px 0 rgb(0 0 0 / .16);animation:pop-in .3s ease-out .8s both}
@keyframes peek-l{from{transform:translateX(-90px) rotate(0)}to{transform:translateX(0) rotate(16deg)}}
@keyframes peek-r{from{transform:translateX(90px) rotate(0)}to{transform:translateX(0) rotate(-16deg)}}
@keyframes pop-in{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
/* on a phone the sky has no frame: it runs from one edge of the screen to the other, and down under the tab bar */
@media (max-width:699px){
  .sky{margin:8px -20px calc(-1 * (var(--tabbar) + 44px + env(safe-area-inset-bottom,0px)));padding-bottom:calc(var(--tabbar) + 30px + env(safe-area-inset-bottom,0px));border-radius:30px 30px 0 0}
}
/* the words of the road are read on every colour of the sky: dark plates under the white letters */
.peek{direction:ltr}
.peek-say{direction:rtl}
[dir="ltr"] .peek-say{direction:ltr}

/* ---- round 4: before and during a workout ---- */
/* less time today: a time is tapped, or "no rush" */
.tq-ch{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px;width:100%}
.tq-c{display:grid;justify-items:center;gap:0;min-height:76px;padding:10px 6px;border:0;border-radius:18px;background:var(--surface);color:var(--ink);font:inherit;box-shadow:inset 0 0 0 1.5px var(--line),0 4px 0 var(--lip)}
.tq-c:active{transform:translateY(3px);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--lip)}
.tq-c b{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.tq-c span{font-size:13.5px;font-weight:700;color:var(--ink-3)}
/* the points of a logged set: a gold pill that pops in under the top of the screen, a few sparks, and it is gone */
.pts{position:fixed;z-index:96;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);display:grid;justify-items:center;gap:8px;pointer-events:none;transform:translateX(-50%);animation:pts-in 1.6s cubic-bezier(.2,.9,.3,1) both}
.pts.pr{animation-duration:2.3s}
.pts-pill{position:relative;display:inline-flex;align-items:center;gap:6px;padding:9px 20px 9px 14px;border-radius:99px;background:linear-gradient(180deg,#FFE27A,#FFBF2E);color:#4A2C00;direction:ltr;box-shadow:0 5px 0 #C98A12,0 16px 30px -10px rgb(0 0 0 / .5)}
.pts-pill b{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.pts-pill .i{width:26px;height:26px;fill:#4A2C00;stroke:none}
.pts.pr .pts-pill b{font-size:38px}
.pts-pill>i{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;background:#FFD23F;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:pts-spark .7s ease-out var(--sd,0ms) both}
.pts-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;background:#fff;color:#4A27B8;font-size:15px;font-weight:900;box-shadow:0 3px 0 rgb(0 0 0 / .2)}
.pts-tag .i{width:17px;height:17px;fill:currentColor;stroke:none}
@keyframes pts-in{0%{opacity:0;transform:translate(-50%,22px) scale(.5) rotate(-7deg)}13%{opacity:1;transform:translate(-50%,0) scale(1.16) rotate(2deg)}22%{transform:translate(-50%,0) scale(1) rotate(0)}76%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-30px) scale(.94)}}
@keyframes pts-spark{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(1.1) rotate(120deg)}}
/* the weight and the reps: steps that look like buttons */
.dk-nums .step,.dk-nums .rstep{font-weight:900}
.st-btn[aria-disabled="true"]{opacity:.45}

/* ---- round 4: the details of an exercise, tidy: a small row of what it asks, how it is done, and two quiet actions ---- */
.sheet-in.hw{gap:12px}
.sheet-in.hw .ed-h h2{font-size:25px;line-height:1.12}
.sheet-in.hw .mus-chips{justify-content:flex-start;margin:0}
.hw-facts{gap:0;padding:4px 0;border-radius:16px;background:var(--surface-2)}
.hw-facts li{padding:8px 4px;border-radius:0;background:none;color:var(--ink)}
.hw-facts li+li{border-inline-start:1.5px solid var(--line)}
.hw-facts b{font-size:21px;font-weight:900;direction:ltr}
.hw-facts span{font-size:12.5px;font-weight:700;color:var(--ink-3);opacity:1}
.sheet-in.hw .hw-rir{margin:0;font-size:14px;font-weight:700;color:var(--ink-3);text-align:start}
.sheet-in.hw .hw-h{margin:4px 0 0;font-size:17px}
.sheet-in.hw .note span{font-size:13.5px}
.sheet-in.hw .note-in{min-height:46px}
.hw-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.hw-acts .btn{min-height:48px;font-size:15.5px}

/* ---- round 4: the end of a workout. Rays turn behind the lifter, the points land in large gold, and what was won comes in one
   after another ---- */
.sheet-in.sum.fin{overflow-x:hidden;gap:8px}
.fin-rays{position:absolute!important;z-index:0!important;left:50%;top:26%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgb(255 255 255 / .1) 0 8deg,transparent 8deg 20deg);-webkit-mask-image:radial-gradient(closest-side,#000 24%,transparent 74%);mask-image:radial-gradient(closest-side,#000 24%,transparent 74%);animation:fin-spin 22s linear infinite;pointer-events:none}
.fin-h{margin:2px 0 0;font-size:clamp(34px,10vw,44px);font-weight:900;letter-spacing:-.03em;line-height:1.05;color:#fff;text-wrap:balance;animation:fin-pop .6s cubic-bezier(.3,1.5,.5,1) .05s both}
.fin-xp{margin:0;display:grid;justify-items:center;gap:0;animation:fin-pop .6s cubic-bezier(.3,1.5,.5,1) .4s both}
.fin-xp b{font-size:clamp(54px,17vw,72px);font-weight:900;letter-spacing:-.035em;line-height:1;background:linear-gradient(180deg,#FFF6C2 0%,#FFD24A 46%,#F59E0B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 rgb(0 0 0 / .28));font-variant-numeric:tabular-nums}
.fin-xp span{font-size:16px;font-weight:800;color:rgb(255 255 255 / .86)}
.sum.fin .sum-st{margin-top:6px}
.sum.fin .sum-st li{animation:fin-pop .5s cubic-bezier(.3,1.5,.5,1) .85s both}
.sum.fin .sum-st li:nth-child(2){animation-delay:.97s}.sum.fin .sum-st li:nth-child(3){animation-delay:1.09s}
.sum.fin .sum-st{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.sum.fin .sum-new li{animation:fin-pop .5s cubic-bezier(.3,1.5,.5,1) 1.25s both}
.sum.fin .sum-new li:nth-child(2){animation-delay:1.4s}.sum.fin .sum-new li:nth-child(3){animation-delay:1.55s}
.sum.fin .sum-new li.gold{background:linear-gradient(180deg,#FFE27A,#FFBF2E);box-shadow:0 4px 0 #C98A12}
.sum.fin #sumBox{animation:fin-pop .5s cubic-bezier(.3,1.5,.5,1) 1.6s both}
.sheet-in.sum.fin .btn.primary{box-shadow:0 5px 0 rgb(0 0 0 / .28)}
.sheet-in.sum.fin .btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 rgb(0 0 0 / .28)}
@keyframes fin-pop{0%{opacity:0;transform:scale(.6) translateY(14px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fin-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fin-rays,.fin-h,.fin-xp,.sum.fin .sum-st li,.sum.fin .sum-new li,.sum.fin #sumBox{animation:none!important}}
@media (max-height:700px){.fin-h{font-size:30px}.fin-xp b{font-size:50px}.sum.fin .sum-av{width:min(130px,34vw)}}

/* ---- round 4: the week on the Workouts screen. Its name and the way to the plan on one line; under it one bar, a part for each
   workout, with how many are done at its end ---- */
.week-h{justify-content:space-between}
.wk-meter{display:flex;align-items:center;gap:12px;margin:0;padding-inline:4px}
.wk-segs{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px}
.wk-meter i,.wk-segs i{display:block;width:auto;height:8px;border-radius:99px;background:var(--surface-3)}
.wk-segs i.done{background:var(--gold)}
.wk-segs i.live,.wk-segs i.next{background:var(--accent)}
.wk-meter b{flex:none;font-size:14.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sum.fin .sum-av{width:min(150px,38vw)}

/* ---- round 4: the opening ---- */
/* the first screen: Eilon walks in from the side and stands higher; his words are under him, never on him */
.ob-film .ob-set{margin-top:-24vh}
.ob-film[data-beat="0"] .ob-set{transform:scale(1.04)}
.ob.play .ob-film .ob-coach{animation:coach-in 1s cubic-bezier(.25,.8,.3,1) both}
@keyframes coach-in{0%{opacity:0;transform:translate(86vw,0)}12%{opacity:1}25%{transform:translate(62vw,-9px)}38%{transform:translate(44vw,0)}52%{transform:translate(27vw,-9px)}66%{transform:translate(13vw,0)}80%{transform:translate(4vw,-6px)}100%{opacity:1;transform:translate(0,0)}}
[dir="ltr"] .ob.play .ob-film .ob-coach{animation-name:coach-in-l}
@keyframes coach-in-l{0%{opacity:0;transform:translate(-86vw,0)}12%{opacity:1}25%{transform:translate(-62vw,-9px)}38%{transform:translate(-44vw,0)}52%{transform:translate(-27vw,-9px)}66%{transform:translate(-13vw,0)}80%{transform:translate(-4vw,-6px)}100%{opacity:1;transform:translate(0,0)}}
.ob-hello{animation-delay:.85s;padding-bottom:10px}
.ob-hello h1{font-size:38px;font-weight:900;letter-spacing:-.03em}
.ob-in.film .ob-top .ob-skip,.ob-skip{display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:0 10px 0 14px;border:0;border-radius:99px;background:rgb(255 255 255 / .12);color:rgb(255 255 255 / .9);font:inherit;font-size:15px;font-weight:800;box-shadow:none}
.ob-skip:active{transform:scale(.96);box-shadow:none;background:rgb(255 255 255 / .2)}
.ob-skip svg{width:18px;height:18px;stroke-width:2.6}
@media (prefers-reduced-motion:reduce){.ob.play .ob-film .ob-coach{animation:none}}
/* the experience: the character stands at the foot of the screen */
.ob-in[data-k="exp"] .ob-body{grid-template-rows:auto auto minmax(110px,1fr)}
.ob-pre{align-self:end;max-height:300px}
/* the goals: each drawing white on its own colour */
.ob-opt .ob-ic.gi{color:#fff;background:var(--gc)}
.ob-ic.g0{--gc:#2B78F0}.ob-ic.g1{--gc:#6D3FE0}.ob-ic.g2{--gc:#F2A30F}.ob-ic.g3{--gc:#FF6B2C}.ob-ic.g4{--gc:#E5484D}.ob-ic.g5{--gc:#0FA89A}
.ob-opt .ob-ic.gi svg{width:25px;height:25px;fill:#fff;stroke:none}
.ob-opt[aria-checked="true"] .ob-ic.gi{background:var(--gc);color:#fff}
.ob-opts.g2 .ob-ic.gi{width:44px;height:44px;border-radius:14px;box-shadow:0 3px 0 color-mix(in srgb,var(--gc) 62%,#000)}
/* height and weight: a way past */
button.ob-may{display:block;margin:10px auto 0;min-height:44px;padding:0 22px;font-size:16px;font-weight:800;color:var(--ink-2)}
/* an area, a sore spot: "all" stands on top, alone, and under it as many as wanted */
.ob-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ob-chips .ob-chip{min-width:0;padding:0 8px;font-size:16.5px}
.ob-chip.all{grid-column:1 / -1;min-height:58px;font-size:18px;font-weight:800}
.ob-chip.all[aria-checked="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-lip)}
/* the avatar: the figure on top, on a soft stage; under it what can be changed, one row of tabs and a grid */
.ob-in[data-k="look"] .ob-body{grid-template-rows:auto minmax(0,1fr);gap:12px}
.ob-av{display:grid;grid-template-rows:minmax(130px,1fr) auto;gap:10px;min-height:0}
.ob-body.in .ob-av{animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) .12s both}
.ob-av-fig{position:relative;display:grid;place-items:center;min-height:0;padding:8px 0 0;border-radius:22px;overflow:hidden;background:radial-gradient(80% 70% at 50% 46%,var(--accent-soft),var(--surface) 80%);box-shadow:inset 0 0 0 1.5px var(--line)}
.ob-av-fig .lk-stage{display:grid;place-items:end center;width:auto;height:100%;min-height:0;max-height:330px}
.ob-av-fig .lk-stage .av{display:block;width:auto;height:100%;max-width:100%;overflow:visible}
.ob-av-fig .lk-stage .av-aura{display:none}
.ob-av-fig .lk-photo-box{position:absolute;top:10px;inset-inline-end:10px;justify-items:end}
.ob-av-fig .lk-photo{min-height:38px;padding:0 12px;border-radius:12px;background:#fff;color:#5A2FCC;font-size:13.5px;font-weight:800}
.ob-av-fig .lk-note{max-width:130px;text-align:end;font-size:12px}
.ob-av-ed{gap:10px;padding:10px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.ob-av-ed .lk-tabs{flex-wrap:wrap}
.ob-av-ed .lk-tabs button{flex:1 0 auto;min-height:40px;padding:0 11px;font-size:14px;font-weight:700}
.ob-av-ed .lk-pane{min-height:0;height:172px;overflow-y:auto;align-content:start;padding:2px}
.ob-av-ed .lk-cuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ob-av-ed .lk-cuts.two{grid-template-columns:1fr 1fr;height:100%}
.ob-av-ed .lk-cuts.two .lk-cut{height:164px}
.ob-av-ed .lk-cuts.two .lk-face{height:128px;width:auto}
.ob-av-ed .lk-cuts.two .lk-face svg{height:100%;width:auto}
.ob-av-ed .lk-cuts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.ob-av-ed .lk-cut{min-width:0;overflow:hidden}
.ob-av-ed .lk-face{display:block;width:100%;max-width:74px}
.ob-av-ed .lk-face svg{display:block;width:100%;height:auto}
.ob-av-ed .lk-cut small{font-size:12px}
.ob-av-ed .lk-opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 10px;justify-items:center;padding:8px 4px}
.ob-av-ed .lk-opts .lk-sw{max-width:58px}
.ob-av-ed .lk-tees{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ob-av-ed .lk-tee{height:76px;min-width:0}
.ob-av-ed .lk-tee svg{width:46px;height:46px}
@media (max-height:700px){.ob-av-ed .lk-pane{height:132px}.ob-av-ed .lk-cuts.two .lk-cut{height:124px}.ob-av-ed .lk-cuts.two .lk-face{height:92px}.ob-av-ed .lk-tee{height:60px}}
/* the plan that was built: three numbers, then each workout on a row of its own */
.pl-stats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pl-stats li{display:grid;justify-items:center;gap:2px;padding:12px 4px 10px;border-radius:16px;background:var(--accent-soft);text-align:center}
.pl-stats b{font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.pl-stats span{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.2}
.ob-plan2{gap:10px;padding:12px}
.ob-wks2{gap:8px}
.ob-wks2 li{padding:10px 12px;border-radius:16px;background:var(--surface-2)}
.ob-wks2 li+li{border-top:0}
.ob-wks2 i{width:40px;height:40px;border-radius:13px;background:linear-gradient(160deg,#8A5CFF,#5A2FCC);color:#fff;font-size:18px;font-weight:900;box-shadow:0 3px 0 #40209F}
.ob-wks2 span b{font-size:17.5px}
.ob-wks2 em b{font-size:21px;font-weight:900}
.ob-plan2.reveal .ob-wks2 li{animation:ob-rise .45s cubic-bezier(.2,.8,.2,1) calc(.25s + var(--i,0) * .08s) both}
.ob-pre{max-height:236px}
button.ob-may{min-height:48px;padding:0 30px;border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--lip)}
button.ob-may:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--lip)}
.ob-av-ed .lk-tabs button{flex:1 1 auto;padding:0 5px;font-size:13px}
.sheet-in.sum.fin{align-content:safe center}
@media (max-height:700px){.sheet-in.sum.fin{gap:6px;padding-top:calc(14px + env(safe-area-inset-top,0px))}.sum.fin .sum-av{width:min(104px,28vw)}.fin-h{font-size:27px}.fin-xp b{font-size:44px}.sum.fin .sum-st li{padding:8px 4px}.sum.fin .sum-st b{font-size:24px}}

/* ---- round 4: the last workouts, in the profile. Each on a card of its own: a gold tick, its name and its day, and under them
   what was done, in plain words ---- */
.rows.hist li.tap{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--lip)}
.rows.hist li.tap:active{transform:translateY(2px);box-shadow:inset 0 0 0 1.5px var(--line),0 1px 0 var(--lip)}
.rows.hist .row-b{grid-template-columns:auto minmax(0,1fr) auto auto;gap:2px 12px;min-height:70px;padding:12px 14px}
.rows.hist .h-ok{grid-column:1;grid-row:1 / 3;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 var(--gold-lip)}
.rows.hist .h-ok svg{grid-column:auto;grid-row:auto;width:20px;height:20px;stroke-width:3.2;color:inherit}
.rows.hist .h-t{grid-column:2;grid-row:1;font-size:17.5px}
.rows.hist .h-d{grid-column:3;grid-row:1;font-size:13.5px}
.rows.hist .h-s{grid-column:2 / 4;grid-row:2;gap:4px 8px;align-items:center;font-size:13.5px}
.rows.hist .h-s span{padding:0;border-radius:0;background:none;color:var(--ink-3);font-weight:700}
.rows.hist .h-s span+span:not(.pr)::before{content:"·";margin-inline-end:8px;color:var(--ink-4)}
.rows.hist .h-s .pr{padding:2px 9px;border-radius:99px;background:#FFE7A6;color:#5A3A00}
.rows.hist .row-b>svg{grid-column:4;grid-row:1 / 3}
.history .sec{font-size:20px;font-weight:800;color:var(--ink)}
/* short and narrow phones: the character under the experience gives way before the answers do, and the six tabs of the avatar all stay in sight */
.ob-in[data-k="exp"] .ob-body{grid-template-rows:auto auto minmax(0,1fr)}
@media (max-height:700px){.ob-pre{max-height:150px}}
@media (max-width:359px){.ob-av-ed .lk-tabs button{padding:0 3px;font-size:11.5px}.ob-av-ed{padding:8px 6px}}
@media (max-height:700px){.ob-pre{display:none}}

/* ==================================================================== round 5: drawn, not iconic */
/* ---- a new exercise: the exercise itself fills the top of the screen, moving, on a soft lilac backdrop with round lower corners;
   under it which one it is of how many, its name, the muscles, what it asks, and Start ---- */
:root{--xo-bg:#EEE9FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--xo-bg:#1C1734}}
:root[data-theme="dark"]{--xo-bg:#1C1734}
.xi{position:fixed;inset:0;z-index:70;opacity:0;transition:opacity .22s ease}
.xi.on{opacity:1}
.xi.out{opacity:0;transition:opacity .1s linear}
.xi.xo{display:block;padding:0;background:var(--paper);color:var(--ink);text-align:center;cursor:default;overflow:hidden}
.xo-in{display:grid;grid-template-rows:auto minmax(0,1fr);width:100%;max-width:560px;height:100%;margin:0 auto}
.xo-hero{position:relative;height:min(58vh,122vw,560px);min-height:240px;overflow:hidden;border-radius:0 0 34px 34px;background:var(--xo-bg)}
.xo-cv{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));left:0;display:block;width:100%;height:calc(100% - 58px - env(safe-area-inset-top,0px))}
.xo-k{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:50%;margin:0;padding:7px 16px;border-radius:99px;background:var(--surface);color:var(--ink);font-size:14.5px;font-weight:800;white-space:nowrap;box-shadow:0 6px 16px -8px rgb(40 20 110 / .45);transform:translateX(-50%);animation:xo-k .35s ease both}
.xo-body{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;min-height:0;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.xo-info{display:grid;justify-items:center;align-content:center;gap:12px}
.xo-t{margin:0;font-size:clamp(26px,7.6vw,34px);font-weight:900;line-height:1.1;letter-spacing:-.02em;text-wrap:balance;animation:xi-up .35s ease .05s both}
.xi.xo .mus-chips{animation:xi-up .35s ease .1s both}
.xo-rx{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;animation:xi-up .35s ease .15s both}
.xo-rx li{display:grid;gap:5px;padding:2px 4px}
.xo-rx li+li{border-inline-start:1.5px solid var(--line)}
.xo-rx b{font-size:28px;font-weight:900;letter-spacing:-.02em;line-height:1;direction:ltr;font-variant-numeric:tabular-nums}
.xo-rx span{font-size:13.5px;font-weight:700;color:var(--ink-3)}
.xi.xo #xiGo{width:100%;animation:xi-up .35s ease .2s both}
.xi-back{position:absolute;z-index:2;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-start:12px;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 6px 16px -8px rgb(40 20 110 / .45)}
.xi-back svg{width:22px;height:22px}
@keyframes xo-k{from{opacity:0;transform:translate(-50%,-8px)}}
@media (max-height:700px){.xo-hero{height:min(48vh,100vw)}.xo-body{gap:10px;padding-top:14px}.xo-info{gap:9px}.xo-rx b{font-size:24px}.xo-t{font-size:clamp(24px,7vw,30px)}}
@media (prefers-reduced-motion:reduce){.xo-k,.xo-t,.xi.xo .mus-chips,.xo-rx,.xi.xo #xiGo{animation:none}}

/* ---- the exercise screen: the drawing stands alone; "details", the muscles and "swap" make one row under it ---- */
.ex-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.ex-row .mus-chips{flex:1;min-width:0;flex-wrap:wrap;justify-content:center;gap:4px}
.ex-row .mus-chips span{padding:3px 8px;font-size:12.5px;white-space:nowrap}
.ex-row .st-btn{position:relative;inset:auto;top:auto;bottom:auto;flex:none;min-height:38px;padding:0 12px}
@media (max-width:359px){.ex-row .mus-chips span:nth-child(n+3){display:none}}

/* ---- a level reached: a gold note, like the points of a set ---- */
.toast.lvl{padding:11px 24px;background:linear-gradient(180deg,#FFE27A,#FFBF2E);color:#4A2C00;font-size:22px;font-weight:900;box-shadow:0 5px 0 #C98A12,0 16px 30px -10px rgb(0 0 0 / .5)}
.toast.lvl svg{color:#4A2C00;fill:#4A2C00;width:24px;height:24px}

/* ---- the finish: a long number fits its tile ---- */
.sum.fin .sum-st b{font-size:clamp(22px,7vw,30px);white-space:nowrap}

/* ---- the journey. The road is a road: wide and pale, a dashed line down its middle, gold where it was walked. Each station is
   the thing itself, drawn (the medal of a rank, the gear, the box) on a small cloud; a tick when it is reached ---- */
.sky .sky-way .rd{fill:none;stroke:rgb(255 255 255 / .3);stroke-width:22;stroke-linecap:round;stroke-dasharray:none;vector-effect:non-scaling-stroke}
.sky .sky-way .rd.on{stroke:#FFD23F}
.sky .sky-way .rd-c{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:8 12;opacity:.75;vector-effect:non-scaling-stroke}
.sky .sky-way .rd-c.on{stroke:#FFF8DC;opacity:1}
li.st .lv{position:absolute;left:var(--x);top:0;transform:translateX(-50%);display:grid;justify-items:center;gap:4px;width:140px;padding:0;border:0;background:none;color:#fff;font:inherit;text-align:center}
li.st .dot{position:relative;display:grid;place-items:center;width:80px;height:68px}
li.st .dot::before{content:"";position:absolute;left:6px;right:6px;bottom:-3px;height:20px;border-radius:50%;background:rgb(255 255 255 / .6);box-shadow:0 0 0 6px rgb(255 255 255 / .16)}
li.st .dot>svg{position:relative;width:64px;height:64px;overflow:visible;filter:drop-shadow(0 4px 0 rgb(20 10 60 / .18));transition:transform .12s}
li.st .dot>.medal{width:54px;height:65px}
li.st .dot>.bx{width:66px;height:66px}
li.st .lv:active .dot>svg{transform:scale(.93)}
li.st.rk .dot>.medal{width:60px;height:72px;margin-top:-8px}
li.st.next .dot::before{background:rgb(255 255 255 / .75);box-shadow:0 0 0 6px rgb(255 226 122 / .35),0 0 18px 6px rgb(255 226 122 / .45)}
li.st.next .dot>svg{animation:st-float 2.4s ease-in-out infinite}
@keyframes st-float{50%{transform:translateY(-6px)}}
li.st .ok{position:absolute;top:-2px;inset-inline-end:0;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#22B07D;color:#fff;box-shadow:0 0 0 2.5px #fff,0 3px 6px rgb(0 0 0 / .2)}
li.st .ok svg{width:14px;height:14px;stroke-width:3.4}
li.st .lv b{padding:4px 11px;border-radius:99px;background:rgb(24 14 70 / .5);font-size:13.5px;font-weight:800;line-height:1.2;text-wrap:balance}
li.st.done .lv b{background:rgb(24 14 70 / .64)}
.st-n{top:24px;min-width:40px;height:30px;padding:0 9px;border-radius:99px;background:rgb(255 255 255 / .2);color:#fff;font-size:17px;font-weight:900;text-shadow:none;box-shadow:inset 0 0 0 1.5px rgb(255 255 255 / .45);opacity:1}
li.st.done .st-n{background:#FFD23F;color:#5A3A00;box-shadow:none}
@media (prefers-reduced-motion:reduce){li.st.next .dot>svg,.peek-fig,.peek-say,.sky-pic{animation:none!important}}
/* the name of each part of the sky on a ribbon, its ends folded back */
.sky-sign{position:absolute;left:50%;z-index:1;transform:translateX(-50%);text-align:center;filter:drop-shadow(0 5px 0 rgb(20 10 60 / .18))}
.sky-sign::before,.sky-sign::after{content:"";position:absolute;z-index:-1;top:13px;bottom:-9px;width:42px;background:#CFC2FF}
.sky-sign::before{right:-28px;clip-path:polygon(0 0,100% 0,74% 50%,100% 100%,0 100%)}
.sky-sign::after{left:-28px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,26% 50%)}
.sky-sign .sg{position:relative;display:grid;justify-items:center;gap:1px;padding:9px 22px 11px;border-radius:12px;background:#fff;color:#2A1F66}
.sky-sign small{font-size:12.5px;font-weight:800;color:#6A5FA8}
.sky-sign b{font-size:20px;font-weight:900;letter-spacing:-.01em;white-space:nowrap}
/* a sight of the sky beside each ribbon */
.sky-pic{position:absolute;z-index:0;width:62px;height:62px;pointer-events:none;animation:sky-bob 6s ease-in-out infinite}
.sky-pic.l{left:2.5%}
.sky-pic.r{right:2.5%}
.sky-pic svg{display:block;width:100%;height:100%;overflow:visible}
@keyframes sky-bob{50%{transform:translateY(-6px)}}
@media (max-width:359px){.sky-pic{width:46px;height:46px}}
/* a station opened: what waits there, drawn in large */
.lvs-t{display:grid;justify-items:center;gap:8px;padding:12px 16px 14px;border-radius:18px;background:var(--surface-2)}
.lvs-art{display:flex;align-items:flex-end;justify-content:center;gap:10px}
.lvs-art svg{width:76px;height:76px;overflow:visible}
.lvs-art .medal{width:62px;height:74px}
.lvs-t b{font-size:18px;font-weight:800;line-height:1.3}
.pts{top:calc(env(safe-area-inset-top,0px) + 84px)}
@media (max-width:359px){.jr-ranks b{font-size:10px;letter-spacing:-.02em}}
/* the question of time is Eilon's: his face over it, not a clock */
.pre-ic.coach{width:84px;height:84px;padding:0;border-radius:50%;overflow:hidden;background:var(--xo-bg);box-shadow:0 0 0 4px var(--surface),0 8px 18px -10px rgb(40 20 110 / .5)}
.pre-ic.coach svg{display:block;width:100%;height:100%;stroke-width:1}
/* the tabs of the look wrap rather than hide one past the edge (English is longer) */
.lk-tabs{flex-wrap:wrap}
/* a narrow phone: the line under a workout's name wraps instead of losing its minutes, and the finish keeps its three numbers inside the screen */
@media (max-width:359px){.wr-txt>span{white-space:normal}.sum.fin .sum-st{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.sum.fin .sum-st li{padding:10px 2px}.sum.fin .sum-st span{font-size:12px}}
/* a blur under a bar is worked out again at every frame of whatever passes beneath it (the moving drawing, a scroll of the sets): on a phone that was the lag of the workout screen. The bars are nearly solid anyway */
.tabbar,.dock,.ex-row .st-btn{-webkit-backdrop-filter:none;backdrop-filter:none}
.dock{background:color-mix(in srgb,var(--surface) 98%,transparent)}
/* the screen of a new exercise covers the workout at once (no two screens seen through each other), and on Start it is lifted away like a curtain */
.xi.xo,.xi.xo.on,.xi.xo.out{opacity:1;transition:none}
.xi.xo.out{transform:translateY(-100%);transition:transform .28s cubic-bezier(.5,0,.8,.4);pointer-events:none}
@media (prefers-reduced-motion:reduce){.xi.xo.out{transition:none}}
/* ================= round 6: the look of a game (the owner's references): chunky shapes, thick dark outlines, glossy colour */
:root{--ol:#1B1035}
/* ---- the points of a set: a gold sun bursts, the number pops on it in thick outlined letters, then all of it flies up ---- */
.pts{gap:0}
@keyframes pg-pop{0%{opacity:0;transform:scale(.2) rotate(-20deg)}100%{opacity:1}}
/* ---- a box is opened: it drops onto a checkered floor, shakes, its lid flies off, light shoots up and the card flies out of it,
   then the collection counts up by one ---- */
.box-up{background:radial-gradient(80% 55% at 50% 45%,rgb(120 80 255 / .45),transparent 70%),repeating-conic-gradient(from 45deg,#2A1A66 0 25%,#22145A 0 50%) 50% 0/64px 64px,#22145A}
.box-up.open{background:radial-gradient(80% 55% at 50% 45%,color-mix(in srgb,var(--rc) 55%,transparent),transparent 72%),repeating-conic-gradient(from 45deg,#2A1A66 0 25%,#22145A 0 50%) 50% 0/64px 64px,#22145A}
.bu-box{width:210px;animation:bu-drop .7s cubic-bezier(.3,1.4,.5,1) both,bx-hop 1.5s ease-in-out .9s infinite}
.bu-box .bx{filter:drop-shadow(0 16px 0 rgb(0 0 0 / .28))}
@keyframes bu-drop{0%{opacity:0;transform:translateY(-110vh) scale(.8)}62%{opacity:1;transform:translateY(0) scale(1.1,.86)}80%{transform:translateY(-14px) scale(.96,1.06)}100%{transform:none}}
.bu-hint{color:#fff;font-size:19px;font-weight:900;-webkit-text-stroke:2px #1B1035;paint-order:stroke fill;text-shadow:0 3px 0 #1B1035}
.bu-chest{display:none}
.box-up.open .bu-chest{position:relative;display:block;width:150px;margin-top:-6px;animation:bu-chest .5s cubic-bezier(.3,1.4,.5,1) both}
.box-up.open .bu-chest .bx-lid{transform-box:fill-box;transform-origin:50% 100%;animation:bu-lid .7s cubic-bezier(.2,.8,.3,1) both}
.box-up.open .bu-chest::before{content:"";position:absolute;left:50%;bottom:40%;width:120px;height:70vh;margin-left:-60px;background:linear-gradient(to top,color-mix(in srgb,var(--rc) 70%,#fff) 0%,color-mix(in srgb,var(--rc) 40%,transparent) 40%,transparent 100%);clip-path:polygon(28% 100%,72% 100%,100% 0,0 0);opacity:.7;animation:bu-beam .8s ease-out both;pointer-events:none}
@keyframes bu-chest{from{transform:scale(1.35)}}
@keyframes bu-lid{0%{transform:none}100%{transform:translate(-18px,-60px) rotate(-38deg);opacity:0}}
@keyframes bu-beam{from{opacity:0;transform:scaleY(.2);transform-origin:bottom}}
.bu-got{order:-1;gap:12px;z-index:1}
.bu-card{position:relative;display:grid;justify-items:center;gap:8px;width:230px;padding:14px 14px 16px;border-radius:22px;background:var(--rc);box-shadow:0 0 0 4px #1B1035,0 8px 0 0 #1B1035,0 0 60px 10px color-mix(in srgb,var(--rc) 70%,transparent);animation:bu-fly .75s cubic-bezier(.2,.9,.3,1.25) both}
.bu-card::after{content:"+1";position:absolute;top:-14px;inset-inline-end:-14px;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:#FF3B5C;color:#fff;font-size:22px;font-weight:900;box-shadow:0 0 0 3px #1B1035,0 4px 0 0 #1B1035;transform:rotate(8deg);animation:pg-pop .4s cubic-bezier(.2,.9,.3,1.6) .7s both}
@keyframes bu-fly{0%{opacity:0;transform:translateY(46vh) scale(.15) rotate(-14deg)}55%{opacity:1;transform:translateY(-18px) scale(1.08) rotate(4deg)}100%{transform:none}}
.bu-pic{width:190px;border-radius:16px;box-shadow:0 0 0 3px #1B1035;animation:none}
.bu-got .rr{background:#1B1035;color:#fff;animation:none}
.bu-got h2{color:#fff;font-weight:900;-webkit-text-stroke:2.5px #1B1035;paint-order:stroke fill;text-shadow:0 3px 0 #1B1035;animation:none}
.bu-col{position:relative;display:grid;gap:6px;width:230px;padding-top:20px;animation:ob-rise .4s .8s both}
.bu-col::before{content:attr(data-a) "  " attr(data-n) attr(data-of);position:absolute;top:0;left:0;right:0;text-align:center;font-size:15px;font-weight:900;color:#fff}
.bu-col.up::before{animation:pg-pop .4s cubic-bezier(.2,.9,.3,1.8)}
.bu-col i{display:block;height:14px;border-radius:8px;background:linear-gradient(90deg,#FFD23F calc(var(--f) * 100%),#140B3A 0);box-shadow:0 0 0 3px #1B1035;transition:background 0s}
.bu-act .btn{font-weight:900;box-shadow:0 0 0 3px #1B1035,0 5px 0 0 #1B1035}
.bu-act #buWear{background:linear-gradient(#FFDD55,#FFC21F);color:#1B1035}
.bu-act{animation-delay:.9s}
@media (prefers-reduced-motion:reduce){.bu-card,.bu-card::after,.box-up.open .bu-chest,.box-up.open .bu-chest .bx-lid,.box-up.open .bu-chest::before,.bu-col{animation:none!important}}
/* the badges of the ranks are square */
.medal,.pf-rank .medal,.jr-ranks .medal,.stop .dot.rk .medal,.ru-medal .medal,.jr-now .medal,li.st .dot>.medal,li.st.rk .dot>.medal,.lvs-art .medal{height:auto!important;aspect-ratio:1}
.ru-medal .medal{width:190px}.jr-now .medal{width:120px}.jr-ranks .medal{width:30px}.pf-rank .medal{width:32px}li.st .dot>.medal{width:62px}li.st.rk .dot>.medal{width:70px}.lvs-art .medal{width:72px}
.bu-card::after{direction:ltr}
/* ---- the kiosk as a game shop: a bold blue room, chunky outlined cards, a dark price bar under each, tags set at a slant ---- */
.sheet-in.ks{--ol:#1B1035;background:radial-gradient(120% 60% at 50% 0%,#3D8BFF 0%,#1F5FE0 45%,#1747B8 100%);color:#fff}
.sheet-in.ks > .ks-awn{display:none}
.sheet-in.ks .ks-h{padding-top:14px}
.ks-title{color:#fff;font-size:38px;-webkit-text-stroke:3px var(--ol);paint-order:stroke fill;text-shadow:0 4px 0 var(--ol);transform:rotate(-2deg)}
.sheet-in.ks .icon-btn{background:#fff;color:var(--ol);box-shadow:0 0 0 3px var(--ol),0 4px 0 0 var(--ol)}
.sheet-in.ks .coin-tag{background:#0E2A6B;color:#fff;font-weight:900;box-shadow:0 0 0 3px var(--ol)}
.ks-sec{padding:12px;border-radius:20px;background:rgb(10 30 90 / .28);box-shadow:inset 0 0 0 2px rgb(255 255 255 / .12)}
.ks-sec h3{color:#fff;font-size:21px;font-weight:900;-webkit-text-stroke:2px var(--ol);paint-order:stroke fill;text-shadow:0 3px 0 var(--ol);margin:0 0 4px}
.ks-sec h3 small{padding:4px 10px;border-radius:8px;background:var(--ol);color:#fff;font-size:12.5px;font-weight:800;-webkit-text-stroke:0;text-shadow:none;transform:rotate(-3deg)}
.ks-bx{gap:6px;padding:0 0 0;overflow:hidden;border-radius:16px;background:linear-gradient(#7FC2FF,#3E8DF5);color:#fff;box-shadow:0 0 0 3px var(--ol),0 5px 0 0 var(--ol)}
.ks-bx:active{transform:scale(.96);box-shadow:0 0 0 3px var(--ol),0 5px 0 0 var(--ol)}
.ks-bx b{order:-1;width:100%;padding:6px 4px 2px;font-size:14px;font-weight:900;-webkit-text-stroke:2px var(--ol);paint-order:stroke fill;text-shadow:0 2px 0 var(--ol)}

const E = (id, a, name, sets, reps, rest, int, lvl, suf) => ({ id, a, name, sets, reps, rest, int, lvl, suf: suf || '' });
const PLAN = [

    E('ua8', 'cableCrunch', 'Cable Crunch', 3, '10–15', [60, 60], 'חזרות קשות ומבוקרות', 0),
  ] },

   alike and the lifter is about the same size in each. The lifter is never cut; the top of a tall machine may be.

/* the two machines of the hips, seen from above: the knees open against the pads, or close against them */
function hipMachine(g, t, C, glow, out) {
  const c = [180, 176], open = out ? lerp(10, 34, t) : lerp(34, 10, t);
  box(g, c[0], c[1] + 58, 30, 50, 0, C.eq, 6); for (let i = 0; i < 5; i++) box(g, c[0], c[1] + 42 + i * 7.4, 20, 5.4, 0, i < 3 ? C.plate : C.eq2, 1.4);
  const knee = (s) => [c[0] + s * (14 + open), c[1] - 50 + open * 0.16], arm = (s) => limb([c[0] + s * 23, c[1]], { a: s > 0 ? [288, 250] : [252, 290], s: [0.5, 0.5] }, LEN.ua, LEN.fa);
  drawTop(g, C, c, [arm(-1), arm(1)], {
    glow, ry: 13,
    mid() {
      for (const s of [-1, 1]) {
        const k = knee(s), h = [c[0] + s * 11, c[1] - 2], padX = k[0] + s * (out ? 13 : -13);
        g.beginPath(); g.ellipse(k[0] + s * 2, k[1] - 16, 5.4, 12, s * 0.1, 0, TAU); g.fillStyle = C.shoe; g.fill();
        capsule(g, h, k, 16, C.far); capsule(g, h, lerp2(h, k, 0.45), 17, C.clothFar);
        K.dark(g, C, [c[0] + s * 4, c[1] + 30], [padX, k[1] + 6], 3.4); K.cushion(g, C, padX, k[1] - 2, 9, 26, 0);
      }
      K.cushion(g, C, c[0], c[1] + 17, 48, 11, 0);
      glowOn(g, C, glow); g.fillStyle = C.muscle;
      for (const s of [-1, 1]) { const k = knee(s), h = [c[0] + s * 11, c[1] - 2], m = lerp2(h, k, 0.5); g.beginPath(); g.ellipse(m[0] + s * (out ? 6 : -5), m[1], 3.4, 15, Math.atan2(k[0] - h[0], -(k[1] - h[1])), 0, TAU); g.fill(); }
      glowOff(g);
    },
  });
}

function pallofTop(g, t, C, glow, kneel) {
  const c = [208, 166], hand = [c[0], lerp(c[1] - 19, c[1] - 58, t)], s0 = lerp(0.22, 1, t);
  box(g, 56, 130, 30, 84, 0, C.eq, 6); for (let i = 0; i < 9; i++) box(g, 56, 100 + i * 7.4, 20, 5.4, 0, i < 4 ? C.plate : C.eq2, 1.4);
  K.pulley(g, C, [78, 130], 6.5); K.cable(g, C, [[84, 130], [hand[0] - 7, hand[1]]]);
  const mx = lerp(84, hand[0] - 7, 0.5), my = lerp(130, hand[1], 0.5), u = unit(hand, [84, 130]);
  g.fillStyle = C.cable; g.beginPath(); g.moveTo(mx + u[0] * 8, my + u[1] * 8); g.lineTo(mx - u[1] * 4.5, my + u[0] * 4.5); g.lineTo(mx + u[1] * 4.5, my - u[0] * 4.5); g.closePath(); g.fill();
  const armR = limb([c[0] + 23, c[1]], { to: [hand[0] + 3, hand[1]], bend: -1, s: [s0, 1] }, LEN.ua, LEN.fa);
  const armL = limb([c[0] - 23, c[1]], { to: [hand[0] - 3, hand[1]], bend: 1, s: [s0, 1] }, LEN.ua, LEN.fa);
  /* kneeling: the shins lie behind the body on a mat, and no feet show in front */
  if (kneel) { box(g, c[0], c[1] + 26, 78, 62, 0, C.pad, 8); for (const s of [-1, 1]) { capsule(g, [c[0] + s * 11, c[1] + 6], [c[0] + s * 13, c[1] + 44], 13, C.far); g.beginPath(); g.ellipse(c[0] + s * 13, c[1] + 50, 5, 9, 0, 0, TAU); g.fillStyle = C.shoe; g.fill(); } }
  drawTop(g, C, c, [armL, armR], { feet: !kneel, glow, ry: 14, headDy: 3, mus() { g.beginPath(); g.ellipse(c[0], c[1] - 6.5, 19, 5.6, 0, 0, TAU); g.fill(); } });

(function () {
