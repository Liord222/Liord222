<title>gymi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: four places and one sheet. "Today" shows the player, the next workout and the week as a path of four stops;
   a workout is a list of exercises, each opening into an animated demo with its cues, sets and feedback, with a dock at
   the bottom that logs a set in one tap and times the rest; the profile holds the player's character, level and
   achievements; "Progress" keeps the history. The look is quiet: a grey ground, white cards, large type and one accent
   colour. Gold belongs to the game alone: points, levels and rewards. The coach chat is a full sheet on phones and sits
   beside the page on wide screens. */
:root{
  --paper:#F2F3F5; --surface:#FFFFFF; --surface-2:#F2F3F5; --surface-3:#E7E9ED; --ink:#0E1116; --ink-2:#4B5261; --ink-3:#666D7A; --ink-4:#9AA1AD; --line:#E4E6EB;
  --accent:#2152E0; --on-accent:#FFFFFF; --accent-soft:#E3EAFF; --accent-ink:#1D46C4;
  --muscle:#D12D45; --muscle-soft:#FCE7EA; --warn:#A44A10; --warn-soft:#FBEBDD;
  --ok:#0B7A55; --ok-soft:#DDF3EA; --on-ok:#FFFFFF; --rest:#8A5A00; --rest-soft:#FFF1D1;
  --xp:#8F5B00; --xp-soft:#FFF0CC; --xp-fill:#F2B02E;
  --stage:#F5F6F8; --grid:#ECEEF2; --grid-2:#E1E4EA; --floor:#ECEEF2; --ground:#A3A9B5; --shadow:#DDE0E6;
  --fig:#6B7280; --fig-hi:#9097A3; --fig-lo:#4B5260; --fig-far:#B9BEC8; --cloth:#2152E0; --cloth-far:#9DB2F2;
  --shoe:#1B1F27; --shoe-far:#8A909C; --sole:#F4F5F7; --hair:#1B1F27;
  --equip:#CDD1D9; --equip-hi:#EEF0F3; --equip-2:#858C99; --pad:#2D323C; --pad-hi:#5E6573; --plate:#2D323C; --plate-hi:#858C99; --cable:#646B78;
  --f-display:"Heebo",-apple-system,"Segoe UI","Arial Hebrew",Arial,sans-serif;
  --f-body:"Heebo",-apple-system,"Segoe UI","Arial Hebrew",Arial,sans-serif;
  --r:24px; --tabbar:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B0C0F; --surface:#17191E; --surface-2:#22252C; --surface-3:#2E323A; --ink:#F4F5F7; --ink-2:#B4B9C4; --ink-3:#9299A6; --ink-4:#6B7280; --line:#2A2D35;
    --accent:#8DAEFF; --on-accent:#081230; --accent-soft:#1B2748; --accent-ink:#A9C2FF;
    --muscle:#FF6B7D; --muscle-soft:#3A161C; --warn:#FFA468; --warn-soft:#38200F;
    --ok:#4AD3A1; --ok-soft:#113528; --on-ok:#06231A; --rest:#FFC15E; --rest-soft:#38290B;
    --xp:#FFCB6B; --xp-soft:#3A2A08; --xp-fill:#F2B02E;
    --stage:#111318; --grid:#1A1D23; --grid-2:#23272F; --floor:#16181D; --ground:#4B5160; --shadow:#0A0B0E;
    --fig:#B9BEC8; --fig-hi:#DEE1E7; --fig-lo:#8F96A3; --fig-far:#4F5563; --cloth:#6E93FF; --cloth-far:#33467A;
    --shoe:#6A7180; --shoe-far:#3D424D; --sole:#D9DCE2; --hair:#6A7180;
    --equip:#3B404B; --equip-hi:#5E6573; --equip-2:#6F7684; --pad:#565D6B; --pad-hi:#8A91A0; --plate:#565D6B; --plate-hi:#979EAC; --cable:#858C99;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B0C0F; --surface:#17191E; --surface-2:#22252C; --surface-3:#2E323A; --ink:#F4F5F7; --ink-2:#B4B9C4; --ink-3:#9299A6; --ink-4:#6B7280; --line:#2A2D35;
  --accent:#8DAEFF; --on-accent:#081230; --accent-soft:#1B2748; --accent-ink:#A9C2FF;
  --muscle:#FF6B7D; --muscle-soft:#3A161C; --warn:#FFA468; --warn-soft:#38200F;
  --ok:#4AD3A1; --ok-soft:#113528; --on-ok:#06231A; --rest:#FFC15E; --rest-soft:#38290B;
  --xp:#FFCB6B; --xp-soft:#3A2A08; --xp-fill:#F2B02E;
  --stage:#111318; --grid:#1A1D23; --grid-2:#23272F; --floor:#16181D; --ground:#4B5160; --shadow:#0A0B0E;
  --fig:#B9BEC8; --fig-hi:#DEE1E7; --fig-lo:#8F96A3; --fig-far:#4F5563; --cloth:#6E93FF; --cloth-far:#33467A;
  --shoe:#6A7180; --shoe-far:#3D424D; --sole:#D9DCE2; --hair:#6A7180;
  --equip:#3B404B; --equip-hi:#5E6573; --equip-2:#6F7684; --pad:#565D6B; --pad-hi:#8A91A0; --plate:#565D6B; --plate-hi:#979EAC; --cable:#858C99;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
bdi{unicode-bidi:isolate;white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{direction:rtl}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* top row and navigation */
.brand{display:flex;align-items:center;gap:10px;min-height:64px;padding-block:14px 6px}
.logo{display:grid;direction:ltr;justify-items:start;line-height:1}
.logo-w{font-weight:800;font-size:26px;line-height:1;letter-spacing:-.03em;color:var(--ink)}
.logo-i{color:var(--accent)}
.logo small{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding-top:4px}
.sync{flex:1;min-width:0;font-size:12px;color:var(--ink-3);text-align:end;line-height:1.3}
.back,.top-coach,.top-list{display:none;width:44px;height:44px;flex:none;border:0;border-radius:50%;background:none;place-items:center;color:var(--ink);padding:0}
.top-coach .ava{width:36px;height:36px}
.top-acts{display:none;gap:0;justify-content:flex-end}
.top-list svg{width:24px;height:24px}
.wk-title{display:none;min-width:0;justify-items:center;text-align:center;line-height:1.25}
.wk-title b{max-width:100%;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-title .clock{font-size:13px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.app[data-view="workout"] .wk-title{display:grid;flex:1}
.app[data-view="workout"] .top-acts{display:flex}
.app[data-view="workout"] .top-list{display:grid}
.back{margin-inline-start:-10px}
.back svg{width:26px;height:26px;stroke-width:2.2}
.app[data-view="workout"] .back{display:grid}
.ava{display:block;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);overflow:hidden;flex:none}
.ava .av{width:100%;height:100%}
.tabbar{position:fixed;z-index:65;left:0;right:0;bottom:0;display:flex;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:grid;justify-items:center;gap:2px;min-height:46px;padding:3px 0 1px;border:0;border-radius:14px;background:none;color:var(--ink-3);font-size:11.5px;font-weight:500;line-height:1.25}
.tabbar svg{width:25px;height:25px;stroke-width:1.9}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:16px;border:0;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.big{min-height:58px;font-size:18px;width:100%;border-radius:20px}
.btn.danger{color:var(--muscle)}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled),.step:active,.rstep:active,.setp:active,.hit:active,.seg button:active,.tab:active .dot,.player:active .p-ava{transform:scale(.97)}
.link{background:none;border:0;padding:8px 4px;color:var(--accent);font-size:14px;font-weight:600}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn.send{background:var(--accent);color:var(--on-accent)}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start;padding-bottom:calc(var(--tabbar) + 44px + env(safe-area-inset-bottom,0px))}
.app[data-view="workout"] .cols{padding-bottom:calc(var(--dock-h,300px) + 36px)}
.main{min-width:0;display:grid;gap:14px}
.view{display:none;gap:14px;min-width:0}
.app[data-view="home"] .v-home,.app[data-view="workout"] .v-workout,.app[data-view="progress"] .v-progress,.app[data-view="profile"] .v-profile{display:grid}
.app:not([data-view="workout"]) .dock{display:none}

/* shared pieces */
.page-h{display:grid;gap:2px;padding:14px 4px 4px}
.cap{font-size:15px;font-weight:500;color:var(--ink-2)}
.big{font-size:40px;font-weight:800;line-height:1.12;letter-spacing:-.02em}
.card{background:var(--surface);border-radius:var(--r);padding:20px}
.sec{font-size:14px;font-weight:700;color:var(--ink-2);padding:10px 4px 0}
.sec small{font-size:13px;font-weight:600;color:var(--ink-3);margin-inline-start:4px}
.kicker{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.banner{background:var(--accent-soft);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:14px}
.banner b{color:var(--accent-ink)}
.banner p{flex:1;min-width:0}
.banner button{background:none;border:0;color:var(--ink-2);padding:2px}
.banner .link{padding:0 2px;color:var(--ink);font-weight:600;font-size:inherit}
.banner.warn{background:var(--warn-soft)}
.banner.warn b{color:var(--warn)}
.warn-pill{font-style:normal;font-size:11.5px;font-weight:700;line-height:1.6;padding:0 8px;border-radius:99px;color:var(--warn);background:var(--warn-soft);white-space:nowrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;border-radius:14px;background:var(--surface-2)}
.seg button{min-height:40px;padding:4px 6px;border-radius:11px;border:0;background:none;font-size:13px;font-weight:600;line-height:1.2;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* the game layer: level, points */
.lv-badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 9px;border-radius:99px;background:var(--xp-soft);color:var(--xp);font-size:13px;font-weight:800;line-height:1;white-space:nowrap;font-style:normal}
.xpbar{display:block;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.xpbar i{display:block;height:100%;min-width:8px;border-radius:99px;background:var(--xp-fill);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.xp-tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:99px;background:var(--xp-soft);color:var(--xp);font-size:13px;font-weight:800;line-height:1;white-space:nowrap}
.hit .xp-tag,.btn.primary .xp-tag{background:color-mix(in srgb,var(--on-accent) 20%,transparent);color:var(--on-accent)}
.app[data-view="workout"] .sync{display:none}
.toast{position:fixed;z-index:80;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:99px;background:var(--ink);color:var(--paper);font-size:17px;font-weight:700;white-space:nowrap;box-shadow:0 12px 30px -14px rgb(0 0 0 / .55)}
.toast svg{color:var(--xp-fill);fill:var(--xp-fill)}
.toast.in{animation:toast-in .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes toast-in{from{transform:translate(-50%,-18px);opacity:0}}

/* today */
.player{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;padding:10px 4px 4px;border:0;background:none;text-align:start}
.p-ava{width:72px;height:72px;border-radius:50%;overflow:hidden;background:var(--accent-soft);transition:transform .08s}
.p-ava.r0{background:var(--surface-3)}.p-ava.r2{background:var(--ok-soft)}.p-ava.r3{background:var(--rest-soft)}.p-ava.r4{background:var(--muscle-soft)}.p-ava.r5,.p-ava.r6{background:var(--xp-soft)}
.p-txt{display:grid;gap:6px;min-width:0}
.p-txt>b{font-size:27px;font-weight:800;line-height:1.15;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-rank{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.p-streak{display:grid;justify-items:center;color:var(--xp);padding-inline:4px}
.p-streak svg{width:26px;height:26px;fill:var(--xp-soft)}
.p-streak b{font-size:15px;font-weight:800;line-height:1.1}
.next{display:grid;gap:2px;padding:20px 22px 22px}
.next-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.next .k{font-size:15px;font-weight:600;color:var(--ink-2)}
.next h2{font-size:38px;font-weight:800;line-height:1.12;letter-spacing:-.02em}
.next .meta{font-size:15px;color:var(--ink-2);padding:2px 0 16px}
.week{display:grid;gap:4px;padding:8px 12px 14px}
.card-h{display:flex;align-items:center;gap:8px;min-height:44px;padding-inline:8px}
.card-h h2{flex:1;font-size:17px;font-weight:700}
.card-h h2 small{font-size:14px;font-weight:500;color:var(--ink-2)}
.go-link{display:inline-flex;align-items:center;gap:2px;min-height:44px;border:0;background:none;color:var(--accent);font-size:15px;font-weight:600;padding:0}
.go-link svg{width:18px;height:18px;stroke-width:2.2}
/* the week as a path: four stops joined by a line that fills as workouts are finished */
.week-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{position:relative;display:grid;justify-items:center;gap:6px;padding:6px 2px 4px;border:0;background:none;min-width:0}
.tab+.tab::before{content:"";position:absolute;top:31px;inset-inline-start:-50%;width:100%;height:3px;background:var(--surface-3)}
.tab.done+.tab::before{background:var(--accent)}
.tab .dot{position:relative;z-index:1;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);font-size:19px;font-weight:800;line-height:1;transition:transform .08s}
.tab .dot svg{width:24px;height:24px;stroke-width:2.6}
.tab.done .dot{background:var(--accent);color:var(--on-accent)}
.tab.next .dot,.tab.live .dot{background:var(--surface);box-shadow:inset 0 0 0 3px var(--accent);color:var(--accent-ink)}
.tab b{font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;color:var(--ink-2)}
.tab.next b,.tab.live b{color:var(--accent-ink);font-weight:700}

/* one workout: a progress strip, then one exercise at a time */
.hero{display:grid;gap:10px}
.hero:empty{display:none}
.meta{color:var(--ink-2);font-size:14px;padding-top:6px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.clock{display:inline-flex;align-items:center;gap:5px}
.clock svg{width:15px;height:15px;color:var(--ink-3)}
.clock b{font-weight:600}
.wk-bar{padding:0 2px}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.segs i b{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.segs i.cur{background:color-mix(in srgb,var(--accent) 28%,var(--surface-3))}
.segs i.off{opacity:.45}
.meso{display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 14px;border-radius:18px;border:0;background:var(--surface-2);text-align:start;font-size:14px;color:var(--ink-2)}
.meso span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink)}
.meso b{font-size:13px;font-weight:600;color:var(--accent-ink);white-space:nowrap}
.meso.dl b{color:var(--ok)}
.meso svg{width:18px;height:18px;color:var(--ink-4)}

/* recovery check */
.pre{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.pre-h{display:flex;gap:10px;align-items:center}
.pre-h b{flex:1;min-width:0;font-size:16px;line-height:1.3}
.pre-h .link{flex:none;padding:2px 0;white-space:nowrap}
.pre.gate{justify-items:center;text-align:center;gap:8px;padding:34px 22px 18px;margin-top:12vh}
.pre-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.pre-ic svg{width:30px;height:30px;stroke-width:2.4}
.pre.gate h2{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.pre.gate p{font-size:15px;color:var(--ink-2)}
.pre-q{display:grid;gap:8px;width:100%;padding-top:14px}
.pre>.btn{margin-top:4px}
.app.pre-on .fx,.app.pre-on .dock,.app.pre-on .wk-bar{display:none}
.pre-row{display:grid;gap:6px}
.pre-row>span{font-size:14px;font-weight:700}
.pre-fx{font-size:13.5px;color:var(--ink-2);background:var(--accent-soft);border-radius:14px;padding:10px 12px}

/* the list of all exercises (in its sheet) */
.ex-list{list-style:none;margin:0;padding:0;background:var(--surface-2);border-radius:20px;overflow:hidden}
.ex-list .ex+.ex{border-top:1px solid var(--line)}
.ex-head{display:grid;grid-template-columns:28px 56px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:68px;padding:10px 12px;background:none;border:0;text-align:start}
.ex-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;line-height:1;color:var(--ink-2);background:var(--surface)}
.ex.cur .ex-n{background:var(--accent);color:var(--on-accent)}
.ex.done .ex-n{background:var(--accent-soft);color:var(--accent-ink)}
.ex.done .ex-n svg{width:15px;height:15px;stroke-width:3}
.ex-thumb{width:56px;height:40px;border-radius:10px;background:var(--stage);display:block}
.ex-title{min-width:0;display:grid}
.ex-name{font-weight:600;font-size:15.5px;line-height:1.3}
.ex-side{display:grid;justify-items:end;gap:6px}
.ex-rx{font-size:15px;font-weight:700;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px;direction:ltr}
.pips i{width:12px;height:5px;border-radius:99px;background:var(--surface-3)}
.pips i.on{background:var(--accent)}
.ex.off .ex-n{color:var(--ink-3)}
.ex-list .ex.off .ex-rx{color:var(--ink-3);text-decoration:line-through}
.tags{display:flex;flex-wrap:wrap;gap:4px;padding-top:4px}
.tagx{font-size:11.5px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.ex-list .tagx{background:var(--surface)}
.tagx.warn{color:var(--warn);background:var(--warn-soft)}
.tagx.hint{color:var(--rest);background:var(--rest-soft)}
.tagx.ok{color:var(--ok);background:var(--ok-soft)}
.ls-act{display:grid;gap:4px;justify-items:center}
.ls-act .btn{color:var(--accent)}
.ls>.link{justify-self:start;padding-block:0}

/* the exercise on screen: its name, the demo, the numbers, the sets, then how-to / note / history */
.fx{list-style:none;margin:0;padding:0}
.fx .ex{display:grid;gap:12px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 10px)}
.fx .ex.in-next{animation:fx-next .28s cubic-bezier(.2,.8,.2,1)}
.fx .ex.in-prev{animation:fx-prev .28s cubic-bezier(.2,.8,.2,1)}
@keyframes fx-next{from{opacity:0;transform:translateX(-28px)}}
@keyframes fx-prev{from{opacity:0;transform:translateX(28px)}}
[dir="ltr"] .fx .ex.in-next{animation-name:fx-prev}
[dir="ltr"] .fx .ex.in-prev{animation-name:fx-next}
.fx-head{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:6px;padding-top:6px}
.fx-nav{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink);padding:0}
.fx-nav svg{width:22px;height:22px;stroke-width:2.2}
.fx-nav:disabled{opacity:.3;cursor:default}
.fx-t{display:grid;justify-items:center;text-align:center;gap:2px;min-width:0}
.fx-t .tags{justify-content:center}
.fx-k{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.fx .ex-name{font-size:25px;font-weight:800;line-height:1.18;letter-spacing:-.02em;text-wrap:balance}
.ex-body{background:var(--surface);border-radius:var(--r);padding:12px 12px 16px;display:grid;gap:14px}
.ex-a,.ex-b{display:grid;gap:12px;min-width:0}
.stage-wrap{position:relative;border-radius:18px;overflow:hidden;background:var(--stage)}
.stage{display:block;width:100%;max-width:100%;aspect-ratio:360/260}
.stage-tag,.stage-phase{position:absolute;inset-inline-start:10px;font-size:12px;font-weight:600;line-height:1.8;padding:0 10px;border-radius:99px;background:color-mix(in srgb,var(--surface) 90%,transparent);color:var(--ink-2)}
.stage-tag{top:10px}
.stage-phase{bottom:13px;transition:color .2s}
.stage-phase.hot{color:var(--muscle)}
.stage-ctl{position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:6px}
.stage-ctl button{min-width:40px;height:40px;border-radius:99px;border:0;background:color-mix(in srgb,var(--surface) 92%,transparent);display:grid;place-items:center;color:var(--ink-2);font-weight:700;font-size:13px;padding:0 6px}
.stage-ctl button[aria-pressed="true"]{color:var(--on-accent);background:var(--accent)}
.tempo{position:absolute;left:0;right:0;bottom:0;height:3px;direction:ltr}
.tempo i{display:block;height:100%;background:var(--muscle);transform-origin:left;transform:scaleX(0)}
.muscles{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline;justify-content:center;padding-inline:4px}
.muscles i{width:9px;height:9px;border-radius:50%;background:var(--muscle);flex:none;transform:translateY(-1px)}
.rx-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chipx,.chip{display:inline-flex;align-items:center;gap:4px;min-height:30px;font-size:13.5px;font-weight:700;line-height:1.2;padding:4px 12px;border-radius:99px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chipx small{font-size:12px;font-weight:600;color:var(--ink-2)}
.chip{font-weight:600;color:var(--ink-2)}
.chip.l1{color:var(--rest);background:var(--rest-soft)}
.chip.l2{color:var(--warn);background:var(--warn-soft)}
.chip.l3{color:var(--muscle);background:var(--muscle-soft)}
.flag-line{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:14px;padding:10px 12px}
.flag-line svg{width:18px;height:18px;margin-top:1px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.setp{display:grid;align-content:center;gap:1px;min-height:60px;padding:8px 12px;border-radius:16px;border:0;background:var(--surface-2);text-align:start;min-width:0}
.setp .n{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.setp .st{margin-inline-start:auto;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink-4);color:transparent}
.setp .st svg{width:11px;height:11px;stroke-width:3.4}
.setp .v{font-size:17px;font-weight:800;line-height:1.25;letter-spacing:-.02em;direction:ltr;text-align:right;white-space:nowrap}
[dir="ltr"] .setp .v{text-align:left}
.setp small{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.setp .hint{font-size:15px;line-height:1.25;color:var(--ink-3);font-weight:600;white-space:nowrap}
.setp .hint em{font-style:normal;font-size:12px;color:var(--muscle);font-weight:700}
.setp .tg+em{margin-inline-start:5px}
.setp.done .st{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.setp.cur{box-shadow:inset 0 0 0 2px var(--accent);background:var(--surface)}
.setp.cur .st{border-color:var(--accent)}
.setp .pr,.rt-log .pr{font-size:11px;font-weight:700;color:var(--rest);background:var(--rest-soft);border-radius:99px;padding:0 7px;line-height:1.6;letter-spacing:0}
.goal{display:inline-block;font-size:11.5px;font-weight:700;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--surface-3);color:var(--ink-2);margin-inline-start:6px;white-space:nowrap}
.goal.g-reps{color:var(--accent-ink);background:var(--accent-soft)}
.goal.g-wt{color:var(--ok);background:var(--ok-soft)}
.goal.g-down{color:var(--warn);background:var(--warn-soft)}
.goal.g-cal{color:var(--rest);background:var(--rest-soft)}
.cut-note{grid-column:1/-1;font-size:13.5px;color:var(--warn);font-weight:600}
.same{grid-column:1/-1;justify-self:start;color:var(--accent);background:none;min-height:40px;padding:0 4px;font-size:14px}
.fbk{display:grid;gap:8px}
.fb-row{display:grid;grid-template-columns:minmax(0,92px) minmax(0,1fr);gap:8px;align-items:center}
.fb-row>span{font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.25}
.fb-wrap{display:grid;gap:10px}
.rx-k{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600}
.fb-warn{font-size:13.5px;line-height:1.5;color:var(--ink-2);background:var(--warn-soft);border-radius:14px;padding:10px 12px}
.fb-warn b{color:var(--warn)}
.fb-warn .link{padding:0;font-size:inherit;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.fx-tabs button{position:relative}
.fx-tabs .dot{position:absolute;top:8px;inset-inline-end:10px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.fx-tabs button[aria-pressed="true"] .dot{background:var(--on-accent)}
.fx-pane{display:grid;gap:10px;min-height:92px;align-content:start}
.cues{list-style:none;margin:0;padding:0;display:grid;gap:7px;color:var(--ink-2);font-size:15px}
.cues li{padding-inline-start:16px;position:relative}
.cues li::before{content:"";position:absolute;inset-inline-start:2px;top:.66em;width:7px;height:2px;background:var(--ink-4);border-radius:2px}
.en-name{font-size:12.5px;color:var(--ink-3);direction:ltr;text-align:right}
.note{display:grid;gap:6px}
.note>span{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.note>span svg{width:14px;height:14px}
.note-in{display:block;width:100%;min-height:64px;resize:vertical;border-radius:16px;border:0;background:var(--surface-2);padding:12px 14px;font-size:16px;line-height:1.4}
.note-in:not(:placeholder-shown){background:var(--accent-soft)}
.prev-line{font-size:13.5px;color:var(--ink-2)}
.trend{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--surface-2)}
.trend .k{font-size:12.5px;color:var(--ink-3);font-weight:600}
.trend .val{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.02em;direction:ltr;text-align:right}
[dir="ltr"] .trend .val{text-align:left}
.trend .val small{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.trend .d{font-size:13px;font-weight:600;color:var(--ink-2)}
.trend .d.up{color:var(--ok)}
.trend .d.dn{color:var(--warn)}
.trend svg{grid-row:1/4;grid-column:2;width:118px;height:44px;overflow:visible;direction:ltr}
.ex-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ex-acts .btn{min-width:0;padding:0 10px}
.ask{color:var(--accent)}
.gains>.btn{background:var(--surface)}

/* progress */
.gains,.history{display:grid;gap:8px}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);overflow:hidden}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center;min-height:64px;padding:10px 18px;font-variant-numeric:tabular-nums}
.rows li+li{border-top:1px solid var(--line)}
.h-t,.g-t{font-weight:600;font-size:15.5px;line-height:1.3}
.h-s,.g-s{grid-column:1;color:var(--ink-2);font-size:13.5px}
.rows li.tap{display:block;padding:0}
.row-b{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:0 10px;align-items:center;width:100%;min-height:64px;padding:10px 18px;border:0;background:none;text-align:start}
.row-b .h-s{grid-column:1}
.row-b .xp-tag{grid-column:2;grid-row:1/3}
.row-b svg{grid-column:3;grid-row:1/3;width:18px;height:18px;color:var(--ink-4)}
.g-d{grid-column:2;grid-row:1/3;font-size:14px;font-weight:700;line-height:30px;padding:0 12px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.g-d.up{background:var(--accent-soft);color:var(--accent-ink)}
.g-d.dn{background:var(--warn-soft);color:var(--warn)}
.empty-note{font-size:14px;color:var(--ink-2);padding:0 4px}
.history>.link{justify-self:start}
.backup{display:grid;gap:8px}
.backup-act{display:flex;flex-wrap:wrap;gap:8px}
.backup-act .btn{background:var(--surface);flex:1;min-width:104px;padding:0 12px}
.backup-note{font-size:14px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:14px;padding:10px 14px}
.empty .btn{justify-self:start}

/* dock: log a set, then rest */
.dock{position:fixed;z-index:40;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 96%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-radius:28px 28px 0 0;box-shadow:0 0 0 1px var(--line),0 -18px 40px -26px rgb(0 0 0 / .4)}
.dock-in{max-width:640px;margin-inline:auto;display:grid;gap:10px}
.dk-top{display:flex;align-items:center;gap:8px;min-height:40px}
.dk-set{flex:1;min-width:0;font-size:14.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-set b{color:var(--ink);font-weight:800}
.dk-ic{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.dk-top .btn{min-height:44px;padding:0 14px}
.dk-note{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--ink-2);line-height:1.35}
.dk-note svg{width:14px;height:14px;margin-top:2px;color:var(--accent)}
.dk-note span{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dk-nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.num{display:flex;align-items:center;height:66px;padding:0 4px;border-radius:20px;background:var(--surface-2);direction:ltr;min-width:0}
.step,.rstep{width:44px;height:52px;flex:none;border:0;border-radius:16px;background:none;color:var(--ink);font-size:27px;font-weight:400;line-height:1;display:grid;place-items:center;padding:0}
.dk-kg,.dk-reps{flex:1;min-width:0;height:100%;display:grid;align-content:center;justify-items:center}
.dk-kg b,.dk-reps b{font-size:25px;font-weight:800;line-height:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.dk-kg small,.dk-reps small{font-size:11.5px;font-weight:600;line-height:14px;color:var(--ink-3);direction:rtl}
.dk-kg.ghost b,.dk-reps.ghost b{color:var(--ink-2)}
.num input{width:100%;height:46px;border:0;border-radius:12px;background:var(--surface);text-align:center;font-size:24px;font-weight:800;direction:ltr;outline:2px solid var(--accent);padding:0}
.hit{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:20px;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700;transition:transform .08s,background .15s}
.hit svg{width:24px;height:24px;stroke-width:2.6}
.hit.hit-on{background:var(--ok);color:var(--on-ok);transform:scale(.98)}
.dk-row{display:flex;gap:10px;align-items:center}
.dk-msg{flex:1;min-width:0;font-size:16px;font-weight:700}
.dk-msg small{display:block;font-size:13px;font-weight:500;color:var(--ink-2)}
.dk-row .btn{min-height:54px;border-radius:18px;padding:0 20px;font-size:16px}
.dk-row .btn svg{width:18px;height:18px}
.dock.mini .dk-nums,.dock.mini .hit,.dock.mini .dk-note{display:none}
.rt{display:flex;align-items:center;gap:14px}
.rt-time{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;direction:ltr;min-width:106px;text-align:center}
.rt-mid{flex:1;min-width:0;display:grid;gap:6px}
.rt-state{font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-state b{color:var(--ink);font-weight:700}
.dock.ready .rt-state b,.dock.go .rt-state b{color:var(--ok)}
.rt-track{height:6px;border-radius:99px;background:var(--surface-3);position:relative;overflow:hidden;direction:ltr}
.rt-track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:99px}
.dock.ready .rt-track i,.dock.go .rt-track i{background:var(--ok)}
.rt-log{font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rt-log .link{padding:0 4px;font-size:13px}
.rt-log .pr{margin:0}
.rt-log .xp-tag{height:20px;font-size:12px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.rt-btns{display:flex;gap:8px}
.rt-btns button{min-width:56px;height:50px;border-radius:16px;border:0;background:var(--surface-2);color:var(--ink);font-weight:700;font-size:14px;padding:0 10px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rt-btns .go{flex:1;background:var(--accent);color:var(--on-accent);font-size:16px}
.fb-dock{display:grid;gap:10px}
.fb-h{display:flex;align-items:center;gap:8px}
.fb-h b{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock.rest .fb-dock{border-top:1px solid var(--line);padding-top:10px}

/* chat with the coach */
.chat{flex-direction:column;background:var(--surface);min-height:0}
.chat-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-h .ava{width:46px;height:46px}
.chat-h div{flex:1;min-width:0}
.chat-h h2{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.chat-h p{font-size:13px;color:var(--ink-2);line-height:1.35}
.chat-h .icon-btn{width:40px;height:40px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.empty{margin:auto 0;display:grid;justify-items:center;text-align:center;gap:8px;color:var(--ink-2);font-size:15px;padding-block:8px}
.ava.big{width:88px;height:88px;margin-bottom:6px}
.empty strong{color:var(--ink);font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.empty>span{max-width:300px}
.empty .btn{margin-top:8px}
.sugs{display:grid;gap:8px;width:100%;padding-top:12px}
.sug{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 14px;border:0;border-radius:18px;background:var(--surface-2);font-size:15px;font-weight:600;line-height:1.3;text-align:start;color:var(--ink)}
.sug span{flex:1;min-width:0}
.sug svg:first-child{color:var(--accent)}
.sug svg:last-child{width:18px;height:18px;color:var(--ink-4)}
.row{display:flex;align-items:flex-end;gap:8px}
.row.u{justify-content:flex-end}
.ava.sm{width:30px;height:30px}
.msg{max-width:84%;padding:11px 15px;border-radius:20px;font-size:15.5px;line-height:1.55;overflow-wrap:anywhere}
.msg.u{background:var(--accent);color:var(--on-accent);border-end-end-radius:6px}
.msg.a{background:var(--surface-2);border-end-start-radius:6px}
.msg img{display:block;max-width:170px;max-height:170px;border-radius:12px;margin-bottom:6px}
.msg p{margin:0 0 6px}.msg p:last-child{margin-bottom:0}
.msg ul{margin:0 0 6px;padding-inline-start:18px}
.msg .note{display:block;font-size:12.5px;color:var(--ink-3);margin-top:6px}
.msg.u .note{color:inherit;opacity:.8}
.think{display:inline-flex;gap:5px;align-items:center;height:22px}
.think i{width:7px;height:7px;border-radius:50%;background:var(--ink-4);animation:think 1.1s ease-in-out infinite}
.think i:nth-child(2){animation-delay:.16s}.think i:nth-child(3){animation-delay:.32s}
@keyframes think{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.msg .logged{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ok)}
.msg .logged .link{padding:0 4px}
.verdict{display:inline-block;font-weight:700;font-size:13px;line-height:1.7;padding:0 10px;border-radius:99px;margin-bottom:6px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.mid{background:var(--rest-soft);color:var(--rest)}
.verdict.no{background:var(--muscle-soft);color:var(--muscle)}
.composer{padding:8px 12px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border-top:1px solid var(--line)}
/* what the question is about: a small pill above the field */
.chat-ctx{position:relative;justify-self:start;display:flex;align-items:center;gap:6px;max-width:100%;min-height:36px;padding-inline:14px 34px;border-radius:99px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.chat-ctx select{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;height:36px;border:0;background:none;padding:0;font-size:14px;font-weight:600;color:var(--ink);text-overflow:ellipsis}
.chat-ctx svg{position:absolute;inset-inline-end:10px;width:16px;height:16px;color:var(--ink-3);pointer-events:none}
.attach{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2)}
.attach img{width:48px;height:48px;object-fit:cover;border-radius:12px}
.attach span{flex:1}
.attach button{background:none;border:0;color:var(--ink-2);padding:6px}
.comp-note{font-size:13px;color:var(--warn)}
/* one bar: attach, write, send */
.comp-row{display:flex;gap:2px;align-items:flex-end;min-width:0;padding:5px;border-radius:27px;background:var(--surface-2)}
.comp-row .icon-btn{width:44px;height:44px;background:none}
.comp-row .icon-btn.send{background:var(--accent);color:var(--on-accent)}
.comp-row textarea{flex:1;min-width:0;width:0;height:44px;max-height:120px;resize:none;border:0;background:none;padding:10px 8px;font-size:16px;line-height:1.5}
.comp-row textarea:focus{outline:none}
.comp-row:focus-within{box-shadow:0 0 0 2px var(--accent)}

/* sheets: summary, editor, swap, mesocycle */
.sheet{position:fixed;inset:0;z-index:70;display:grid;place-items:end center;background:rgb(8 10 14 / .45);padding-top:calc(24px + env(safe-area-inset-top,0px))}
.sheet-in{position:relative;width:min(520px,100%);max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:28px 28px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}

.wk-strip{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px}
.wk-strip li{display:grid;justify-items:center;gap:1px;padding:9px 2px;border-radius:14px;background:var(--surface-2);min-width:0}

.wk-strip li.dl:not(.cur) b{color:var(--ok)}
.vol{display:grid;gap:10px}
.vol-row{display:grid;grid-template-columns:minmax(0,104px) minmax(0,1fr) 46px;gap:2px 10px;align-items:center}

.bl-row{display:flex;align-items:center;gap:10px}
.bl-n{flex:1;min-width:0;display:grid}

.stp{display:flex;align-items:center;gap:2px;flex:none;direction:ltr;background:var(--surface-2);border-radius:14px;padding:2px}

.inc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.inc-row{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.inc-row select{height:48px;border-radius:14px;border:0;background:var(--surface-2);padding:0 10px;font-size:16px}
.sum-list{list-style:none;margin:0;padding:0;display:grid}
.sum-list li{display:grid;gap:1px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.sum-list li>span:first-child{font-weight:700;font-size:14.5px}
.sum-list li>span:last-child{color:var(--ink-2)}
.sum-list b{color:var(--ink)}
.sum-list b.up{color:var(--ok)}
.sum-list b.dn{color:var(--warn)}

/* profile */
.pf-top{position:relative;display:grid;justify-items:center;gap:8px;background:var(--surface);border-radius:var(--r);padding:18px 20px 22px;text-align:center}
.pf-edit{position:absolute;top:14px;inset-inline-end:14px}
.pf-edit svg,.pf-top .btn svg{width:18px;height:18px}
.pf-stage{width:min(220px,60%)}
.pf-name{font-size:32px;font-weight:800;line-height:1.12;letter-spacing:-.02em}
.pf-rank{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600;color:var(--ink-2);padding-bottom:6px}
.pf-top .btn{margin-top:8px}
.xp{display:grid;gap:6px;width:100%}
.xp .xpbar{height:12px}
.xp-l{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pf-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pf-stats div{background:var(--surface);border-radius:18px;padding:14px 4px 12px;display:grid;gap:3px;justify-items:center;align-content:start;text-align:center}
.pf-stats b{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pf-stats span{font-size:12px;color:var(--ink-3);font-weight:600;line-height:1.25}
.pf-next{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 16px}
.pf-next svg{width:26px;height:26px;color:var(--xp)}
.pf-next span{flex:1;display:grid;min-width:0}
.pf-next small{font-size:12.5px;color:var(--ink-3);font-weight:600}
.pf-next b{font-size:16px;line-height:1.3}
.pf-next em{font-style:normal;font-size:13px;font-weight:800;line-height:24px;padding:0 9px;border-radius:99px;background:var(--xp-soft);color:var(--xp);white-space:nowrap}
.pf-sec{display:grid;gap:8px}
.badges{list-style:none;margin:0;padding:18px 6px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 2px;background:var(--surface);border-radius:var(--r)}
.bdg{display:grid;justify-items:center;align-content:start;gap:6px;text-align:center;font-size:11.5px;font-weight:600;line-height:1.25;color:var(--ink-3)}
.bdg-i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-4)}
.bdg-i svg{width:24px;height:24px}
.bdg.on{color:var(--ink)}
.bdg.on .bdg-i{background:var(--xp-soft);color:var(--xp)}
.pf-how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pf-how span{display:grid;justify-items:center;gap:2px;background:var(--surface);border-radius:18px;padding:12px 4px;font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:center}
.pf-how b{font-size:20px;font-weight:800;line-height:1.2;color:var(--xp)}

/* the character */
.av{display:block;width:100%;height:auto;overflow:visible}
.av-aura{fill:var(--accent-soft)}
.av-aura.r0{fill:var(--surface-3)}.av-aura.r2{fill:var(--ok-soft)}.av-aura.r3{fill:var(--rest-soft)}.av-aura.r4{fill:var(--muscle-soft)}.av-aura.r5,.av-aura.r6{fill:var(--xp-soft)}
.av-shadow{fill:var(--shadow)}
.av-arm,.av-fore,.av-bi{transition:transform .55s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.av-arm.l{transform:rotate(9deg)}.av-arm.r{transform:rotate(-9deg)}
.av-arm.l .av-fore{transform:rotate(-13deg)}.av-arm.r .av-fore{transform:rotate(13deg)}
.av-bi{opacity:0;transform:scale(.5)}
.av.flex .av-arm.l{transform:rotate(96deg)}.av.flex .av-arm.r{transform:rotate(-96deg)}
.av.flex .av-arm.l .av-fore{transform:rotate(118deg)}.av.flex .av-arm.r .av-fore{transform:rotate(-118deg)}
.av.flex .av-bi{opacity:1;transform:scale(1)}
.av-grin{opacity:0}.av.flex .av-smile{opacity:0}.av.flex .av-grin{opacity:1}
.av-bod{animation:av-breathe 3.4s ease-in-out infinite}
.av-eyes{transform-origin:100px 56px;animation:av-blink 4.8s infinite}
.av.still .av-bod,.av.bust .av-bod,.av.bust .av-eyes{animation:none}
.av.flex .av-fig{animation:av-hop 1s ease-in-out 3}
@keyframes av-breathe{50%{transform:translateY(-1.5px)}}
@keyframes av-blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes av-hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-9px)}}

/* the character sheet */
.lk-stage{width:150px;justify-self:center}
#lkRows{display:grid;gap:14px}
.lk-row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:center}
.lk-row>span{font-size:14px;font-weight:600;color:var(--ink-2)}
.lk-row input{width:100%;min-width:0;height:48px;border-radius:14px;border:0;background:var(--surface-2);padding:0 14px;font-size:16px}
.lk-opts{display:flex;flex-wrap:wrap;gap:9px;padding:3px}
.lk-sw{width:34px;height:34px;border-radius:50%;border:0;padding:0;background:var(--c);box-shadow:0 0 0 1px var(--line)}
.lk-sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--accent)}

/* the end of a workout */
.sum{justify-items:center;text-align:center;gap:12px}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sum-av{width:158px;margin-block:-4px -6px}
.sum .sum-xp{display:grid;justify-items:center;font-size:54px;line-height:1.05;letter-spacing:-.03em;color:var(--xp);font-variant-numeric:tabular-nums}

.sum .sum-up{display:inline-flex;align-items:center;gap:6px;font-size:17px;font-weight:800;color:var(--ink);background:var(--xp-soft);border-radius:99px;padding:6px 18px}
.sum-up svg{color:var(--xp);fill:var(--xp-fill)}
.sum-new{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.sum-new li{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;background:var(--surface-2);border-radius:99px;padding:6px 14px}
.sum-new svg{width:18px;height:18px;color:var(--xp)}
.sum .stats{grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
.sum .stats div{justify-items:center;padding:12px 4px 10px}
.sum .stats b{text-align:center;font-size:20px}
.sum .sum-next{font-size:13.5px}
.sum .btn{position:relative}
.xp-line{display:flex;align-items:center;gap:8px;font-weight:600}

}

}

}

  if (!idx.length) return null;
  S.touched = true; if (w === S.tab) { S.draft = null; if (rest.on) { clearInterval(rest.iv); rest.on = false; rest.last = null; } }
  renderAll(); bump(lv0); keepAwake();
  return { ex: e.id, name: e.he, idx };
}
function undoLog(i) {
  const m = chat.msgs[i], e = m && m.logged && findEx(m.logged.ex); if (!e || m.logged.undone) return;
  for (const k of m.logged.idx) clearRow(e, k);
  m.logged.undone = true; S.edit = null; renderAll(); renderMsgs();
}
async function sendChat(preset) {
  if (chat.busy) { if (chat.ctl) chat.ctl.abort(); return; }
  if (chat.off) return;
  const inp = $('#chatInput'), typed = (preset || inp.value).trim(), img = chat.img, imgUrl = chat.imgUrl;
  if (!typed && !img) { inp.focus(); return; }
  const text = typed || 'מה המכשיר שבתמונה, והאם הוא מתאים כתחליף?', ctx = ctxLine();
  compNote(''); setBusy(true);
  chat.msgs.push({ role: 'u', text, imgUrl: img ? imgUrl : '', hadImg: !!img, ctx: ctx.name });
  const reply = { role: 'a', text: '', live: true }; chat.msgs.push(reply);
  chat.turns.push({ role: 'user', content: ctx.text + '\n\n' + text + (img ? '\n\n[להודעה הזאת צורפה תמונה אחת]' : '') });
  inp.value = ''; inp.style.height = ''; chat.img = null; chat.imgUrl = ''; $('#attach').hidden = true;
  renderMsgs();
  const undo = () => { chat.turns.pop(); chat.msgs.splice(chat.msgs.length - 2, 2); inp.value = typed; if (img) { chat.img = img; chat.imgUrl = imgUrl; $('#attach').hidden = false; $('#attachImg').src = imgUrl; } renderMsgs(); };
  let sample = null;
  try { sample = await chat.sampleP; } catch (e) { sample = null; }
  if (!sample) { undo(); chat.needKey = !!window.GYMI_NATIVE; chat.off = window.GYMI_NATIVE ? NATIVE_OFF : 'הצ׳אט פועל רק כשהדף פתוח בתוך Claude.'; renderMsgs(); setBusy(false); return; }
  chat.ctl = new AbortController();
  try {
    const opts = { cache: false, signal: chat.ctl.signal, onText: (u) => { reply.text = u.text; paintLast(); } };
    if (img) opts.images = [img];
    const res = await sample([{ role: 'user', content: rules() }].concat(chat.turns.slice(-16)), opts);
    reply.text = res.text; reply.live = false; if (res.truncated) reply.note = 'התשובה נקטעה באמצע. בקש המשך או שאל שאלה קצרה יותר.';
    chat.turns.push({ role: 'assistant', content: res.text });
    const lg = res.truncated ? null : applyLog(res.text); if (lg) reply.logged = lg;
    renderMsgs();
  } catch (e) {
    const code = (e && e.code) || 'upstream_error', part = e && e.text && stripCmd(e.text);
    if (code === 'no_key') { undo(); window.gymiCoach(false); }
    else if (code === 'api_error' && e.message) { undo(); compNote('Anthropic: ' + String(e.message).slice(0, 200)); }
    else if (HIDE.includes(code)) { undo(); chat.off = ERR[code] || 'הצ׳אט לא זמין בתצוגה הזאת.'; renderMsgs(); }
    else if (part && code !== 'refused') { reply.text = part; reply.live = false; reply.note = code === 'cancelled' ? 'עצרת את התשובה.' : ERR[code] || ERR.upstream_error; chat.turns.push({ role: 'assistant', content: part }); paintLast(); }
    else { undo(); if (code !== 'cancelled') compNote(ERR[code] || ERR.upstream_error); if (code === 'images_unavailable') { chat.canImg = false; showImgBtns(); setAttach(null); } }
  } finally { chat.ctl = null; setBusy(false); }
}
function showImgBtns() { $('#camBtn').hidden = $('#galBtn').hidden = !chat.canImg; }
/* the exercise picker follows the plan as it stands (swapped movements show under their own name) */
function fillCtx() {
  const sel = $('#chatCtx'), v = sel.value;
  sel.innerHTML = '<option value="">כל התוכנית</option>' + PLAN.map((w, i) => '<optgroup label="' + wkFull(i) + '">' + exList(i).map((e) => '<option value="' + e.id + '">' + e.he + '</option>').join('') + '</optgroup>').join('');
  sel.value = v;
}
function initChat() {
  fillCtx();
  for (const el of $$('.ava')) if (!el.firstChild) el.innerHTML = coachFace();
  $('#chatKey').hidden = !window.GYMI_NATIVE;
  chat.needKey = !!window.GYMI_NATIVE && !window.GYMI_COACH;
  /* in the phone app the coach answers only once the owner has saved an API key */
  if (chat.needKey) { chat.sampleP = Promise.resolve(null); chat.off = NATIVE_OFF; renderMsgs(); return; }
  chat.off = '';
  if (!window.claude || typeof window.claude.use !== 'function') { chat.sampleP = Promise.resolve(null); chat.off = 'הצ׳אט פועל רק כשהדף פתוח בתוך Claude.'; renderMsgs(); return; }
  chat.sampleP = window.claude.use('sample');
  chat.sampleP.then(async (sample) => {
    if (!sample) { chat.needKey = !!window.GYMI_NATIVE; chat.off = window.GYMI_NATIVE ? NATIVE_OFF : 'הצ׳אט לא זמין בתצוגה הזאת.'; renderMsgs(); return; }
    try { const lim = await sample.limits(); chat.canImg = !!(lim && lim.images); } catch (e) { chat.canImg = false; }
    showImgBtns();
    if (!chat.canImg) $('#chatInput').placeholder = 'כתוב שם של מכשיר או תרגיל חלופי';
  }).catch(() => {});
  renderMsgs();
}
function openChat(exId) {
  fillCtx();
  if (exId) $('#chatCtx').value = exId;
  $('#chat').classList.add('open'); $('#app').classList.add('chat-on');
  if (!matchMedia('(min-width:1000px)').matches) document.body.style.overflow = 'hidden'; else $('#chatInput').focus();
}
function closeChat() { $('#chat').classList.remove('open'); $('#app').classList.remove('chat-on'); document.body.style.overflow = ''; }
function wireChat() {
  $('#chatOpen').addEventListener('click', () => openChat(S.view === 'workout' ? S.open : null));
  $('#chatClose').addEventListener('click', closeChat);
  $('#chatKey').addEventListener('click', () => { if (window.gymiNative) window.gymiNative.key(); });
  /* the phone app calls this after a key was saved or removed */
  window.gymiCoach = (on) => { window.GYMI_COACH = !!on; initChat(); };
  $('#chatNew').addEventListener('click', () => { if (chat.ctl) chat.ctl.abort(); chat.msgs = []; chat.turns = []; setAttach(null); compNote(''); renderMsgs(); });
  $('#sendBtn').addEventListener('click', () => sendChat());
  const inp = $('#chatInput');
  inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); sendChat(); } });
  inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(120, inp.scrollHeight + 2) + 'px'; });
  $('#msgs').addEventListener('click', (ev) => {
    const b = ev.target.closest('.sug'); if (b) { sendChat(SUGS()[+b.dataset.sug][1]); return; }
    const u = ev.target.closest('[data-unlog]'); if (u) undoLog(+u.dataset.unlog);
    if (ev.target.closest('#coachKey') && window.gymiNative) window.gymiNative.key();
  });
  $('#camBtn').addEventListener('click', () => $('#camFile').click());
  $('#galBtn').addEventListener('click', () => $('#galFile').click());
  for (const id of ['#camFile', '#galFile']) $(id).addEventListener('change', (ev) => { const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; pickImage(f); });
  $('#attachX').addEventListener('click', () => setAttach(null));
}

/* ================================================================== boot */
let booted = false;
function boot(data) {
  if (booted) return; booted = true;
  data = data || {};
  document.documentElement.lang = 'he'; document.documentElement.dir = 'rtl';
  const d = loadLocal();
  if (d.sessions) S.sessions = d.sessions;
  if (typeof d.sound === 'boolean') S.sound = d.sound;
  if (Array.isArray(d.dirty)) S.dirty = new Set(d.dirty);
  if (Array.isArray(d.gone)) S.gone = new Set(d.gone);
  if (d.cfg) S.cfg = normCfg(d.cfg);
  if (d.pre && typeof d.pre === 'object') S.pre = d.pre;
  sweep();
  /* a workout that was already running before mesocycles existed joins the current one where it stands */
  for (const s of Object.values(S.sessions)) if (!s.end && !s.m) { stamp(s); touch(s, true); }
  S.tab = typeof data.tab === 'number' && data.tab >= 0 && data.tab < 4 ? data.tab : nextUp().next;
  if (Array.isArray(data.msgs)) chat.msgs = data.msgs;
  if (Array.isArray(data.turns)) chat.turns = data.turns;
  readColors(); wireApp(); wireCoach(); wireChat(); wireMe();
  setView(['workout', 'progress', 'home', 'profile'].includes(data.view) ? data.view : nextUp().live >= 0 ? 'workout' : 'home', true);
  S.open = typeof data.open === 'string' ? data.open : null;
  renderAll(); initChat();
  initCloud(onRemoteChange);
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then((dl) => { if (dl) { S.dl = dl; renderHistory(); } }).catch(() => {});
}
(function () {
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ view: S.view, tab: S.tab, open: S.open, turns: chat.turns.slice(-16), msgs: chat.msgs.filter((m) => !m.live).slice(-24).map((m) => ({ role: m.role, text: m.text, hadImg: !!m.hadImg, ctx: m.ctx || '', note: m.note || '' })) })); } catch (e) { /* no live update here */ }
  try { if (hot && typeof hot.ready === 'function') { hot.ready(boot); setTimeout(() => boot({}), 1200); } else boot((hot && hot.data) || {}); } catch (e) { boot({}); }
})();
