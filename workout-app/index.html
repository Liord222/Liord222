<title>gymi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: three places and one sheet. "Today" shows the next workout and the week; a workout is a list of exercises,
   each opening into an animated demo with its cues, sets and feedback, with a dock at the bottom that logs a set in one
   tap and times the rest; "Progress" keeps the history. The look is quiet: a grey ground, white cards, large type and
   one accent colour. The coach chat is a full sheet on phones and sits beside the page on wide screens. */
:root{
  --paper:#F2F3F5; --surface:#FFFFFF; --surface-2:#F2F3F5; --surface-3:#E7E9ED; --ink:#0E1116; --ink-2:#4B5261; --ink-3:#666D7A; --ink-4:#9AA1AD; --line:#E4E6EB;
  --accent:#2152E0; --on-accent:#FFFFFF; --accent-soft:#E3EAFF; --accent-ink:#1D46C4;
  --muscle:#D12D45; --muscle-soft:#FCE7EA; --warn:#A44A10; --warn-soft:#FBEBDD;
  --ok:#0B7A55; --ok-soft:#DDF3EA; --on-ok:#FFFFFF; --rest:#8A5A00; --rest-soft:#FFF1D1;
  --stage:#F5F6F8; --grid:#ECEEF2; --grid-2:#E1E4EA; --floor:#ECEEF2; --ground:#A3A9B5; --shadow:#DDE0E6;
  --fig:#6B7280; --fig-hi:#9097A3; --fig-lo:#4B5260; --fig-far:#B9BEC8; --cloth:#2152E0; --cloth-far:#9DB2F2;
  --shoe:#1B1F27; --shoe-far:#8A909C; --sole:#F4F5F7; --hair:#1B1F27;
  --equip:#CDD1D9; --equip-hi:#EEF0F3; --equip-2:#858C99; --pad:#2D323C; --pad-hi:#5E6573; --plate:#2D323C; --plate-hi:#858C99; --cable:#646B78;
  --f-display:"Heebo",-apple-system,"Segoe UI","Arial Hebrew",Arial,sans-serif;
  --f-body:"Heebo",-apple-system,"Segoe UI","Arial Hebrew",Arial,sans-serif;
  --r:24px; --tabbar:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B0C0F; --surface:#17191E; --surface-2:#22252C; --surface-3:#2E323A; --ink:#F4F5F7; --ink-2:#B4B9C4; --ink-3:#9299A6; --ink-4:#6B7280; --line:#2A2D35;
    --accent:#8DAEFF; --on-accent:#081230; --accent-soft:#1B2748; --accent-ink:#A9C2FF;
    --muscle:#FF6B7D; --muscle-soft:#3A161C; --warn:#FFA468; --warn-soft:#38200F;
    --ok:#4AD3A1; --ok-soft:#113528; --on-ok:#06231A; --rest:#FFC15E; --rest-soft:#38290B;
    --stage:#111318; --grid:#1A1D23; --grid-2:#23272F; --floor:#16181D; --ground:#4B5160; --shadow:#0A0B0E;
    --fig:#B9BEC8; --fig-hi:#DEE1E7; --fig-lo:#8F96A3; --fig-far:#4F5563; --cloth:#6E93FF; --cloth-far:#33467A;
    --shoe:#6A7180; --shoe-far:#3D424D; --sole:#D9DCE2; --hair:#6A7180;
    --equip:#3B404B; --equip-hi:#5E6573; --equip-2:#6F7684; --pad:#565D6B; --pad-hi:#8A91A0; --plate:#565D6B; --plate-hi:#979EAC; --cable:#858C99;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B0C0F; --surface:#17191E; --surface-2:#22252C; --surface-3:#2E323A; --ink:#F4F5F7; --ink-2:#B4B9C4; --ink-3:#9299A6; --ink-4:#6B7280; --line:#2A2D35;
  --accent:#8DAEFF; --on-accent:#081230; --accent-soft:#1B2748; --accent-ink:#A9C2FF;
  --muscle:#FF6B7D; --muscle-soft:#3A161C; --warn:#FFA468; --warn-soft:#38200F;
  --ok:#4AD3A1; --ok-soft:#113528; --on-ok:#06231A; --rest:#FFC15E; --rest-soft:#38290B;
  --stage:#111318; --grid:#1A1D23; --grid-2:#23272F; --floor:#16181D; --ground:#4B5160; --shadow:#0A0B0E;
  --fig:#B9BEC8; --fig-hi:#DEE1E7; --fig-lo:#8F96A3; --fig-far:#4F5563; --cloth:#6E93FF; --cloth-far:#33467A;
  --shoe:#6A7180; --shoe-far:#3D424D; --sole:#D9DCE2; --hair:#6A7180;
  --equip:#3B404B; --equip-hi:#5E6573; --equip-2:#6F7684; --pad:#565D6B; --pad-hi:#8A91A0; --plate:#565D6B; --plate-hi:#979EAC; --cable:#858C99;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
bdi{unicode-bidi:isolate;white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{direction:rtl}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* top row and navigation */
.brand{display:flex;align-items:center;gap:10px;min-height:64px;padding-block:14px 6px}
.logo{display:grid;direction:ltr;justify-items:start;line-height:1}
.logo-w{font-weight:800;font-size:26px;line-height:1;letter-spacing:-.03em;color:var(--ink)}
.logo-i{color:var(--accent)}
.logo small{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding-top:4px}
.sync{flex:1;min-width:0;font-size:12px;color:var(--ink-3);text-align:end;line-height:1.3}
.back,.top-coach{display:none;width:44px;height:44px;flex:none;border:0;border-radius:50%;background:none;place-items:center;color:var(--ink);padding:0}
.back{margin-inline-start:-10px}
.back svg{width:26px;height:26px;stroke-width:2.2}
.app[data-view="workout"] .back{display:grid}
.ava{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1;flex:none}
.tabbar{position:fixed;z-index:65;left:0;right:0;bottom:0;display:flex;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:grid;justify-items:center;gap:2px;min-height:46px;padding:3px 0 1px;border:0;border-radius:14px;background:none;color:var(--ink-3);font-size:11.5px;font-weight:500;line-height:1.25}
.tabbar svg{width:25px;height:25px;stroke-width:1.9}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:16px;border:0;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.big{min-height:58px;font-size:18px;width:100%;border-radius:20px}
.btn.danger{color:var(--muscle)}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled),.step:active,.rstep:active,.setp:active,.hit:active,.seg button:active,.tab:active .dot{transform:scale(.97)}
.link{background:none;border:0;padding:8px 4px;color:var(--accent);font-size:14px;font-weight:600}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn.send{background:var(--accent);color:var(--on-accent)}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start;padding-bottom:calc(var(--tabbar) + 44px + env(safe-area-inset-bottom,0px))}
.app[data-view="workout"] .cols{padding-bottom:calc(var(--dock-h,300px) + 36px)}
.main{min-width:0;display:grid;gap:14px}
.view{display:none;gap:14px;min-width:0}
.app[data-view="home"] .v-home,.app[data-view="workout"] .v-workout,.app[data-view="progress"] .v-progress{display:grid}
.app:not([data-view="workout"]) .dock{display:none}

/* shared pieces */
.page-h{display:grid;gap:2px;padding:14px 4px 4px}
.cap{font-size:15px;font-weight:500;color:var(--ink-2)}
.big{font-size:40px;font-weight:800;line-height:1.12;letter-spacing:-.02em}
.card{background:var(--surface);border-radius:var(--r);padding:20px}
.sec{font-size:14px;font-weight:700;color:var(--ink-2);padding:10px 4px 0}
.kicker{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.banner{background:var(--accent-soft);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:14px}
.banner b{color:var(--accent-ink)}
.banner p{flex:1;min-width:0}
.banner button{background:none;border:0;color:var(--ink-2);padding:2px}
.banner .link{padding:0 2px;color:var(--ink);font-weight:600;font-size:inherit}
.banner.warn{background:var(--warn-soft)}
.banner.warn b{color:var(--warn)}
.warn-pill{font-style:normal;font-size:11.5px;font-weight:700;line-height:1.6;padding:0 8px;border-radius:99px;color:var(--warn);background:var(--warn-soft);white-space:nowrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;border-radius:14px;background:var(--surface-2)}
.seg button{min-height:40px;padding:4px 6px;border-radius:11px;border:0;background:none;font-size:13px;font-weight:600;line-height:1.2;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* today */
.next{display:grid;gap:2px;padding:22px}
.next .k{font-size:14px;font-weight:500;color:var(--ink-2)}
.next h2{font-size:42px;font-weight:800;line-height:1.1;letter-spacing:-.03em;direction:ltr;text-align:right}
.next .meta{font-size:15px;color:var(--ink-2);padding:2px 0 18px}
.week{display:grid;gap:4px;padding:8px 12px 14px}
.card-h{display:flex;align-items:center;gap:8px;min-height:44px;padding-inline:8px}
.card-h h2{flex:1;font-size:17px;font-weight:700}
.go-link{display:inline-flex;align-items:center;gap:2px;min-height:44px;border:0;background:none;color:var(--accent);font-size:15px;font-weight:600;padding:0}
.go-link svg{width:18px;height:18px;stroke-width:2.2}
.week-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
.tab{display:grid;justify-items:center;gap:5px;padding:6px 2px 4px;border:0;border-radius:18px;background:none;min-width:0}
.tab .dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--on-accent);transition:transform .08s}
.tab .dot svg{width:24px;height:24px;stroke-width:2.4}
.tab.done .dot{background:var(--accent)}
.tab.next .dot,.tab.live .dot{background:none;border:3px solid var(--accent)}
.tab.next .dot::after,.tab.live .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tab b{font-size:13px;font-weight:600;line-height:1.3;direction:ltr;white-space:nowrap}
.tab small{font-size:11.5px;font-weight:500;line-height:16px;min-height:16px;color:var(--ink-3)}
.tab.next small,.tab.live small{color:var(--accent-ink);font-weight:700}

/* one workout */
.hero{display:grid;gap:10px}
.hero-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r);padding:20px 22px}
.hero h1{font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-.03em;direction:ltr;text-align:right}
.meta{color:var(--ink-2);font-size:14px;padding-top:6px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:var(--surface-3)}
.ring .pr{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;line-height:1.1}
.ring b{font-size:19px;font-weight:800;direction:ltr;letter-spacing:-.02em}
.ring span{font-size:11px;color:var(--ink-3);font-weight:600}
.meso{display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 18px 8px 12px;border-radius:18px;border:0;background:var(--surface);text-align:start;font-size:14px;color:var(--ink-2)}
.meso span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink)}
.meso b{font-size:13px;font-weight:600;color:var(--accent-ink);white-space:nowrap}
.meso.dl b{color:var(--ok)}
.meso svg{width:18px;height:18px;color:var(--ink-4)}
.meso em{font-style:normal;font-size:11.5px;font-weight:700;line-height:1.6;padding:0 8px;border-radius:99px;color:var(--warn);background:var(--warn-soft);white-space:nowrap}

/* recovery check */
.pre{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.pre-h{display:flex;gap:10px;align-items:flex-start}
.pre-h div{flex:1;min-width:0;display:grid;gap:2px}
.pre-h b{font-size:16px;line-height:1.3}
.pre-h span{font-size:13.5px;color:var(--ink-2)}
.pre-h .link{flex:none;padding:2px 0;white-space:nowrap}
.pre-row{display:grid;gap:6px}
.pre-row>span{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.pre-row small{font-size:12.5px;font-weight:500;color:var(--ink-3)}
.pre-fx{font-size:13.5px;color:var(--ink-2);background:var(--accent-soft);border-radius:14px;padding:10px 12px}
.pre.done{grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:12px 18px}
.pre.done p{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.pre.done svg{color:var(--accent);width:18px;height:18px;margin-top:2px}
.pre.done b{color:var(--ink)}

/* exercise list */
.ex-list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);overflow:hidden}
.ex{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 10px)}
.ex+.ex{border-top:1px solid var(--line)}
.ex-head{display:grid;grid-template-columns:28px 64px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:76px;padding:12px 14px;background:none;border:0;text-align:start}
.ex-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;line-height:1;color:var(--ink-2);background:var(--surface-2)}
.ex.cur .ex-n{background:var(--accent);color:var(--on-accent)}
.ex.done .ex-n{background:var(--accent-soft);color:var(--accent-ink)}
.ex.done .ex-n svg{width:15px;height:15px;stroke-width:3}
.ex-thumb{width:64px;height:46px;border-radius:12px;background:var(--stage);display:block}
.ex-title{min-width:0;display:grid}
.ex-name{font-weight:600;font-size:15.5px;line-height:1.25;direction:ltr;text-align:right;unicode-bidi:isolate}
.ex-sub{font-size:13px;color:var(--ink-2);line-height:1.35}
.ex-side{display:grid;justify-items:end;gap:6px}
.ex-rx{font-size:15px;font-weight:700;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px;direction:ltr}
.pips i{width:12px;height:5px;border-radius:99px;background:var(--surface-3)}
.pips i.on{background:var(--accent)}
.ex.off .ex-n{color:var(--ink-3)}
.ex.off .ex-rx{color:var(--ink-3);text-decoration:line-through}
.tags{display:flex;flex-wrap:wrap;gap:4px;padding-top:4px}
.tagx{font-size:11.5px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tagx.warn{color:var(--warn);background:var(--warn-soft)}
.tagx.hint{color:var(--rest);background:var(--rest-soft)}
.tagx.ok{color:var(--ok);background:var(--ok-soft)}

/* an open exercise: the demo, how to do it, the numbers, the sets */
.ex-body{padding:2px 14px 18px;display:grid;gap:16px}
.ex-a,.ex-b{display:contents}
.stage-wrap{order:1;position:relative;border-radius:20px;overflow:hidden;background:var(--stage)}
.stage{display:block;width:100%;max-width:100%;aspect-ratio:360/260}
.stage-tag,.stage-phase{position:absolute;inset-inline-start:10px;font-size:12px;font-weight:600;line-height:1.8;padding:0 10px;border-radius:99px;background:color-mix(in srgb,var(--surface) 90%,transparent);color:var(--ink-2)}
.stage-tag{top:10px}
.stage-phase{bottom:13px;transition:color .2s}
.stage-phase.hot{color:var(--muscle)}
.stage-ctl{position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:6px}
.stage-ctl button{min-width:40px;height:40px;border-radius:99px;border:0;background:color-mix(in srgb,var(--surface) 92%,transparent);display:grid;place-items:center;color:var(--ink-2);font-weight:700;font-size:13px;padding:0 6px}
.stage-ctl button[aria-pressed="true"]{color:var(--on-accent);background:var(--accent)}
.tempo{position:absolute;left:0;right:0;bottom:0;height:3px;direction:ltr}
.tempo i{display:block;height:100%;background:var(--muscle);transform-origin:left;transform:scaleX(0)}
.how{order:2;display:grid;gap:10px}
.muscles{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.muscles i{width:9px;height:9px;border-radius:50%;background:var(--muscle);flex:none;transform:translateY(-1px)}
.cues{list-style:none;margin:0;padding:0;display:grid;gap:6px;color:var(--ink-2);font-size:14.5px}
.cues li{padding-inline-start:16px;position:relative}
.cues li::before{content:"";position:absolute;inset-inline-start:2px;top:.66em;width:7px;height:2px;background:var(--ink-4);border-radius:2px}
.note{display:grid;gap:6px}
.note>span{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.note>span svg{width:14px;height:14px}
.note-in{display:block;width:100%;min-height:48px;resize:vertical;border-radius:16px;border:0;background:var(--surface-2);padding:12px 14px;font-size:16px;line-height:1.4}
.note-in:not(:placeholder-shown){background:var(--accent-soft)}
.rx-row{order:3;display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px 24px;align-items:start}
.rx-k{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600}
.rx-v{font-size:22px;font-weight:800;line-height:1.2;letter-spacing:-.02em;display:block;padding-top:1px;white-space:nowrap}
.rx-v small{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.chip{display:inline-flex;align-items:center;font-size:13px;font-weight:600;line-height:1.3;padding:5px 11px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);margin-top:4px}
.chip.l1{color:var(--rest);background:var(--rest-soft)}
.chip.l2{color:var(--warn);background:var(--warn-soft)}
.chip.l3{color:var(--muscle);background:var(--muscle-soft)}
.flag-line{order:4;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:14px;padding:10px 12px}
.flag-line svg{width:18px;height:18px;margin-top:1px}
.sets{order:4;display:grid;gap:6px}
.sets-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.prev-line{font-size:13px;color:var(--ink-2)}
.setp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 14px;border-radius:16px;border:0;background:var(--surface-2);text-align:start}
.setp .n{font-size:13px;font-weight:600;color:var(--ink-2);min-width:38px}
.setp .v{font-size:19px;font-weight:800;line-height:1.1;letter-spacing:-.02em;direction:ltr;text-align:right}

/* dock: log a set, then rest */
.dock{position:fixed;z-index:40;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 96%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-radius:28px 28px 0 0;box-shadow:0 0 0 1px var(--line),0 -18px 40px -26px rgb(0 0 0 / .4)}

.step,.rstep{width:44px;height:52px;flex:none;border:0;border-radius:16px;background:none;color:var(--ink);font-size:27px;font-weight:400;line-height:1;display:grid;place-items:center;padding:0}
.dk-kg,.dk-reps{flex:1;min-width:0;height:100%;display:grid;align-content:center;justify-items:center}

.dk-kg.ghost b,.dk-reps.ghost b{color:var(--ink-2)}
.num input{width:100%;height:46px;border:0;border-radius:12px;background:var(--surface);text-align:center;font-size:24px;font-weight:800;direction:ltr;outline:2px solid var(--accent);padding:0}
.dk-lbl{display:flex;align-items:center;justify-content:center;gap:6px;min-height:20px;font-size:13px;color:var(--ink-3);font-weight:500;text-align:center}

.hit{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:20px;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700;transition:transform .08s,background .15s}

.dk-row{display:flex;gap:10px;align-items:center}

/* sheets: summary, editor, swap, mesocycle */
.sheet{position:fixed;inset:0;z-index:70;display:grid;place-items:end center;background:rgb(8 10 14 / .45);padding-top:calc(24px + env(safe-area-inset-top,0px))}
.sheet-in{width:min(520px,100%);max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:28px 28px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}

.ed-h{display:flex;align-items:flex-start;gap:10px}

/* English name of every movement: swap options carry their own, plan movements take the name of their first slot */
const EN = {};
for (const w of PLAN) for (const e of w.ex) if (!EN[e.a]) EN[e.a] = e.name;
for (const k of Object.keys(LIB)) if (LIB[k].en) EN[k] = LIB[k].en;
const animOf = (mv) => LIB[mv].an || mv;

/* ================================================================== progression engine (pure functions, no page state) */
const e1rm = (kg, reps) => kg * (1 + reps / 30);
function repRange(e) { const p = String(e.reps).split('–').map((x) => parseInt(x, 10)); return [p[0], p[p.length - 1]]; }
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
/* round a weight to what the equipment can really be loaded with; dir -1 rounds down, 1 up, 0 to the nearest step */
function roundTo(kg, inc, dir) {
  const q = kg / inc, n = dir < 0 ? Math.floor(q + 1e-9) : dir > 0 ? Math.ceil(q - 1e-9) : Math.round(q);
  return Math.max(0, Math.round(n * inc * 100) / 100);
}
/* reps in reserve asked for in a given week: the last hard week goes to failure, each week before it leaves one more rep (three at most); the final week is a deload */
function rirFor(wk, weeks) { return wk >= weeks ? 4 : Math.min(3, Math.max(0, weeks - 1 - wk)); }
/* one number for how strong a set was. Loaded lifts: estimated one-rep max. Assisted lifts: less help is better, a rep is worth about 2.5 kg. Bodyweight: reps */
function score(L, kg, reps) {
  if (L && L.inv) return 200 + (reps || 0) * 2.5 - (kg || 0);
  return kg != null && kg > 0 ? e1rm(kg, reps || 0) : reps || 0;
}

/* The target for one set, from the same set the last time this movement was trained.
   ref: { kg, reps, rir } where rir is the reps in reserve that workout asked for (null when unknown).
   o: { lo, hi, inc, rir, sore, dl, inv }. Returns { kg, reps, mode } with mode:
   reps = same weight, more reps · weight = top of the range was reached, the load goes up · hold = repeat it
   base = start of a mesocycle, further from failure · deload */
function nextTarget(ref, o) {
  if (!ref || ref.reps == null) return null;
  const lo = o.lo, hi = o.hi, inc = o.inc || 2.5, load = ref.kg != null && ref.kg > 0;
  if (o.dl) {
    if (!load) return { kg: ref.kg == null ? null : ref.kg, reps: Math.max(1, Math.round(ref.reps * 0.6)), mode: 'deload' };
    return { kg: o.inv ? roundTo(ref.kg * 1.15, inc, 1) : roundTo(ref.kg * 0.85, inc, -1), reps: clamp(ref.reps, Math.min(lo, ref.reps), hi), mode: 'deload' };
  }
  /* one step closer to failure than last time is worth one rep; the same distance still asks for one more; a new mesocycle starts further away and asks for fewer */
  const step = ref.rir == null ? 1 : ref.rir - o.rir;
  const raw = ref.reps + (step >= 0 ? Math.max(1, step) : step) - (o.sore ? 1 : 0);
  const modeOf = (r) => (r > ref.reps ? 'reps' : r === ref.reps ? 'hold' : 'base');
  if (!load) return { kg: ref.kg == null ? null : ref.kg, reps: Math.max(1, raw), mode: modeOf(raw) };
  if (raw > hi) {
    const up = o.inv ? roundTo(Math.max(0, ref.kg - inc), inc, 0) : roundTo(ref.kg + inc, inc, 0);
    const pred = o.inv ? Math.floor(raw - inc / 2.5) : Math.floor((e1rm(ref.kg, raw) / up - 1) * 30 + 1e-6);
    if (up !== ref.kg && pred >= lo) return { kg: up, reps: Math.min(pred, hi), mode: 'weight' };
    return { kg: ref.kg, reps: raw, mode: 'reps' };   /* the next jump is too big for this lift: keep adding reps first */
  }
  if (raw < lo) {
    /* too few reps to stay in the range at this load: bring the load down so the set lands inside it */
    if (o.inv) return { kg: roundTo(ref.kg + (lo - raw) * 2.5, inc, 1), reps: lo, mode: 'base' };
    const e = e1rm(ref.kg, Math.max(1, raw)), down = roundTo(e / (1 + lo / 30), inc, -1);
    if (down <= 0 || down >= ref.kg) return { kg: ref.kg, reps: lo, mode: 'base' };
    return { kg: down, reps: clamp(Math.floor((e / down - 1) * 30 + 1e-6), lo, hi), mode: 'base' };
  }

function msgHTML(m, idx) {

function loggedHTML(m, idx) {

const SUGS = ['המכשיר תפוס. מה אפשר לעשות במקום?', 'צילמתי מכשיר אחר. הוא מתאים כתחליף?', 'תן לי דגשי ביצוע לתרגיל הזה', 'כמה משקל כדאי לי לשים היום?'];
function renderMsgs() {

function setBusy(on) { chat.busy = on; const b = $('#sendBtn'); b.innerHTML = on ? ICON.stop : ICON.send; b.setAttribute('aria-label', on ? 'עצור' : 'שלח'); }
function compNote(t) { const n = $('#compNote'); n.textContent = t || ''; n.hidden = !t; }

}
async function pickImage(file) {
  if (!file) return;

    let src = null;
    if (window.createImageBitmap) { try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { src = null; } }
    if (!src) src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });

}
/* what the page knows, sent with each question: the open workout, the exercise in question and its recent log */
function ctxLine() {
  const id = $('#chatCtx').value, e = id && findEx(id);
  let t = '[הקשר מהאפליקציה. האימון הפתוח כרגע: אימון ' + (S.tab + 1) + ' · ' + PLAN[S.tab].name + '.';
  if (e) {
    const w = wkOf(id);
    const cur = live(w), rir = rirOf(e, cur), fu = firstUndone(cur, e), T = fu >= 0 ? targetOf(e, fu, cur) : null, pe = planEx(id);
    t += ' השאלה מתייחסת לתרגיל [' + e.id + '] "' + e.name + '" (אימון ' + (w + 1) + '): ' + e.n0 + ' סטים × ' + e.reps + (e.suf ? ' ' + e.suf : '') + ' חזרות, מנוחה ' + restPlain(e) + (rir == null ? '' : ', ' + rirText(rir)) + '.';
    if (T) t += ' היעד לסט הבא (סט ' + (fu + 1) + '): ' + fmtRow(T) + '.';

    if (hist.length) t += ' ביצועים אחרונים (ק״ג×חזרות): ' + hist.map((s) => (s.end ? ago(s.ts) : 'באימון הנוכחי') + ': ' + rowsOf(s, id).filter(isDone).map(fmtRow).join(', ')).join(' | ') + '.';

}
/* a reply may carry one "@@LOG {...}" line: sets to write into today's log */
function applyLog(text) {
  const m = text.match(/^[ \t]*@@LOG\s*(\{.*\})\s*$/m); if (!m) return null;
  let o; try { o = JSON.parse(m[1]); } catch (e) { return null; }

  }

}
function undoLog(i) {
  const m = chat.msgs[i], e = m && m.logged && findEx(m.logged.ex); if (!e || m.logged.undone) return;
  for (const k of m.logged.idx) clearRow(e, k);

}
async function sendChat(preset) {

function showImgBtns() { $('#camBtn').hidden = $('#galBtn').hidden = !chat.canImg; }
/* the exercise picker follows the plan as it stands (swapped movements show under their own name) */
function fillCtx() {

function initChat() {

/* ================================================================== boot */
let booted = false;
