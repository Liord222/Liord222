<div class="app" id="app" dir="rtl" lang="he" data-view="home">
  <header class="wrap brand">
    <button class="back" id="backBtn" type="button" aria-label="חזרה למסך הראשי"><span class="ib">חזרה</span></button>
    <div class="logo" role="img" aria-label="gymi by Lior Dahan">
      <span class="logo-w" aria-hidden="true">gym<span class="logo-i">i</span></span>
      <small aria-hidden="true">by Lior Dahan</small>
    </div>
    <div class="wk-title" id="wkTitle"></div>
    <span class="sync" id="syncNote"></span>
    <button class="top-list" id="listBtn" type="button" aria-label="כל התרגילים"><span class="ib">רשימה</span></button>
    <nav class="tabbar" id="tabbar" aria-label="ניווט ראשי">
      <button type="button" data-view="home" aria-current="page"><span class="tb-ic" aria-hidden="true"><svg viewBox="0 0 28 28"><rect x="7" y="12.3" width="14" height="3.4" rx="1.2" fill="#C9CEDA" stroke="#1B1035" stroke-width="1.8" stroke-linejoin="round"/><rect x="2" y="9" width="4" height="10" rx="1.6" fill="#8B4DF0" stroke="#1B1035" stroke-width="1.8" stroke-linejoin="round"/><rect x="5.2" y="6.5" width="4" height="15" rx="1.6" fill="#8B4DF0" stroke="#1B1035" stroke-width="1.8" stroke-linejoin="round"/><rect x="18.8" y="6.5" width="4" height="15" rx="1.6" fill="#8B4DF0" stroke="#1B1035" stroke-width="1.8" stroke-linejoin="round"/><rect x="22" y="9" width="4" height="10" rx="1.6" fill="#8B4DF0" stroke="#1B1035" stroke-width="1.8" stroke-linejoin="round"/><path d="M6.4 8.6V12" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".7"/></svg></span><span class="tb-l">אימונים</span></button>
      <button type="button" data-view="journey"><span class="tb-ic" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M3 25L11 11L15 17L18.5 12.5L25 25Z" fill="#6FD8FF" stroke="#1B1035" stroke-width="1.8" stroke-linejoin="round"/><path d="M11 11L13.2 14.6L11.6 15.6L9.6 13.4Z" fill="#fff"/><path d="M11 11V2.5" stroke="#1B1035" stroke-width="1.8" stroke-linecap="round"/><path d="M11 3H18L16.2 5.3L18 7.6H11Z" fill="#FFC83D" stroke="#1B1035" stroke-width="1.8" stroke-linejoin="round"/></svg></span><span class="tb-l">מסע</span></button>
      <button type="button" data-view="profile"><span class="tb-ic tb-face" id="tbMe" aria-hidden="true"></span><span class="tb-l">פרופיל</span></button>
      <button type="button" id="chatOpen"><span class="tb-ic tb-face" id="tbCoach" aria-hidden="true"></span><span class="tb-l">אילון</span></button>
    </nav>
  </header>

  <div class="wrap cols">
    <main class="main">
      <div class="view v-home" id="home"></div>

      <div class="view v-workout">
        <div class="wk-bar" id="wkBar"></div>
        <section class="hero" id="hero"></section>
        <section id="pre" aria-label="התאוששות מהאימון הקודם" hidden></section>
        <ol class="fx" id="exList"></ol>
      </div>

      <div class="view v-journey" id="journey"></div>

      <div class="view v-profile">
        <div class="pf-main" id="profile"></div>
        <section class="history" id="history"></section>
        <p class="cap" id="progCap" hidden></p><section class="gains" id="gains" hidden></section>
      </div>


    </main>

    <aside class="chat" id="chat" aria-label="צ׳אט עם אילון">
      <div class="chat-h">
        <span class="ava" aria-hidden="true"></span>
        <div><h2>אילון</h2><p>המאמן שלך</p></div>
        <button class="icon-btn" id="chatKey" type="button" aria-label="החיבור של אילון" title="החיבור של אילון" hidden><span class="ib">חיבור</span></button>
        <button class="icon-btn" id="chatNew" type="button" aria-label="שיחה חדשה" title="שיחה חדשה" hidden><span class="ib">חדשה</span></button>
        <button class="icon-btn chat-close" id="chatClose" type="button" aria-label="סגור את הצ׳אט"><span class="ib">סגור</span></button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <label class="chat-ctx" for="chatCtx"><span>על</span><select id="chatCtx"></select></label>
        <div class="attach" id="attach" hidden><img id="attachImg" alt="התמונה שצורפה"><span>תישלח עם ההודעה</span><button type="button" id="attachX" aria-label="הסר את התמונה"><span class="ib">הסר</span></button></div>
        <p class="comp-note" id="compNote" hidden></p>
        <div class="comp-row">
          <button class="icon-btn" id="camBtn" type="button" aria-label="צלם את המכשיר" title="צלם את המכשיר" hidden><span class="ib">מצלמה</span></button>
          <button class="icon-btn" id="galBtn" type="button" aria-label="בחר תמונה מהגלריה" title="בחר תמונה מהגלריה" hidden><span class="ib">תמונה</span></button>
          <textarea id="chatInput" rows="1" maxlength="500" placeholder="שאל את אילון" enterkeyhint="send" aria-label="הודעה לאילון"></textarea>
          <button class="icon-btn send" id="sendBtn" type="button" aria-label="שלח"><span class="ib">שלח</span></button>
        </div>
        <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
        <input type="file" id="galFile" accept="image/*" hidden>
      </div>
    </aside>
  </div>

  <div class="dock" id="dock" role="region" aria-label="רישום סטים וטיימר מנוחה"></div>
  <div class="sheet" id="sheet" hidden></div>
  <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  <input type="file" id="lkFile" accept="image/*" hidden>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="sr" id="srSay" aria-live="polite"></div>
  <div class="xi" id="exIntro" hidden></div>
  <div class="tour" id="tour" role="dialog" aria-modal="true" hidden></div>
  <div class="ob" id="ob" role="dialog" aria-modal="true" aria-labelledby="obTitle" hidden></div>
  <div class="splash" id="splash" hidden><div class="splash-in" role="img" aria-label="gymi by Lior Dahan"><span class="logo-w" aria-hidden="true">gym<span class="logo-i">i</span></span><small aria-hidden="true">by Lior Dahan</small></div></div>
</div>
