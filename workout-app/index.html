<title>gymi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* Layout: the workout is a playlist. Tabs pick one of four workouts, the list is the queue of exercises,
   each row opens into a blueprint stage with an animated person, and a dock at the bottom of the screen is the
   transport: one tap on the number of reps logs the set and starts the rest timer. The coach chat docks beside
   the list on wide screens and is a full sheet on phones. */
:root{
  --paper:#EEF2F9; --surface:#FFFFFF; --surface-2:#F4F6FB; --ink:#0F1A32; --ink-2:#4B5A77; --ink-3:#8290AA; --line:#D8DFEC;
  --accent:#2152E0; --on-accent:#FFFFFF; --accent-soft:#E3EAFF;
  --muscle:#DB2A47; --muscle-soft:#FCE3E8; --warn:#B4531A; --warn-soft:#FBE8DB;
  --ok:#0D8259; --ok-soft:#D9F2E7; --on-ok:#FFFFFF; --rest:#99590A; --rest-soft:#FFEFCF; --rest-inv:#FFB648; --ok-inv:#55DCAB;
  --stage:#F7F9FE; --grid:#E8EDF7; --grid-2:#D7DFEE; --floor:#E9EEF7; --ground:#9AA8C0; --shadow:#D9E0EC;
  --fig:#62738F; --fig-hi:#8C9CB8; --fig-lo:#46577A; --fig-far:#B4BFD3; --cloth:#2152E0; --cloth-far:#93A9EC;
  --shoe:#1A2742; --shoe-far:#8693AE; --sole:#F2F5FB; --hair:#1A2742;
  --equip:#C9D1E0; --equip-hi:#EEF2F9; --equip-2:#7F8DA8; --pad:#2B3852; --pad-hi:#5A6A8E; --plate:#2B3852; --plate-hi:#7F8DA8; --cable:#5F6E8B;
  --f-display:"Karantina","Arial Narrow","Arial Hebrew",sans-serif;
  --f-body:"IBM Plex Sans Hebrew","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --r:16px; --lift:0 1px 0 rgb(15 26 50 / .04),0 12px 28px -20px rgb(15 26 50 / .28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#080E1B; --surface:#111A2D; --surface-2:#172238; --ink:#EAF0FB; --ink-2:#A7B5CF; --ink-3:#7585A2; --line:#24314C;
    --accent:#8DAEFF; --on-accent:#081230; --accent-soft:#1A294E;
    --muscle:#FF5C70; --muscle-soft:#3A1620; --warn:#FF9A5C; --warn-soft:#38200F;
    --ok:#46D19E; --ok-soft:#113528; --on-ok:#06231A; --rest:#FFB648; --rest-soft:#38290B; --rest-inv:#99590A; --ok-inv:#0D8259;
    --stage:#0E182B; --grid:#152039; --grid-2:#1D2B49; --floor:#121E35; --ground:#4A5B7C; --shadow:#0A1222;
    --fig:#B5C2DC; --fig-hi:#DCE4F5; --fig-lo:#8C9BBA; --fig-far:#4F5F80; --cloth:#6E93FF; --cloth-far:#33467A;
    --shoe:#62739A; --shoe-far:#3A4868; --sole:#D6DFF2; --hair:#62739A;
    --equip:#3A4A6B; --equip-hi:#5C6F96; --equip-2:#6B7CA1; --pad:#52648A; --pad-hi:#8497C0; --plate:#52648A; --plate-hi:#93A5CC; --cable:#8090AE;
    --lift:0 1px 0 rgb(255 255 255 / .03),0 14px 30px -20px rgb(0 0 0 / .8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#080E1B; --surface:#111A2D; --surface-2:#172238; --ink:#EAF0FB; --ink-2:#A7B5CF; --ink-3:#7585A2; --line:#24314C;
  --accent:#8DAEFF; --on-accent:#081230; --accent-soft:#1A294E;
  --muscle:#FF5C70; --muscle-soft:#3A1620; --warn:#FF9A5C; --warn-soft:#38200F;
  --ok:#46D19E; --ok-soft:#113528; --on-ok:#06231A; --rest:#FFB648; --rest-soft:#38290B; --rest-inv:#99590A; --ok-inv:#0D8259;
  --stage:#0E182B; --grid:#152039; --grid-2:#1D2B49; --floor:#121E35; --ground:#4A5B7C; --shadow:#0A1222;
  --fig:#B5C2DC; --fig-hi:#DCE4F5; --fig-lo:#8C9BBA; --fig-far:#4F5F80; --cloth:#6E93FF; --cloth-far:#33467A;
  --shoe:#62739A; --shoe-far:#3A4868; --sole:#D6DFF2; --hair:#62739A;
  --equip:#3A4A6B; --equip-hi:#5C6F96; --equip-2:#6B7CA1; --pad:#52648A; --pad-hi:#8497C0; --plate:#52648A; --plate-hi:#93A5CC; --cable:#8090AE;
  --lift:0 1px 0 rgb(255 255 255 / .03),0 14px 30px -20px rgb(0 0 0 / .8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
bdi{unicode-bidi:isolate;white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{direction:rtl}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* brand */
.brand{display:flex;align-items:center;gap:12px;padding-block:14px 8px}
.logo{display:grid;direction:ltr;justify-items:start;line-height:1}
.logo-w{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:.78;letter-spacing:.01em;color:var(--ink)}
.logo-i{background:linear-gradient(to bottom,var(--accent) 0 39%,var(--ink) 39%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.logo small{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding-top:5px}
.sync{flex:1;min-width:0;font-size:11.5px;color:var(--ink-3);text-align:end;line-height:1.3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.big{min-height:54px;font-size:17px;width:100%;border-radius:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled),.chip-r:active,.step:active,.setp:active,.hit:active,.seg button:active{transform:scale(.97)}
.link{background:none;border:0;padding:8px 4px;color:var(--ink-2);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.ava{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1;flex:none}
.coach-btn{flex:none;padding:0 14px 0 8px;border-radius:99px}

/* tabs */
.tabs-band{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-block:10px 8px}
.tab{position:relative;display:grid;justify-items:start;padding:7px 9px 6px;border:1px solid var(--line);border-radius:13px;background:var(--surface);text-align:start;min-width:0}
.tab small{font-size:11px;color:var(--ink-3);font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab b{font-family:var(--f-display);font-weight:700;font-size:25px;line-height:.95;direction:ltr;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] small{color:color-mix(in srgb,var(--paper) 68%,transparent)}
.flag{position:absolute;top:-8px;inset-inline-end:6px;font-size:10px;font-weight:700;line-height:1.5;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.flag.live{background:var(--ok);color:var(--on-ok)}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start;padding-bottom:310px}
.main{min-width:0;display:grid;gap:14px}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:end;padding:22px 0 6px;isolation:isolate}
.hero::before{content:"";position:absolute;z-index:-1;inset:0 -16px 0 -16px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:22px 22px;opacity:.55;-webkit-mask-image:linear-gradient(to bottom,#000 10%,transparent 92%);mask-image:linear-gradient(to bottom,#000 10%,transparent 92%)}
.kicker{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(60px,17vw,92px);line-height:.78;direction:ltr;text-align:right;padding-top:6px}
.meta{color:var(--ink-2);font-size:14px;padding-top:8px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:var(--line)}
.ring .pr{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;line-height:1}
.ring b{font-family:var(--f-display);font-size:27px;font-weight:700;direction:ltr}
.ring span{font-size:10.5px;color:var(--ink-3);font-weight:600;padding-top:2px}
.banner{grid-column:1/-1;background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.banner b{color:var(--ok)}
.banner p{flex:1;min-width:0}
.banner button{background:none;border:0;color:var(--ink-2);padding:2px}

/* exercise queue */
.ex-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px);box-shadow:var(--lift)}
.ex.open{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.ex-head{display:grid;grid-template-columns:30px 68px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;border:0;text-align:start}
.ex-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line)}
.ex.cur .ex-n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ex.done .ex-n{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.ex.done .ex-n svg{width:16px;height:16px;stroke-width:3}
.ex-thumb{width:68px;height:49px;border-radius:9px;background:var(--stage);border:1px solid var(--line);display:block}
.ex-title{min-width:0;display:grid}
.ex-name{font-weight:600;font-size:15.5px;line-height:1.25;direction:ltr;text-align:right;unicode-bidi:isolate}
.ex-sub{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.ex-side{display:grid;justify-items:end;gap:6px}
.ex-rx{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:.9;white-space:nowrap}
.pips{display:flex;gap:3px;direction:ltr}
.pips i{width:13px;height:5px;border-radius:99px;background:var(--line)}
.pips i.on{background:var(--ok)}

.ex-body{border-top:1px solid var(--line);padding:12px;display:grid;gap:14px}
.ex-a,.ex-b{display:contents}
.stage-wrap{order:1;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--stage)}
.stage{display:block;width:100%;max-width:100%;aspect-ratio:360/260}
.stage-tag,.stage-phase{position:absolute;inset-inline-start:8px;font-size:11.5px;font-weight:600;line-height:1.7;padding:0 9px;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink-2)}
.stage-tag{top:8px}
.stage-phase{bottom:12px;transition:color .2s,border-color .2s}
.stage-phase.hot{color:var(--muscle);border-color:color-mix(in srgb,var(--muscle) 40%,transparent)}
.stage-ctl{position:absolute;top:6px;inset-inline-end:6px;display:flex;gap:6px}
.stage-ctl button{min-width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);display:grid;place-items:center;color:var(--ink-2);font-weight:700;font-size:13px;padding:0 6px}
.stage-ctl button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.tempo{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line);direction:ltr}
.tempo i{display:block;height:100%;background:var(--muscle);transform-origin:left;transform:scaleX(0)}
.rx-row{order:2;display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:10px 22px;align-items:end}
.rx-k{display:block;font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.03em}
.rx-v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:.9;display:block;padding-top:3px}
.rx-v small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;line-height:1.3;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);margin-top:4px}
.chip.l1{color:var(--rest);background:var(--rest-soft);border-color:transparent}
.chip.l2{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.l3{color:var(--muscle);background:var(--muscle-soft);border-color:transparent}
.how{order:3;display:grid;gap:8px}
.muscles{font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.muscles i{width:10px;height:10px;border-radius:50%;background:var(--muscle);flex:none;transform:translateY(1px)}
.cues{list-style:none;margin:0;padding:0;display:grid;gap:5px;color:var(--ink-2);font-size:14px}
.cues li{padding-inline-start:16px;position:relative}
.cues li::before{content:"";position:absolute;inset-inline-start:2px;top:.62em;width:7px;height:2px;background:var(--ink-3);border-radius:2px}
.sets{order:4;display:grid;gap:6px}
.sets-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--ink-3);font-weight:600}
.setp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:start}
.setp .n{font-size:12.5px;font-weight:700;color:var(--ink-2);min-width:36px}
.setp .v{font-family:var(--f-display);font-size:27px;font-weight:700;line-height:1;direction:ltr;text-align:right}
.setp .v small{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--ink-3)}
.setp .hint{font-size:13px;color:var(--ink-3);font-weight:500}
.setp .hint em{font-style:normal;color:var(--muscle);font-weight:700}
.setp .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink-3);color:transparent}
.setp .st svg{width:15px;height:15px;stroke-width:3}
.setp.done{background:var(--ok-soft);border-color:transparent}
.setp.done .st{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.setp.cur{border-color:var(--accent);background:var(--accent-soft)}
.setp.cur .st{border-color:var(--accent)}
.setp .pr{font-size:11px;font-weight:700;color:var(--rest);background:var(--rest-soft);border-radius:99px;padding:1px 7px;margin-inline-start:6px;font-family:var(--f-body)}
.same{justify-self:start;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:transparent;min-height:40px;font-size:13.5px}
.trend{order:6;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
.trend .k{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.03em}
.trend .val{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1;direction:ltr;text-align:right}
.trend .val small{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--ink-3)}
.trend .d{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.trend .d.up{color:var(--ok)}
.trend .d.dn{color:var(--warn)}
.trend svg{grid-row:1/4;grid-column:2;width:118px;height:44px;overflow:visible;direction:ltr}
.trend p{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.ask{width:100%;border-style:dashed;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:transparent}

.history{display:grid;gap:8px;padding-top:14px}
.history h2{font-family:var(--f-display);font-size:32px;line-height:1}
.history ul{list-style:none;margin:0;padding:0;display:grid}
.history li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.h-t{font-weight:600}
.h-s{grid-column:1;color:var(--ink-2);font-size:13px}
.h-act{grid-column:2;grid-row:1/3;display:flex;gap:4px}
.h-act .link{min-height:40px;padding:0 8px;font-size:13.5px}
.h-act [data-del],.h-act [data-delyes]{color:var(--muscle)}
.btn.danger{color:var(--muscle);border-color:color-mix(in srgb,var(--muscle) 40%,var(--line))}
/* workout editor (inside the sheet) */
.sheet-in{max-height:100%;overflow-y:auto;overscroll-behavior:contain}
.ed-h{display:flex;align-items:flex-start;gap:10px}
.ed-h div{flex:1;min-width:0}
.ed-date{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2);font-weight:600}
.ed-date input{flex:1;min-width:0;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px;font-size:16px}
.ed-note{font-size:13px}
.ed-list{display:grid;gap:14px}
.ed-ex{display:grid;gap:6px}
.ed-ex h3{font-size:14.5px;font-weight:700;direction:ltr;text-align:right}
.ed-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto minmax(0,1fr) 40px;gap:6px;align-items:center}
.ed-row>span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.ed-f{position:relative;display:block;min-width:0}
.ed-f input{width:100%;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);padding:0 30px 0 6px;font-size:17px;font-weight:600;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.ed-f span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-3);pointer-events:none}
.ed-row.on .ed-f input{background:var(--ok-soft);border-color:transparent}
.ed-clr{width:40px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-3)}
.ed-clr svg{width:16px;height:16px}
.ed-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;bottom:-18px;background:var(--surface);padding-block:10px 18px;margin-bottom:-18px;border-top:1px solid var(--line)}
.ed-act .btn.primary{margin-inline-start:auto}
.history p{font-size:13.5px;color:var(--ink-2)}
.hist-act{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.credit{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding-top:18px;direction:ltr}

/* dock: the transport bar */
.dock{position:fixed;z-index:40;left:0;right:0;bottom:0;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 93%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--line);box-shadow:0 -14px 34px -22px rgb(0 0 0 / .45)}
.dock-in{max-width:640px;margin-inline:auto;display:grid;gap:9px}
.dock.rest{background:var(--ink);color:var(--paper);border-top-color:transparent}
.dk-top{display:flex;align-items:center;gap:8px}
.dk-go{flex:1;min-width:0;display:grid;background:none;border:0;padding:0;text-align:start}
.dk-name{font-weight:700;font-size:15px;line-height:1.25;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-set{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-set b{color:var(--accent)}
.dk-ic{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.dk-ic .ava{width:30px;height:30px}
.dk-ic.coach{border:0;background:none}
.dk-w{display:flex;align-items:center;gap:8px}
.dk-lbl{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.step{width:52px;height:46px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:600;line-height:1;display:grid;place-items:center}
.dk-kg{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:baseline;justify-content:center;gap:5px;padding:0 8px}
.dk-kg b{font-family:var(--f-display);font-size:36px;font-weight:700;line-height:44px;font-variant-numeric:tabular-nums}
.dk-kg small{font-size:12px;color:var(--ink-3);font-weight:600}
.dk-kg input,.reps-in input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-family:var(--f-display);font-size:34px;font-weight:700;direction:ltr;outline:none}
.dk-r{display:grid;gap:6px;min-width:0}
.dk-r .dk-lbl b{color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;direction:ltr;padding:2px 1px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip-r{position:relative;flex:none;width:50px;height:52px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;color:var(--ink-3);scroll-snap-align:center;transition:transform .08s,background .15s}
.chip-r.in{background:var(--surface);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.chip-r.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip-r.hit-on{background:var(--ok);border-color:var(--ok);color:var(--on-ok);transform:scale(1.1)}
.chip-r.more{font-family:var(--f-body);font-size:13px;font-weight:700;width:auto;padding:0 12px;color:var(--ink-2)}
.reps-in{display:flex;gap:8px}
.reps-in span{flex:1;height:50px;border-radius:12px;border:1px solid var(--accent);background:var(--surface)}
.dk-row{display:flex;gap:8px;align-items:center}
.dk-msg{flex:1;min-width:0;font-size:14.5px;font-weight:600}
.dk-msg small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.dock.mini .dk-w,.dock.mini .dk-r{display:none}
/* rest */
.rt{display:flex;align-items:center;gap:12px}
.rt-time{font-family:var(--f-display);font-size:60px;font-weight:700;line-height:.8;font-variant-numeric:tabular-nums;direction:ltr;min-width:92px;text-align:center}
.rt-mid{flex:1;min-width:0;display:grid;gap:5px}
.rt-state{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-state b{color:var(--rest-inv)}
.dock.ready .rt-state b,.dock.go .rt-state b{color:var(--ok-inv)}
.rt-track{height:5px;border-radius:99px;background:color-mix(in srgb,var(--paper) 22%,transparent);position:relative;overflow:hidden;direction:ltr}
.rt-track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--rest-inv);border-radius:99px}
.dock.ready .rt-track i,.dock.go .rt-track i{background:var(--ok-inv)}
.rt-log{font-size:12.5px;color:color-mix(in srgb,var(--paper) 72%,transparent);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rt-log .pr{color:var(--ink);background:var(--rest-inv);border-radius:99px;padding:0 8px;font-weight:700}
.dock.rest .link{color:var(--paper);padding:2px}
.rt-btns{display:flex;gap:6px}
.rt-btns button{min-width:46px;height:46px;border-radius:12px;border:1px solid color-mix(in srgb,var(--paper) 30%,transparent);background:transparent;color:var(--paper);font-weight:700;font-size:13.5px;padding:0 10px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rt-btns .go{background:var(--paper);color:var(--ink);border-color:var(--paper)}
@media (max-width:430px){.rt-btns .opt{display:none}.rt-time{font-size:52px;min-width:80px}}

/* chat */
.chat{flex-direction:column;background:var(--surface);min-height:0}
.chat-h{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.chat-h .ava{width:40px;height:40px;font-size:20px}
.chat-h div{flex:1;min-width:0}
.chat-h h2{font-family:var(--f-display);font-size:32px;line-height:.9}
.chat-h p{font-size:12.5px;color:var(--ink-2)}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn.send{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chat-ctx{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.chat-ctx select{flex:1;min-width:0;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);padding:0 8px;font-size:14px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.empty{margin:auto 0;display:grid;gap:12px;color:var(--ink-2);font-size:14px}
.empty strong{color:var(--ink);font-size:15.5px}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sug{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 13px;font-size:13.5px;text-align:start;line-height:1.3}
.msg{max-width:90%;padding:9px 12px;border-radius:15px;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-end-end-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-end-start-radius:4px}
.msg img{display:block;max-width:170px;max-height:170px;border-radius:9px;margin-bottom:6px}
.msg p{margin:0 0 6px}.msg p:last-child{margin-bottom:0}
.msg ul{margin:0 0 6px;padding-inline-start:18px}
.msg .note{display:block;font-size:12px;color:var(--ink-3);margin-top:6px}
.msg.u .note{color:inherit;opacity:.78}
.msg .think{color:var(--ink-3)}
.msg .logged{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ok)}
.msg .logged button{color:var(--ink-2)}
.verdict{display:inline-block;font-weight:700;font-size:13px;padding:1px 10px;border-radius:99px;margin-bottom:6px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.mid{background:var(--rest-soft);color:var(--rest)}
.verdict.no{background:var(--muscle-soft);color:var(--muscle)}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.attach{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.attach img{width:48px;height:48px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.attach span{flex:1}
.attach button{background:none;border:0;color:var(--ink-2);padding:6px}
.comp-note{font-size:12.5px;color:var(--warn)}
.comp-row{display:flex;gap:6px;align-items:flex-end;min-width:0}
.comp-row textarea{flex:1;min-width:0;width:0;height:44px;max-height:120px;resize:none;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:10px 12px;font-size:16px;line-height:1.4}

/* finish sheet */
.sheet{position:fixed;inset:0;z-index:70;display:grid;place-items:end center;background:rgb(5 10 22 / .55);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{width:min(460px,100%);background:var(--surface);border-radius:22px;padding:22px 18px 18px;display:grid;gap:14px;box-shadow:0 30px 80px -20px rgb(0 0 0 / .6)}
.sheet h2{font-family:var(--f-display);font-size:44px;line-height:.85}
.sheet h2 bdi{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px;display:grid;gap:2px}
.stats b{font-family:var(--f-display);font-size:32px;line-height:1;font-weight:700;direction:ltr;text-align:right}
.stats span{font-size:11.5px;color:var(--ink-3);font-weight:600}
.sheet p{font-size:14px;color:var(--ink-2)}

/* mesocycle chip, recovery check, targets, feedback, notes */
.meso{grid-column:1/-1;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:start;font-size:13px;color:var(--ink-2);box-shadow:var(--lift)}
.meso span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.meso b{font-size:13px;color:var(--accent);white-space:nowrap}
.meso.dl b{color:var(--ok)}
.meso svg{width:16px;height:16px;color:var(--ink-3)}
.meso em{font-style:normal;font-size:11px;font-weight:700;line-height:1.55;padding:0 7px;border-radius:99px;color:var(--warn);background:var(--warn-soft);white-space:nowrap}
.meso em::before{content:"▼ ";font-size:8px}
.fb-warn{font-size:13px;line-height:1.45;color:var(--ink-2);background:var(--warn-soft);border-radius:10px;padding:8px 10px}
.fb-warn b{color:var(--warn)}
.fb-warn .link{padding:0;font-size:inherit;font-weight:700;color:var(--ink)}
.dock.rest .fb-warn{background:color-mix(in srgb,var(--paper) 12%,transparent);color:color-mix(in srgb,var(--paper) 82%,transparent)}
.dock.rest .fb-warn b{color:var(--rest-inv)}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.warn b{color:var(--warn)}
.banner .link{padding:0 2px;color:var(--ink);font-weight:600;font-size:inherit}
#pre[hidden]{display:none}
.pre{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;box-shadow:var(--lift)}
.pre-h{display:flex;gap:10px;align-items:flex-start}
.pre-h div{flex:1;min-width:0;display:grid;gap:2px}
.pre-h b{font-size:14.5px;line-height:1.3}
.pre-h span{font-size:12.5px;color:var(--ink-2)}
.pre-h .link{flex:none;padding:2px 0;color:var(--accent);font-weight:600;white-space:nowrap}
.pre-row{display:grid;gap:5px}
.pre-row>span{font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.pre-row small{font-size:12px;font-weight:500;color:var(--ink-3)}
.pre-fx{font-size:13px;color:var(--ink-2);background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.pre.done{grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:8px 12px}
.pre.done p{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.pre.done svg{color:var(--ok);width:18px;height:18px;margin-top:1px}
.pre.done b{color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.seg button{min-height:40px;padding:4px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:600;line-height:1.2;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.fbk{display:grid;gap:6px}
.fb-row{display:grid;grid-template-columns:minmax(0,104px) minmax(0,1fr);gap:8px;align-items:center}
.fb-row>span{font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.25}
.fb-wrap{order:5;display:grid;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
.fb-wrap[hidden]{display:none}
.fb-dock{display:grid;gap:8px}
.fb-h{display:flex;align-items:center;gap:8px}
.fb-h b{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock.rest .fb-dock{border-top:1px solid color-mix(in srgb,var(--paper) 22%,transparent);padding-top:9px}
.dock.rest .fb-row>span{color:color-mix(in srgb,var(--paper) 78%,transparent)}
.dock.rest .seg button{background:transparent;border-color:color-mix(in srgb,var(--paper) 30%,transparent);color:var(--paper)}
.dock.rest .seg button[aria-pressed="true"]{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:4px;padding-top:3px}
.tagx{font-size:11px;font-weight:700;line-height:1.55;padding:0 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tagx.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.tagx.hint{color:var(--rest);background:var(--rest-soft);border-color:transparent}
.tagx.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.ex.off .ex-n{color:var(--ink-3)}
.ex.off .ex-rx{color:var(--ink-3);text-decoration:line-through}
.prev-line{font-size:12.5px;color:var(--ink-2)}
.setp .tg{font-weight:700;color:var(--ink-2)}
.goal{display:inline-block;font-family:var(--f-body);font-size:11px;font-weight:700;line-height:1.55;padding:0 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);margin-inline-start:6px;white-space:nowrap}
.goal.g-reps{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.goal.g-wt{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.goal.g-down{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.goal.g-cal{color:var(--rest);background:var(--rest-soft);border-color:transparent}
.dk-lbl .goal{margin-inline:0 6px}
.cut-note{font-size:13px;color:var(--warn);font-weight:600}
.flag-line{order:4;display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 10px}
.flag-line svg{width:18px;height:18px;margin-top:1px}
.ex-acts{order:7;display:grid;gap:8px}
.ex-acts .btn{min-width:0}
@media (min-width:420px){.ex-acts{grid-template-columns:auto minmax(0,1fr)}}
.note{display:grid;gap:5px}
.note>span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.03em}
.note>span svg{width:14px;height:14px}
.note-in{display:block;width:100%;min-height:44px;resize:vertical;border-radius:11px;border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--surface-2);padding:9px 11px;font-size:16px;line-height:1.4}
.note-in:not(:placeholder-shown){border-style:solid;background:var(--accent-soft)}
.dk-note{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);line-height:1.35}
.dk-note svg{width:14px;height:14px;margin-top:2px;color:var(--accent)}
.dk-note span{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dock.mini .dk-note{display:none}
.dk-kg.ghost{border-style:dashed}
.dk-kg.ghost b{color:var(--ink-3)}
.hit{flex:none;display:flex;align-items:center;gap:6px;height:46px;padding:0 10px;border-radius:12px;border:1px solid var(--ok);background:var(--ok);color:var(--on-ok);transition:transform .08s}
.hit svg{width:20px;height:20px;stroke-width:3}
.hit b{font-family:var(--f-display);font-size:32px;line-height:1;font-weight:700}
.hit small{font-size:10.5px;font-weight:700;line-height:1.15;text-align:start}
.hit.hit-on{transform:scale(1.06)}
.chip-r.tgt{border-color:var(--ok);border-width:2px;color:var(--ink);padding-bottom:9px}
.chip-r.tgt::after{content:"יעד";position:absolute;left:0;right:0;bottom:3px;font-family:var(--f-body);font-size:9.5px;font-weight:700;line-height:1;color:var(--ok)}
.chip-r.tgt.hit-on::after{color:inherit}
/* sheets: swap, mesocycle, summaries */
.sheet h2 small{font-family:var(--f-body);font-size:15px;font-weight:600;color:var(--ink-2)}
.sheet h3{font-size:15px;font-weight:700}
.sheet h4{font-size:13.5px;font-weight:700;margin:0;display:flex;gap:8px;align-items:baseline}
.sheet h4 small{font-size:12px;font-weight:600;color:var(--warn)}
.sheet section{display:grid;gap:8px}
.sheet .ms-sub{font-size:12.5px}
.sw h2{font-size:34px;line-height:.95}
.sw-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sw-opt{display:grid;grid-template-columns:68px minmax(0,1fr);gap:8px 10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px}
.sw-t{display:grid;gap:1px;min-width:0}
.sw-t b{direction:ltr;text-align:right;font-size:14.5px;line-height:1.25}
.sw-t>span{font-size:12.5px;color:var(--ink-2)}
.sw-b{grid-column:1/-1;display:flex;gap:8px}
.sw-b .btn{flex:1;min-height:42px}
.wk-strip{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px}
.wk-strip li{display:grid;justify-items:center;gap:1px;padding:7px 2px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);min-width:0}
.wk-strip small{font-size:10.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.wk-strip b{font-size:12px;white-space:nowrap}
.wk-strip li.cur{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.wk-strip li.cur small{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.wk-strip li.dl:not(.cur) b{color:var(--ok)}
.vol{display:grid;gap:9px}
.vol-row{display:grid;grid-template-columns:minmax(0,104px) minmax(0,1fr) 46px;gap:2px 10px;align-items:center}
.vol-n{font-size:13px;font-weight:600;line-height:1.2}
.vol-bar{position:relative;height:14px}
.vol-bar .band{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--line)}
.vol-bar .val{position:absolute;inset-inline-start:0;top:4px;height:6px;min-width:2px;border-start-end-radius:4px;border-end-end-radius:4px;background:var(--accent)}
.vol-row.under .val,.vol-row.over .val{background:var(--warn)}
.vol-v{display:grid;justify-items:end;line-height:1}
.vol-v b{font-family:var(--f-display);font-size:24px;font-weight:700}
.vol-v small{font-size:10.5px;color:var(--ink-3);font-weight:600}
.vol-flag{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--warn)}
.bl-w{display:grid;gap:6px}
.bl-row{display:flex;align-items:center;gap:10px}
.bl-n{flex:1;min-width:0;display:grid}
.bl-n b{font-size:13.5px;font-weight:600;unicode-bidi:plaintext;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl-n small{font-size:12px;color:var(--ink-2)}
.stp{display:flex;align-items:center;gap:2px;flex:none;direction:ltr}
.stp button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:600;line-height:1}
.stp button:disabled{opacity:.35;cursor:default}
.stp b{min-width:30px;text-align:center;font-family:var(--f-display);font-size:26px;line-height:1}
.inc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.inc-row{display:grid;gap:3px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.inc-row select{height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);padding:0 8px;font-size:16px}
.ms-act{position:static;margin:0;padding:10px 0 0}
.sum-list{list-style:none;margin:0;padding:0;display:grid}
.sum-list li{display:grid;gap:1px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.sum-list li>span:first-child{font-weight:700}
.sum-list li>span:last-child{color:var(--ink-2)}
.sum-list b{color:var(--ink)}
.sum-list b.up{color:var(--ok)}
.sum-list b.dn{color:var(--warn)}

@media (max-width:999.98px){
  .chat{position:fixed;inset:0;z-index:60;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .chat.open{display:flex}
}
@media (max-width:420px){.sync{display:none}}
@media (min-width:700px){
  .ex-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
  .ex-a,.ex-b{display:grid;gap:14px;min-width:0}
  .sheet{place-items:center}
}
@media (min-width:1000px){
  .cols{grid-template-columns:minmax(0,1fr) 384px}
  .chat{display:flex;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);height:calc(100vh - 180px);min-height:420px;margin-top:22px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--lift)}
  .chat-close,.coach-btn,.dk-ic.coach{display:none}
  .dock{left:auto;right:max(16px,calc((100vw - 1180px)/2 + 16px));bottom:16px;width:min(620px,calc(100vw - 448px));border:1px solid var(--line);border-radius:20px;padding:12px 14px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* English name of every movement: swap options carry their own, plan movements take the name of their first slot */
const EN = {};
for (const w of PLAN) for (const e of w.ex) if (!EN[e.a]) EN[e.a] = e.name;
for (const k of Object.keys(LIB)) if (LIB[k].en) EN[k] = LIB[k].en;
const animOf = (mv) => LIB[mv].an || mv;

/* ================================================================== progression engine (pure functions, no page state) */
const e1rm = (kg, reps) => kg * (1 + reps / 30);
function repRange(e) { const p = String(e.reps).split('–').map((x) => parseInt(x, 10)); return [p[0], p[p.length - 1]]; }
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
/* round a weight to what the equipment can really be loaded with; dir -1 rounds down, 1 up, 0 to the nearest step */
function roundTo(kg, inc, dir) {
  const q = kg / inc, n = dir < 0 ? Math.floor(q + 1e-9) : dir > 0 ? Math.ceil(q - 1e-9) : Math.round(q);
  return Math.max(0, Math.round(n * inc * 100) / 100);
}
/* reps in reserve asked for in a given week: the last hard week goes to failure, each week before it leaves one more rep (three at most); the final week is a deload */
function rirFor(wk, weeks) { return wk >= weeks ? 4 : Math.min(3, Math.max(0, weeks - 1 - wk)); }
/* one number for how strong a set was. Loaded lifts: estimated one-rep max. Assisted lifts: less help is better, a rep is worth about 2.5 kg. Bodyweight: reps */
function score(L, kg, reps) {
  if (L && L.inv) return 200 + (reps || 0) * 2.5 - (kg || 0);
  return kg != null && kg > 0 ? e1rm(kg, reps || 0) : reps || 0;
}

/* The target for one set, from the same set the last time this movement was trained.
   ref: { kg, reps, rir } where rir is the reps in reserve that workout asked for (null when unknown).
   o: { lo, hi, inc, rir, sore, dl, inv }. Returns { kg, reps, mode } with mode:
   reps = same weight, more reps · weight = top of the range was reached, the load goes up · hold = repeat it
   base = start of a mesocycle, further from failure · deload */
function nextTarget(ref, o) {
  if (!ref || ref.reps == null) return null;
  const lo = o.lo, hi = o.hi, inc = o.inc || 2.5, load = ref.kg != null && ref.kg > 0;
  if (o.dl) {
    if (!load) return { kg: ref.kg == null ? null : ref.kg, reps: Math.max(1, Math.round(ref.reps * 0.6)), mode: 'deload' };
    return { kg: o.inv ? roundTo(ref.kg * 1.15, inc, 1) : roundTo(ref.kg * 0.85, inc, -1), reps: clamp(ref.reps, Math.min(lo, ref.reps), hi), mode: 'deload' };
  }
  /* one step closer to failure than last time is worth one rep; the same distance still asks for one more; a new mesocycle starts further away and asks for fewer */
  const step = ref.rir == null ? 1 : ref.rir - o.rir;
  const raw = ref.reps + (step >= 0 ? Math.max(1, step) : step) - (o.sore ? 1 : 0);
  const modeOf = (r) => (r > ref.reps ? 'reps' : r === ref.reps ? 'hold' : 'base');
  if (!load) return { kg: ref.kg == null ? null : ref.kg, reps: Math.max(1, raw), mode: modeOf(raw) };
  if (raw > hi) {
    const up = o.inv ? roundTo(Math.max(0, ref.kg - inc), inc, 0) : roundTo(ref.kg + inc, inc, 0);
    const pred = o.inv ? Math.floor(raw - inc / 2.5) : Math.floor((e1rm(ref.kg, raw) / up - 1) * 30 + 1e-6);
    if (up !== ref.kg && pred >= lo) return { kg: up, reps: Math.min(pred, hi), mode: 'weight' };
    return { kg: ref.kg, reps: raw, mode: 'reps' };   /* the next jump is too big for this lift: keep adding reps first */
  }
  if (raw < lo) {
    /* too few reps to stay in the range at this load: bring the load down so the set lands inside it */
    if (o.inv) return { kg: roundTo(ref.kg + (lo - raw) * 2.5, inc, 1), reps: lo, mode: 'base' };
    const e = e1rm(ref.kg, Math.max(1, raw)), down = roundTo(e / (1 + lo / 30), inc, -1);
    if (down <= 0 || down >= ref.kg) return { kg: ref.kg, reps: lo, mode: 'base' };
    return { kg: down, reps: clamp(Math.floor((e / down - 1) * 30 + 1e-6), lo, hi), mode: 'base' };
  }
  return { kg: ref.kg, reps: raw, mode: modeOf(raw) };
}

/* Re-aim a later set after seeing the previous set done today.
   T: the planned target for this set (or null). last: { kg, reps, tk, tr } with the target that set had.

function adjustTarget(T, last, o) {
  if (!last || last.reps == null) return T;
  const lo = o.lo, hi = o.hi, inc = o.inc || 2.5, rir = o.rir || 0, load = last.kg != null && last.kg > 0;
  const want = clamp(T ? T.reps : last.tr != null ? last.tr : last.reps, lo, hi);
  if (load && !o.dl && last.reps < lo) {
    const kg = o.inv ? Math.max(roundTo(last.kg * 1.1, inc, 1), roundTo(last.kg + inc, inc, 0)) : Math.min(roundTo(last.kg * 0.9, inc, -1), roundTo(Math.max(0, last.kg - inc), inc, 0));
    return { kg, reps: want, mode: 'down' };
  }
  const beat = last.tk != null && last.tr != null && (o.inv ? last.kg <= last.tk : last.kg >= last.tk) && last.reps >= last.tr + Math.max(3, Math.round(last.tr * 0.25));
  if (load && !o.dl && beat) {

    box(g, cx, cy, len, th, rot, C.pad, th / 2);

  cushion(g, C, cx, cy, w, h, rot) { box(g, cx, cy, w, h, rot, C.pad, h / 2); const d = dir(rot || 0); capsule(g, [cx - d[0] * (w / 2 - 6) + d[1] * h * 0.22, cy - d[1] * (w / 2 - 6) - d[0] * h * 0.22], [cx + d[0] * (w / 2 - 6) + d[1] * h * 0.22, cy + d[1] * (w / 2 - 6) - d[0] * h * 0.22], 1.3, C.padHi); },

  chat.sampleP = window.claude.use('sample');
  chat.sampleP.then(async (sample) => {
    if (!sample) { chat.off = 'הצ׳אט לא זמין בתצוגה הזאת.'; renderMsgs(); return; }
    try { const lim = await sample.limits(); chat.canImg = !!(lim && lim.images); } catch (e) { chat.canImg = false; }
    showImgBtns();
    if (!chat.canImg) $('#chatInput').placeholder = 'כתוב שם של מכשיר או תרגיל חלופי';
  }).catch(() => {});
  renderMsgs();
}
function openChat(exId) {
  fillCtx();
  if (exId) $('#chatCtx').value = exId;
  $('#chat').classList.add('open');
  if (!matchMedia('(min-width:1000px)').matches) document.body.style.overflow = 'hidden'; else $('#chatInput').focus();
}
function closeChat() { $('#chat').classList.remove('open'); document.body.style.overflow = ''; }
function wireChat() {
  $('#chatOpen').addEventListener('click', () => openChat(S.open));
  $('#chatClose').addEventListener('click', closeChat);
  $('#chatNew').addEventListener('click', () => { if (chat.ctl) chat.ctl.abort(); chat.msgs = []; chat.turns = []; setAttach(null); compNote(''); renderMsgs(); });
  $('#sendBtn').addEventListener('click', () => sendChat());
  const inp = $('#chatInput');
  inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); sendChat(); } });
  inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(120, inp.scrollHeight + 2) + 'px'; });
  $('#msgs').addEventListener('click', (ev) => {
    const b = ev.target.closest('.sug'); if (b) { sendChat(SUGS[+b.dataset.sug]); return; }
    const u = ev.target.closest('[data-unlog]'); if (u) undoLog(+u.dataset.unlog);
  });
  $('#camBtn').addEventListener('click', () => $('#camFile').click());
  $('#galBtn').addEventListener('click', () => $('#galFile').click());
  for (const id of ['#camFile', '#galFile']) $(id).addEventListener('change', (ev) => { const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; pickImage(f); });
  $('#attachX').addEventListener('click', () => setAttach(null));
}

/* ================================================================== boot */
let booted = false;
function boot(data) {
  if (booted) return; booted = true;
  data = data || {};
  document.documentElement.lang = 'he'; document.documentElement.dir = 'rtl';
  const d = loadLocal();
  if (d.sessions) S.sessions = d.sessions;
  if (typeof d.sound === 'boolean') S.sound = d.sound;
  if (Array.isArray(d.dirty)) S.dirty = new Set(d.dirty);
  if (Array.isArray(d.gone)) S.gone = new Set(d.gone);
  if (d.cfg) S.cfg = normCfg(d.cfg);
  if (d.pre && typeof d.pre === 'object') S.pre = d.pre;
  sweep();
  /* a workout that was already running before mesocycles existed joins the current one where it stands */
  for (const s of Object.values(S.sessions)) if (!s.end && !s.m) { stamp(s); touch(s, true); }
  S.tab = typeof data.tab === 'number' && data.tab >= 0 && data.tab < 4 ? data.tab : nextUp().next;
  if (Array.isArray(data.msgs)) chat.msgs = data.msgs;
  if (Array.isArray(data.turns)) chat.turns = data.turns;
  readColors(); wireApp(); wireCoach(); wireChat(); renderAll(); initChat();
  const s = live(S.tab), list = exList(S.tab, s), first = (data.open && list.find((e) => e.id === data.open)) || list.find((e) => firstUndone(s, e) >= 0) || list[0];
  if (first) { openEx(first.id, false); renderDock(); }
  initCloud(onRemoteChange);
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then((dl) => { if (dl) { S.dl = dl; renderHistory(); } }).catch(() => {});
}
(function () {
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ tab: S.tab, open: S.open, turns: chat.turns.slice(-16), msgs: chat.msgs.filter((m) => !m.live).slice(-24).map((m) => ({ role: m.role, text: m.text, hadImg: !!m.hadImg, ctx: m.ctx || '', note: m.note || '' })) })); } catch (e) { /* no live update here */ }
  try { if (hot && typeof hot.ready === 'function') { hot.ready(boot); setTimeout(() => boot({}), 1200); } else boot((hot && hot.data) || {}); } catch (e) { boot({}); }
})();
</script>
